<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

    <script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        // Overview pages name the open tab in their title, as the start page's sidebar does.
        const heroTitle = document.querySelector('[data-follows-tab]');
        if (heroTitle) {
            if (!heroTitle.dataset.defaultTitle) heroTitle.dataset.defaultTitle = heroTitle.textContent;
            heroTitle.textContent = activeTab.dataset.tabTitle || heroTitle.dataset.defaultTitle;
        }
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }
</script>

title": "Branch depth is the differentiator in bike and jewellery retail", "summary": "Vendit says all national bike manufacturers and wholesalers are connected, enabling ordering, supplier stock checks and booking in with frame and DPC numbers; it offers workshop functions, and in July 2026 partnered with the Federatie Goud en Zilver for jewellers, citing gemstone specifications, serial numbers and repair orders.", "implication": "Supplier connectivity and repair management are hard for generic POS vendors to copy; they justify the workshop and supplier bricks.", "priority": "high", "tags": ["branch", "suppliers", "repairs"], "sourceIds": ["vendit-bike", "vendit-fgz"], "linkedCustomers": [{"customerId": "wksp", "jobIds": ["wksp-repair"], "kpiIds": ["co-wksp-top", "co-wksp-b1"]}, {"customerId": "supl", "jobIds": ["supl-sellin"], "kpiIds": ["co-supl-top", "co-supl-b1"]}], "sources": [{"id": "vendit-bike", "title": "Kassasysteem voor de rijwielbranche", "url": "https://www.vendit.nl/automatiseringsoplossingen/branches-kassasysteem/kassasysteem-fietsenwinkel/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-fgz", "title": "Federatie Goud en Zilver en Vendit slaan de handen ineen", "url": "https://www.vendit.nl/nieuws/federatie-goud-en-zilver-en-vendit-slaan-de-handen-ineen/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-04", "title": "Franchise formulas and RSOs are a distinct segment", "summary": "Vendit markets a filiaal solution for retail service organisations with central price, promotion and assortment publication, joint purchasing and purchase-price formulas; the KW Groep (serving Blokker entrepreneurs) is a named reference.", "implication": "RSOs buy for many stores at once and need head-office tooling; model them separately from single-store owners.", "priority": "high", "tags": ["franchise", "rso"], "sourceIds": ["vendit-franchise", "vendit-home"], "linkedCustomers": [{"customerId": "rsoh", "jobIds": ["rsoh-formula"], "kpiIds": ["co-rsoh-top", "co-rsoh-b1", "co-rsoh-b2"]}], "sources": [{"id": "vendit-franchise", "title": "Retailsoftware en franchisesoftware", "url": "https://www.vendit.nl/automatiseringsoplossingen/franchiseorganisaties/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-home", "title": "Vendit - Kassasoftware, webshop, winkelautomatisering", "url": "https://www.vendit.nl/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-05", "title": "Marketplaces via EffectConnect, shipping via DeliveryMatch", "summary": "Vendit's marketplace module publishes stock, lead time, prices and content to bol, Amazon, VidaXL and Beslist via EffectConnect, imports orders with customer and payment data, and lets users print labels via DeliveryMatch; Vendit states more than 30% of European e-commerce purchases happen on marketplaces (vendor claim, source not given).", "implication": "Sibling integrations make omnichannel selling credible for small retailers without their own webshop; sync latency becomes a key quality metric.", "priority": "high", "tags": ["marketplaces", "katapull"], "sourceIds": ["vendit-marketplaces", "vendit-references"], "linkedCustomers": [{"customerId": "buyr", "jobIds": ["buyr-assortment"], "kpiIds": ["co-buyr-top", "co-buyr-b1-c2"]}, {"customerId": "ownr", "jobIds": ["ownr-omni"], "kpiIds": ["co-ownr-b2-c2-l2"]}], "sources": [{"id": "vendit-marketplaces", "title": "Marketplace module van Vendit", "url": "https://www.vendit.nl/modules/marketplaces-module/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-references", "title": "Klanten, referenties en praktijkcases", "url": "https://www.vendit.nl/referenties/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-06", "title": "Vendit is a founding brand of the Katapull group", "summary": "Katapull was formed in March 2025 by bundling Logic4, DeliveryMatch, EffectConnect, Highbiza and Vendit; Returnista was acquired in February 2026 and Picqer in October 2026. Katapull lists Vendit, Logic4, Highbiza, Returnista, EffectConnect, DeliveryMatch, Transus and Picqer as labels of its Commerce Hub, with Vendit and DeliveryMatch sharing an address in Rotterdam.", "implication": "Group membership gives Vendit integration partners and an upgrade path (Logic4) but also raises portfolio-overlap questions to be resolved in strategy.", "priority": "high", "tags": ["katapull", "ownership"], "sourceIds": ["katapull-home", "dic-katapull-2025", "dic-returnista-2026", "dic-picqer-2026"], "linkedCustomers": [{"customerId": "chnr", "jobIds": ["chnr-control"], "kpiIds": ["bo-chnr-top"]}, {"customerId": "buyr", "jobIds": ["buyr-assortment"], "kpiIds": ["bo-buyr-top"]}], "sources": [{"id": "katapull-home", "title": "Katapull - samen commerce bouwen", "url": "https://katapull.nl/", "publisher": "Katapull", "date": "2026-10-30"}, {"id": "dic-katapull-2025", "title": "Vijf softwarebedrijven bundelen krachten in Katapull", "url": "https://www.dutchitchannel.nl/news/603618/vijf-softwarebedrijven-bundelen-krachten-in-katapull", "publisher": "Dutch IT Channel", "date": "2026-10-30"}, {"id": "dic-returnista-2026", "title": "Katapull breidt e-commerce platform uit met overname Returnista", "url": "https://www.dutchitchannel.nl/news/724827/katapull-breidt-e-commerce-platform-uit-met-overname-returnista", "publisher": "Dutch IT Channel", "date": "2026-10-30"}, {"id": "dic-picqer-2026", "title": "Katapull breidt Commerce Hub uit met overname van Picqer", "url": "https://www.dutchitchannel.nl/news/762267/katapull-breidt-commerce-hub-uit-met-overname-van-picqer", "publisher": "Dutch IT Channel", "date": "2026-10-30"}]}, {"id": "vpos-07", "title": "Sibling integrations documented on Vendit partner pages", "summary": "Vendit's partner pages state that Highbiza and Transus are linked (\"gekoppeld\") with the Vendit System and list Logic4 (ERP), DeliveryMatch (shipping) and Returnista (returns) as Katapull partners; Sendcloud, Transsmart, Picqer, Exact/AFAS, CCV, Worldline and Givacard also appear.", "implication": "Evidence for Highbiza, Transus, EffectConnect and DeliveryMatch integration is explicit; Returnista and Logic4 integration depth is not documented and is modeled as an assumption.", "priority": "medium", "tags": ["integrations", "katapull"], "sourceIds": ["vendit-partners", "vendit-transus", "vendit-highbiza", "vendit-returnista", "vendit-logic4", "vendit-deliverymatch"], "linkedCustomers": [{"customerId": "supl", "jobIds": ["supl-sellin"], "kpiIds": ["co-supl-b1-c2"]}, {"customerId": "buyr", "jobIds": ["buyr-assortment"], "kpiIds": ["bo-buyr-b2"]}], "sources": [{"id": "vendit-partners", "title": "Partners en samenwerkingsverbanden", "url": "https://www.vendit.nl/partners/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-transus", "title": "Transus EDI is gekoppeld met het Vendit Systeem", "url": "https://www.vendit.nl/partners/transus/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-highbiza", "title": "Highbiza platform is gekoppeld met het Vendit Systeem", "url": "https://www.vendit.nl/partners/highbiza/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-returnista", "title": "Returnista - Vendit partner en onderdeel van Katapull", "url": "https://www.vendit.nl/partners/returnista/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-logic4", "title": "Logic4 - Vendit partner en onderdeel van Katapull", "url": "https://www.vendit.nl/partners/logic4/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-deliverymatch", "title": "DeliveryMatch - Vendit partner en onderdeel van Katapull", "url": "https://www.vendit.nl/partners/deliverymatch/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-08", "title": "Real-time stock is the core promise", "summary": "Vendit frames stock management around \"never sell no again\": every sale, return and reservation updates stock instantly in store and webshop, min/max replenishment creates the daily order list, and stock can be moved between branches.", "implication": "Stock accuracy is the hinge KPI for owners, associates and shoppers alike.", "priority": "high", "tags": ["inventory"], "sourceIds": ["vendit-stock"], "linkedCustomers": [{"customerId": "ownr", "jobIds": ["ownr-margin"], "kpiIds": ["co-ownr-b2", "co-ownr-b2-c1"]}, {"customerId": "cash", "jobIds": ["cash-serve"], "kpiIds": ["co-cash-b2"]}, {"customerId": "shop", "jobIds": ["shop-buy"], "kpiIds": ["co-shop-b1-c1"]}], "sources": [{"id": "vendit-stock", "title": "Voorraadbeheer software", "url": "https://www.vendit.nl/voorraadbeheersysteem-van-vendit/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-09", "title": "Retailers steer on a standard dashboard", "summary": "The online dashboard compares turnover, margin, discount, number of transactions, items sold, average transaction value and items per transaction with a previous period; reports include top/flop 100, turnover speed, stock valuation and negative margin. TSM Coatings says it steers on the dashboard daily.", "implication": "These measures are the vocabulary of the owner and chain KPI pyramids.", "priority": "medium", "tags": ["reporting"], "sourceIds": ["vendit-reports"], "linkedCustomers": [{"customerId": "ownr", "jobIds": ["ownr-margin"], "kpiIds": ["co-ownr-top", "co-ownr-b1"]}, {"customerId": "chnr", "jobIds": ["chnr-control"], "kpiIds": ["co-chnr-top"]}], "sources": [{"id": "vendit-reports", "title": "Kassasysteem rapportages", "url": "https://www.vendit.nl/modules/rapportages/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-10", "title": "Service as part of the product", "summary": "Vendit runs a helpdesk Monday to Saturday, offers remote support via TeamViewer and includes online help and updates in the subscription.", "implication": "Saturday support matters for retailers; support load is an early churn signal.", "priority": "medium", "tags": ["support"], "sourceIds": ["vendit-support", "vendit-pricing"], "linkedCustomers": [{"customerId": "cash", "jobIds": ["cash-serve"], "kpiIds": ["bo-cash-b1"]}, {"customerId": "ownr", "jobIds": ["ownr-margin"], "kpiIds": ["bo-ownr-b1-c2"]}], "sources": [{"id": "vendit-support", "title": "Vendit Customer Success", "url": "https://www.vendit.nl/support-op-afstand/", "publisher": "Vendit", "date": "2026-10-30"}, {"id": "vendit-pricing", "title": "Functionaliteiten en prijzen Vendit", "url": "https://www.vendit.nl/functionaliteiten/", "publisher": "Vendit", "date": "2026-10-30"}]}, {"id": "vpos-11", "title": "Competition ranges from global cloud POS to branch specialists", "summary": "Lightspeed reported FY2025 revenue of USD 1,076.8 million; MplusKASSA (since 1985) claims 6,000+ customers and 16k+ locations across hospitality and retail; branch specialists such as CycleSoftware and Wilmar target bike shops.", "implication": "Vendit competes on branch depth, Dutch service and the all-in package rather than global scale.", "priority": "medium", "tags": ["competition"], "sourceIds": ["lightspeed-fy2025", "mpluskassa-home"], "linkedCustomers": [{"customerId": "ownr", "jobIds": ["ownr-margin"], "kpiIds": ["bo-ownr-b1-c1"]}], "sources": [{"id": "lightspeed-fy2025", "title": "Lightspeed Announces Fourth Quarter and Full Year 2025 Financial Results", "url": "https://investors.lightspeedhq.com/English/newsroom/news-details/2025/Lightspeed-Announces-Fourth-Quarter-and-Full-Year-2025-Financial-Results-and-Provides-Outlook-for-Fiscal-2026/default.aspx", "publisher": "Lightspeed Commerce", "date": "2026-10-30"}, {"id": "mpluskassa-home", "title": "MplusKASSA", "url": "https://www.mpluskassa.nl/", "publisher": "MplusKASSA", "date": "2026-10-30"}]}, {"id": "vpos-12", "title": "Loyalty and gift cards drive repeat visits", "summary": "Vendit supports customer cards with unique barcodes, value cheques and own gift cards via Givacard; a partner quote cites that gift card holders spend about 61% more (partner claim, not independently sourced).", "implication": "Loyalty supports sales on name, which feeds repairs, history and marketing; treat spend uplift as unverified.", "priority": "low", "tags": ["loyalty"], "sourceIds": ["vendit-loyalty"], "linkedCustomers": [{"customerId": "shop", "jobIds": ["shop-buy"], "kpiIds": ["bo-shop-top", "bo-shop-b1"]}], "sources": [{"id": "vendit-loyalty", "title": "Loyaliteitsmodule", "url": "https://www.vendit.nl/modules/loyaliteitsmodule/", "publisher": "Vendit", "date": "2026-10-30"}]}]};

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');

    function customerLookup() {

        customers.forEach(group => {
            group.customers.forEach(customer => {

    function jobNamesForCustomer(customer, jobIds) {
        const jobs = ((customer || {}).jobsToBeDone || []);
        const jobLookup = {};
        jobs.forEach(job => {
            if (job.id) {
                jobLookup[job.id] = job.name || job.id;
            }
        });
        return (jobIds || []).map(jobId => jobLookup[jobId] || jobId);
    }

    function kpiLookupForCustomer(customer) {
        const lookup = {};
        function walk(node) {
            if (!node) return;
            if (node.id) {
                lookup[node.id] = node.name || node.id;
            }
            (node.branches || []).forEach(walk);
            (node.children || []).forEach(walk);
        }
        const pyramids = (customer || {}).kpiPyramids || {};
        ['customerOutcomes', 'businessOutcomes'].forEach(key => {
            const pyramid = pyramids[key];
            if (!pyramid) return;
            walk(pyramid.top);
            (pyramid.branches || []).forEach(walk);
        });
        return lookup;
    }

    function kpiNamesForCustomer(customer, link) {
        // Prefer stable KPI IDs; fall back to legacy display-name kpis.
        if (link && link.kpiIds && link.kpiIds.length) {
            const lookup = kpiLookupForCustomer(customer);
            return link.kpiIds.map(kpiId => lookup[kpiId] || kpiId);
        }
        return (link && link.kpis) || [];
    }

    function customerMatchesSearch(customer, groupName, query) {

        const haystack = [customer.id, customer.name, customer.description, groupName]
            .concat(customer.careAbout || [], customer.winsThem || [], customer.theirFear || [])
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.includes(query);

    function renderCustomers() {
        const searchInput = document.getElementById('CustomerSearch');

            const initialQuery = new URLSearchParams(window.location.search).get('q');
            if (initialQuery && searchInput) searchInput.value = initialQuery;
        }
        const query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        if (window.history && window.history.replaceState) {
            const params = new URLSearchParams(window.location.search);
            if (query) params.set('q', query); else params.delete('q');
            const qs = params.toString();
            window.history.replaceState({}, '', window.location.pathname + (qs ? '?' + qs : '') + window.location.hash);
        }
        let visible = 0;
        let total = 0;
        let html = '<div style="padding: 12px">';

        customers.forEach(group => {
            total += group.customers.length;
            const matching = group.customers.filter(customer => customerMatchesSearch(customer, group.group, query));
            visible += matching.length;
            if (!matching.length) return;
            html += '<div class="customer-group">';
            html += '<div class="customer-group-label">' + escapeHtml(group.group) + '</div>';
            matching.forEach(customer => {

    function renderRelations() {
        const allRels = (relations.relations || []);
        const container = document.getElementById('tab_content_relations');
        if (!allRels.length) {
            container.innerHTML = '<div style="padding:16px;color:#6b7280">No customer relations defined for this domain yet.</div>';
            return;
        }

        const lookup = customerLookup();
        const types = relations.relationTypes || [];
        const typeById = {};
        types.forEach(type => {
            typeById[type.id] = type;
            if (!(type.id in relationTypeState)) relationTypeState[type.id] = true;
        });
        allRels.forEach(rel => {
            if (!(rel.type in relationTypeState)) relationTypeState[rel.type] = true;
        });
        const colorFor = typeId => (typeById[typeId] || {}).color || '#64748b';
        const rels = allRels.filter(rel => relationTypeState[rel.type]);

        // Nodes: customers that participate in at least one relation (regardless of
        // the type filter, so toggling never rearranges the ring), in group order.
        const nodeIds = [];
        customers.forEach(group => (group.customers || []).forEach(customer => {
            if (allRels.some(rel => rel.from === customer.id || rel.to === customer.id)) {
                nodeIds.push(customer.id);
            }
        }));

        const W = 1000, H = 660, cx = W / 2, cy = H / 2 - 14, rx = 385, ry = 235;
        const pos = {};
        nodeIds.forEach((id, i) => {
            const angle = -Math.PI / 2 + (i * 2 * Math.PI) / nodeIds.length;
            pos[id] = { x: cx + rx * Math.cos(angle), y: cy + ry * Math.sin(angle) };
        });

        let svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="Customer relations diagram">';
        svg += '<defs>';
        const markerTypes = {};
        rels.forEach(rel => { markerTypes[rel.type || 'default'] = colorFor(rel.type); });
        Object.entries(markerTypes).forEach(([typeId, color]) => {
            svg += '<marker id="rel-arrow-' + escapeHtml(typeId) + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">';
            svg += '<path d="M 0 1 L 9 5 L 0 9 z" fill="' + escapeHtml(color) + '"/></marker>';
        });
        svg += '</defs>';

        const NODE_R = 44;
        rels.forEach(rel => {
            const p1 = pos[rel.from], p2 = pos[rel.to];
            if (!p1 || !p2) return;
            const dx = p2.x - p1.x, dy = p2.y - p1.y;
            const len = Math.hypot(dx, dy) || 1;
            const ux = dx / len, uy = dy / len;
            const sx = p1.x + ux * (NODE_R + 4), sy = p1.y + uy * (NODE_R + 4);
            const ex = p2.x - ux * (NODE_R + 10), ey = p2.y - uy * (NODE_R + 10);
            // Curve every edge to its left so A→B and B→A separate visually.
            const mx = (sx + ex) / 2 - uy * 34, my = (sy + ey) / 2 + ux * 34;
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            svg += '<path class="relation-edge" d="M ' + sx.toFixed(1) + ' ' + sy.toFixed(1) +
                ' Q ' + mx.toFixed(1) + ' ' + my.toFixed(1) + ' ' + ex.toFixed(1) + ' ' + ey.toFixed(1) + '"' +
                ' fill="none" stroke="' + escapeHtml(colorFor(rel.type)) + '" stroke-width="2.5"' +
                ' marker-end="url(#rel-arrow-' + escapeHtml(rel.type || 'default') + ')">';
            svg += '<title>' + escapeHtml(fromName + ' → ' + toName + ': ' + (rel.name || '')) + '</title></path>';
        });

        nodeIds.forEach(id => {
            const customer = lookup[id] || {};
            const p = pos[id];
            const icon = 'icons/' + (customer.icon || (id + '.png'));
            svg += '<a class="relation-node" href="landing_pages/' + escapeHtml(id) + '.html">';
            svg += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + NODE_R + '" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>';
            svg += '<image href="' + escapeHtml(icon) + '" x="' + (p.x - 30).toFixed(1) + '" y="' + (p.y - 30).toFixed(1) + '" width="60" height="60"/>';
            const words = String(customer.name || id).split(' ');
            const lines = [];
            words.forEach(word => {
                if (lines.length && (lines[lines.length - 1] + ' ' + word).length <= 16) {
                    lines[lines.length - 1] += ' ' + word;
                } else {
                    lines.push(word);
                }
            });
            svg += '<text x="' + p.x.toFixed(1) + '" y="' + (p.y + NODE_R + 18).toFixed(1) + '" text-anchor="middle">';
            lines.forEach((line, i) => {
                svg += '<tspan x="' + p.x.toFixed(1) + '" dy="' + (i === 0 ? 0 : 15) + '">' + escapeHtml(line) + '</tspan>';
            });
            svg += '</text></a>';
        });
        svg += '</svg>';

        let html = '<div class="relations-section">';
        if (relations.description) {
            html += '<div class="relations-intro">' + escapeHtml(relations.description) + '</div>';
        }
        (relations.media || []).forEach(entry => {
            if (entry && entry.type === 'image' && entry.src) {
                html += '<div class="relations-media"><img src="' + escapeHtml(entry.src) + '"' +
                    ' alt="' + escapeHtml(entry.alt || '') + '" title="' + escapeHtml(entry.title || '') + '"></div>';
            }
        });
        html += '<div class="relations-legend">';
        Object.keys(relationTypeState).forEach(typeId => {
            const type = typeById[typeId] || { id: typeId };
            const count = allRels.filter(rel => rel.type === typeId).length;
            html += '<span class="relations-legend-item' + (relationTypeState[typeId] ? '' : ' off') + '"' +
                ' onclick="toggleRelationType(\'' + escapeHtml(typeId) + '\')"' +
                ' title="' + escapeHtml(type.description || '') + '">';
            html += '<span class="relations-legend-swatch" style="background:' + escapeHtml(type.color || '#64748b') + '"></span>';
            html += escapeHtml(type.name || typeId) + ' (' + count + ')';
            html += '</span>';
        });
        html += '<span class="relations-legend-hint">Click a type to show or hide its relations.</span>';
        html += '</div>';
        html += '<div class="relations-diagram-wrap">' + svg + '</div>';

        html += '<div class="relations-table-wrap"><table class="relations-table">';
        html += '<tr><th>From</th><th>To</th><th>Type</th><th>Relation</th><th>Description</th><th>Via streams</th></tr>';
        if (!rels.length) {
            html += '<tr><td colspan="6" class="relations-empty-row">All relation types are switched off — click a type above to show its relations.</td></tr>';
        }
        rels.forEach(rel => {
            const fromName = (lookup[rel.from] || {}).name || rel.from;
            const toName = (lookup[rel.to] || {}).name || rel.to;
            const type = typeById[rel.type] || {};
            html += '<tr>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.from) + '.html">' + escapeHtml(fromName) + '</a></td>';
            html += '<td class="relation-endpoint"><a href="landing_pages/' + escapeHtml(rel.to) + '.html">' + escapeHtml(toName) + '</a></td>';
            html += '<td><span class="relation-type-chip" style="background:' + escapeHtml(colorFor(rel.type)) + '">' + escapeHtml(type.name || rel.type || '') + '</span></td>';
            html += '<td class="relation-name-cell">' + escapeHtml(rel.name || '') + '</td>';
            html += '<td>' + escapeHtml(rel.description || '') + '</td>';
            html += '<td class="relation-streams">' + (rel.streamIds || []).map(escapeHtml).join('<br>') + '</td>';
            html += '</tr>';
        });
        html += '</table></div></div>';
        container.innerHTML = html;
    }

    update();
    renderVisualOverview();
    renderRelations();
    renderInsights();
    renderLinks();
    updateTabLabels();
</script>
<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../start/index.html",
      "label": "Retail POS and Store Management Platform Home"
    },
    {
      "label": "Customers"
    }
  ]
};
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>
