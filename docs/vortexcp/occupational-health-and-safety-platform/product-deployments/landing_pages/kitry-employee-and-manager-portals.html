    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 24px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

            border-bottom-color: #1d4ed8;
        }

<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        // Overview pages name the open tab in their title, as the start page's sidebar does.
        const heroTitle = document.querySelector('[data-follows-tab]');
        if (heroTitle) {
            if (!heroTitle.dataset.defaultTitle) heroTitle.dataset.defaultTitle = heroTitle.textContent;
            heroTitle.textContent = activeTab.dataset.tabTitle || heroTitle.dataset.defaultTitle;
        }
        // A tab may describe itself; otherwise the page's own subtitle stays.
        const heroSubtitle = document.querySelector('[data-follows-tab-subtitle]');
        if (heroSubtitle) {
            if (!heroSubtitle.dataset.defaultSubtitle) heroSubtitle.dataset.defaultSubtitle = heroSubtitle.textContent.trim();
            heroSubtitle.textContent = activeTab.dataset.tabSubtitle || heroSubtitle.dataset.defaultSubtitle;
        }
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }

    // In-page links to another tab (e.g. the top bar's Insights link on the
    // Customers page) only change the hash; switch to that tab.
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
            openTab(hash, {updateHistory: false});
        }
    });
</script>

    const productStreams = [{"id": "maintain-workforce-and-exposure-data", "name": "Maintain workforce and exposure data", "icon": "maintain-workforce-and-exposure-data.png", "group": "Occupational Health Streams", "description": "Keep a current register of every worker, contract, assignment, site and workstation from HRIS feeds and the customer's organisational structure, and attach to each workstation the exposure and risk profile (night work, chemical, biological and physical agents, safety-critical posts, Belgian 'postes de vigilance' and 'postes \u00e0 risque d\u00e9fini') that determines which surveillance category applies. This is the connected record on which convocations, fitness opinions, the risk assessment, event declarations and every annual report rely: when HR moves a worker to a new post, the platform knows the new exposures and the surveillance it triggers.", "outcomes": ["Every active worker has a current assignment, workstation and exposure profile, so surveillance is derived rather than decided by hand", "HRIS changes (hire, transfer, contract end, long absence) reach the medical service within a day and trigger the right visit automatically", "Workstation exposure profiles are shared by the physician and the prevention adviser, so the medical and the safety view of a post never diverge", "Data quality exceptions (workers without a workstation, workstations without an exposure profile, duplicates) are visible and worked down"], "bricksUsed": ["mpor"]}, {"id": "plan-and-schedule-medical-surveillance", "name": "Plan and schedule medical surveillance", "icon": "plan-and-schedule-medical-surveillance.png", "group": "Occupational Health Streams", "description": "Turn surveillance rules and periodicity per country and per profile into a plan the service can deliver: the list of visits due per month and site (visite d'information et de pr\u00e9vention, examen m\u00e9dical d'aptitude under suivi individuel renforc\u00e9, Belgian periodic health assessment, visites de reprise and pr\u00e9-reprise, mid-career visits), a capacity plan per physician and nurse, convocations sent by e-mail or Cegedim SMS with self-service slot choice, reminders that cut no-shows, and a live view of periodicity compliance per site. The service manager steers scarce medical time toward the visits that are legally due first.", "outcomes": ["Periodic surveillance compliance stays above target with the physicians and nurses the service actually has", "Convocations go out automatically with the right visit type, duration and examiner, and workers choose or reschedule slots themselves", "No-shows drop because reminders reach workers by SMS and e-mail and managers see who is released for a visit", "Overdue and at-risk visits are visible per site months in advance, not after the annual report"], "bricksUsed": ["schd", "mpor", "epor"]}, {"id": "conduct-examinations-and-teleconsultations", "name": "Conduct examinations and teleconsultations", "icon": "conduct-examinations-and-teleconsultations.png", "group": "Occupational Health Streams", "description": "Run a complete examination from convocation to signed opinion: the worker completes the pre-visit questionnaire privately in the portal, the nurse runs intake and screenings with connected audiometry, spirometry and vision devices whose readings land directly in the record, the physician works in a consultation workspace that shows the file, exposures and history, issues the fitness-for-work opinion with restrictions and accommodations, signs it electronically through Goodflag, and can run the whole conversation as a secure Vonage teleconsultation where the law and the visit type allow. Nurse visits and vaccination or health campaigns run on the same workspace at scale.", "outcomes": ["Every examination ends with a documented, signed fitness opinion on the day of the visit, with restrictions the employer can apply", "Screening results from connected devices are captured without retyping, cutting data capture errors and consultation documentation time", "Pre-visit questionnaires completed in advance shorten the intake and let the physician focus on the clinical conversation", "Teleconsultation extends physician reach to remote sites and follow-ups without moving medical data outside the HDS environment", "Vaccination and health campaigns reach the whole eligible population with individual records in the file"], "bricksUsed": ["ques", "tele", "mdoc", "schd", "epor", "mpor"]}, {"id": "keep-the-occupational-medical-file", "name": "Keep the occupational medical file", "icon": "keep-the-occupational-medical-file.png", "group": "Occupational Health Streams", "description": "Keep one complete and confidential occupational medical file per worker (the French DMST under law 2021-1018 and decree 2022-1434, the Belgian health file of the Codex, the Luxembourg and Dutch equivalents): every consultation, measurement, questionnaire, document, exposure and opinion in one place, under medical secrecy with access segregated between physician, nurse, medical secretary, HR and manager; retention for the legal period after the end of exposure; transfer of the file when the worker changes service or employer; and interoperability with national health records such as the French Dossier M\u00e9dical Partag\u00e9 where the worker consents.", "outcomes": ["The medical file is complete and follows the worker across sites, services and employers, so the physician always examines with the full history", "Medical secrecy is enforced by design: HR and managers never see medical content, and every access is logged", "Files are retained for the legal period (40 years after the last visit for a French DMST) and destroyed or archived on schedule", "Transfers between services and interoperability with national records are handled with consent and traceability"], "bricksUsed": ["mdoc", "epor"]}, {"id": "assess-and-control-workplace-risks", "name": "Assess and control workplace risks", "icon": "assess-and-control-workplace-risks.png", "group": "Workplace Safety and Event Streams", "description": "Maintain a living risk assessment per workstation, unit and site \u2014 the French DUERP (document unique d'\u00e9valuation des risques professionnels), the Belgian global prevention plan and annual action plan built on the dynamic risk management system, the Luxembourg risk inventory and the Dutch RI&E with its plan van aanpak \u2014 with prevention measures, residual risk, the annual update and consultation of the CSE or CPPT, and the evidence an ISO 45001 management system needs. The prevention adviser assesses with site managers, the physician contributes the health view, and the action plan flows into follow-up.", "outcomes": ["The risk assessment is current for every workstation and updated when the workplace changes, not just once a year before the inspection", "Prevention measures and residual risks are linked to the exposures the medical service surveils, so health and safety reason from the same facts", "The annual update, the CSE/CPPT consultation and the action plan (PAPRIPACT, annual action plan) are produced from the assessment, not rewritten", "ISO 45001 clauses on hazard identification, legal requirements and planning are evidenced from the same data"], "bricksUsed": ["actn", "mpor", "hazs"]}, {"id": "report-and-resolve-hazardous-situations", "name": "Report and resolve hazardous situations", "icon": "report-and-resolve-hazardous-situations.png", "group": "Workplace Safety and Event Streams", "description": "Take a hazardous situation reported from the floor, a near miss, an inspection observation or an audit non-conformity to a corrective action that is assigned, followed and closed with evidence. Employees and managers report from the portal or a phone with photo and location; the prevention adviser qualifies and assigns; the site manager fixes and proves it; the HSE manager watches closure rates and repeat situations. Inspections, safety walks and compliance checks (fire, lifting equipment, electrical, PPE) run on checklists that produce actions in the same plan.", "outcomes": ["Hazardous situations reach the prevention adviser within minutes with photo and location, and the reporter sees what happened to the report", "Corrective actions are owned, dated and closed with evidence, with closure rates visible per site", "Inspections and safety walks run on checklists and turn findings into actions without re-entry", "Repeat situations and slow closures are visible so that prevention resources go where they matter"], "bricksUsed": ["hazs", "actn", "epor", "mpor"]}, {"id": "track-chemical-products-and-exposures", "name": "Track chemical products and exposures", "icon": "track-chemical-products-and-exposures.png", "group": "Workplace Safety and Event Streams", "description": "Keep the chemical product inventory per site and workstation with its safety data sheets, CLP hazard classification, hazard statements and occupational exposure limits (French VLEP, Belgian and Dutch limit values), identify CMR (carcinogenic, mutagenic, reprotoxic) agents and dangerous chemical agents, define homogeneous exposure groups, record workstation exposure with frequency and duration, and feed the exposure profiles that drive reinforced medical surveillance and the individual exposure history a Fedris or CPAM occupational disease file will need decades later. Substitution of CMR products and inspection readiness are the prevention adviser's daily concerns.", "outcomes": ["Every product used on site has a current safety data sheet, a hazard classification and a list of workstations where it is used", "CMR and dangerous chemical agents are identified and their exposed workers are under the reinforced surveillance the law requires", "Workstation exposure records exist per worker with product, duration and protection, ready for an occupational disease claim or an inspection", "Substitution and reduction of hazardous products is planned and measured"], "bricksUsed": ["actn", "mpor", "mdoc"]}, {"id": "declare-and-analyse-accidents-and-occupational-diseases", "name": "Declare and analyse accidents and occupational diseases", "icon": "declare-and-analyse-accidents-and-occupational-diseases.png", "group": "Workplace Safety and Event Streams", "description": "Take a work accident, commuting accident or occupational disease from the first report to declaration on the right national form within the legal delay \u2014 the French employer declaration to the CPAM within 48 hours on CERFA or net-entreprises, the Belgian declaration to the work accident insurer within 8 calendar days with immediate notification of serious accidents to the labour inspection, Fedris for occupational diseases, the Luxembourg AAA, the Dutch Arbeidsinspectie for serious accidents \u2014 then root-cause analysis with the prevention adviser and the physician, frequency and severity statistics, and follow-up of absence, recognition and return to work with HR and the medical service.", "outcomes": ["Every accident is declared on the right form within the legal delay with the facts, witnesses and injuries recorded once", "Serious accidents are notified immediately and analysed with a documented root cause and corrective actions", "Frequency and severity rates per site are computed from the platform and match what is reported to Fedris, insurers and the CSE/CPPT", "Occupational disease cases are followed from suspicion to recognition with the exposure history attached", "Absence, restrictions and return to work after an accident are coordinated between HR and the medical service"], "bricksUsed": ["acci", "actn", "mpor"]}, {"id": "serve-employees-and-managers-through-portals", "name": "Serve employees and managers through portals", "icon": "serve-employees-and-managers-through-portals.png", "group": "Experience and Insight Streams", "description": "Give every employee and every manager a role-based portal on the same platform: employees book and reschedule visits, complete questionnaires privately, download their certificates and vaccination record, join a teleconsultation and report a safety concern, in French, Dutch or English, with SSO or an SMS code; managers see the fitness clearance and restrictions of their team without medical content, release workers for visits, own corrective actions and record accidents. More than half of the workers at Kitry's French, Belgian and Luxembourg customers use self-service, which relieves the medical service of the administrative load and gives managers a lawful view of team fitness.", "outcomes": ["Most workers manage their own visits and documents, cutting administrative work in the medical service", "Managers know who on their team is cleared, restricted or overdue for a visit, without ever seeing a diagnosis", "Questionnaires are completed before the visit under medical secrecy, shortening consultation time", "Safety concerns and accidents are reported from the floor within minutes and followed to closure"], "bricksUsed": ["epor", "mpor", "schd", "ques", "mdoc", "hazs", "tele", "acci", "actn"]}, {"id": "monitor-health-and-safety-performance", "name": "Monitor health and safety performance", "icon": "monitor-health-and-safety-performance.png", "group": "Experience and Insight Streams", "description": "Turn cross-module data into steering: dashboards and KPIs for the service manager, the HSE manager and the employer (surveillance coverage, medical capacity utilisation, accident rates, action closure, chemical inventory completeness), the regulatory and annual reports each country expects (the French annual activity report of the occupational physician and the SPST, the Belgian annual report of the internal prevention service and the global prevention plan follow-up, the Dutch RI&E follow-up, ISO 45001 management review inputs), and collective health monitoring that links exposures to anonymised health indicators to advise the employer on prevention.", "outcomes": ["Service and HSE managers steer from live indicators instead of learning the position from the annual report", "Annual and regulatory reports are produced from the platform in a fraction of the preparation time, with consistent figures", "Collective health monitoring turns individual findings into prevention advice without breaching individual secrecy", "The employer, the CSE/CPPT and the authorities receive consistent, traceable figures"], "bricksUsed": ["actn"]}, {"id": "deploy-migrate-and-train-a-customer", "name": "Deploy, migrate and train a customer", "icon": "deploy-migrate-and-train-a-customer.png", "group": "Delivery and Integration Streams", "description": "Take a new organisation from contract to go-live and beyond on Kitry's four-phase method \u2014 functional assessment, configuration, project management and training \u2014 with data migration of decades of medical files, exposure histories and accident records from legacy systems, change management for physicians, nurses, HSE, HR, managers and employees, and after go-live the regulatory and product release train, support and a dedicated account manager. Kitry's consultants run this on the same platform, on shared or dedicated HDS SaaS, for customers such as SNCF, Ville de Paris, Umicore or BNP.", "outcomes": ["Customers go live on schedule with their data migrated, their configuration validated by the physician and HSE, and their users trained", "Migration defects are found and fixed before go-live, so no medical file or exposure history is lost", "Regulatory and product releases reach every customer without disruption and with the right functional communication", "Support requests are resolved within target and the account manager grows the modules and self-service adoption"], "bricksUsed": ["epor"]}, {"id": "integrate-with-hr-devices-and-ecosystem", "name": "Integrate with HR, devices and the ecosystem", "icon": "integrate-with-hr-devices-and-ecosystem.png", "group": "Delivery and Integration Streams", "description": "Connect the platform to the systems around it so that data flows without re-entry and the platform stays inside its certified boundary: HRIS synchronisation, SSO with the customer's identity provider, Goodflag electronic signature, Vonage teleconsultation, Cegedim SMS, connected measurement devices from Eolys, FIM, Essilor, JLM Medical and Siemens, national reporting connectors for accident and disease declarations, and the shared or dedicated HDS/ISO 27001 hosting environments in the EEA that every integration must respect.", "outcomes": ["HR changes, signatures, video sessions, SMS and device readings flow into the platform without re-entry and without medical data leaving the HDS boundary", "New customers connect their HRIS and identity provider with standard connectors rather than projects", "Device and partner integrations are monitored so that a failed connector is seen before a consultation day is disrupted", "National reporting connectors keep declarations working when portals and forms change"], "bricksUsed": ["mdoc", "tele"]}];
    const productCustomers = [{"id": "empl", "name": "Employee", "icon": "customer-empl-portrait.jpg", "group": "HR and Employees", "description": "Any of the four million-plus workers whose employers run their occupational health and safety on the platform: a warehouse operator on night shifts at a logistics depot, a process operator at a chemical plant, a nurse in a hospital, a bus driver, a city gardener, a researcher in a laboratory or a bank clerk in France, Belgium, Luxembourg or the Netherlands. Meets the occupational health service a few times a year at most, usually because a convocation arrived, and wants the visit to cost as little time and worry as possible. Uses the employee portal, when the employer has rolled it out and the service has earned trust, to book and move visits, complete questionnaires privately, download certificates and attestations, join teleconsultations and health campaigns and report a hazardous situation. Cares above all that the employer, the manager and HR never see medical content, that the visit does not cost a day of travel or a lost shift, and that raising a safety concern leads to something. More than half of employees at Kitry's French, Belgian and Luxembourg customers use self-service features; the persona is written for those who do and those who have not yet been convinced.", "careAbout": ["Being certain that questionnaire answers, examination results and anything said to the physician stay under medical secrecy, out of reach of the manager, HR and the employer", "Knowing when a visit is due and why, and choosing or moving the slot around shifts, childcare and workload without phoning anyone", "Losing as little working time as possible per visit, with teleconsultation when the physician allows it and screenings done in one pass", "Having certificates, attestations of exposure and vaccination records at hand when changing job, retiring or seeing a personal doctor", "Reporting a hazard or near miss from the floor in a minut n the date is impossible", "Being able to show an inspector or the CSSCT that restrictions were applied and hazards acted on, with dates"]}];

    // Derive this product's deployed bricks and the channels they ship to from
    // deployment.json (deployedBricks[].usedInProducts). products.json no longer carries
    // brick/channel links.
    function buildProductDeployment() {
        const channelMeta = {};   // ref -> {ref, groupId, groupName, channelName, channelType, ...}
        const bricks = {};        // brickId -> {brickId, brickName, description, channelRefs:Set}
        (deployment.channels || []).forEach(group => {
            (group.channels || []).forEach(channel => {
                const ref = (group.groupId || '') + '/' + (channel.subChannelId || '');
                (channel.deployedBricks || []).forEach(deployed => {
                    const use = (deployed.usedInProducts || []).find(item => item.productId === product.id);
                    if (!use) {
                        return;
                    }
                    if (!channelMeta[ref]) {
                        channelMeta[ref] = {
                            ref: ref,
                            groupId: group.groupId || '',
                            groupName: group.groupName || prettifyChannelGroup(group.groupId || 'other'),
                            groupDescription: group.description || '',
                            name: channel.subChannelName || channel.subChannelId || ref,
                            channelId: channel.subChannelId || '',
                            channelType: channel.channelType || '',
                            description: channel.description || '',
                            bricks: []
                        };
                    }
                    if (!bricks[deployed.brickId]) {
                        bricks[deployed.brickId] = {
                            brickId: deployed.brickId,
                            brickName: deployed.brickName || deployed.brickId,
                            description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name),
                            channelRefs: new Set()
                        };
                    }
                    bricks[deployed.brickId].channelRefs.add(ref);
                    channelMeta[ref].bricks.push({
                        brickId: deployed.brickId,
                        brickName: deployed.brickName || deployed.brickId,
                        deploymentRole: deployed.deploymentRole || '',
                        description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name)
                    });
                });
            });
        });
        return {channelMeta: channelMeta, bricks: Object.values(bricks)};
    }

    // A usage note that only says "<brick> in <product>" repeats the names around it; drop it.
    function meaningfulUsageNote(note, brickName, productName) {
        const normalize = value => String(value || '').toLowerCase().replace(/[.\s]+$/, '').replace(/\s+/g, ' ').trim();
        const text = normalize(note);
        if (!text) return '';
        return text === normalize((brickName || '') + ' in ' + (productName || '')) ? '' : note;
    }

    let productDeploymentCache = null;
    function productDeployment() {
        if (!productDeploymentCache) {
            productDeploymentCache = buildProductDeployment();
        }
        return productDeploymentCache;
    }

        }
    });

    function addChannels() {
        const groups = getDeploymentChannelGroups();
        let html = '<div class="ch-page">';
        html += '<div class="pl-section-title">Deployment channels</div>';
        html += '<div class="pl-section-note">Where this product\'s bricks run, one channel per row: the channel on the left, the bricks it ships for this product on the right.</div>';
        if (!groups.length) {
            html += '<div class="activity-muted">No deployment channels defined for this product.</div>';
        }
        groups.forEach(group => {
            html += '<section class="ch-group">';
            html += '<div class="ch-group-head"><span class="ch-group-title">' + escapeHtml(group.name) + '</span>' +
                '<span class="ch-group-count">' + group.channels.length + (group.channels.length === 1 ? ' channel' : ' channels') + '</span></div>';
            if (group.description) {
                html += '<div class="ch-group-description">' + escapeHtml(group.description) + '</div>';

            group.channels.forEach(channel => { html += renderChannelRow(channel); });
            html += '</section>';
        });
        html += '</div>';
        document.getElementById('Channels').innerHTML = html;

    function renderChannelRow(channel) {
        const color = channelColor(channel.ref);
        const bricks = channel.bricks || [];
        let html = '<div class="ch-row" style="border-left-color:' + color + '">';

        html += '<div class="ch-info">';
        html += '<div class="ch-info-head">';
        html += '<div class="ch-icon" style="background:' + hexToRgba(color, 0.12) + ';">' + renderDeploymentIcon(channel) + '</div>';
        html += '<div class="ch-titles"><a class="ch-title" href="../deployment/' + encodeURIComponent(channel.channelId || '') + '.html">' + escapeHtml(channel.name || channel.ref) + '</a>';
        html += '<div class="ch-meta">' + escapeHtml(formatChannelPart(channel.deploymentPart)) + ' · ' + escapeHtml(channel.channelId || channel.ref) + '</div></div>';
        html += '</div>';
        if (channel.deploymentUnit) {
            html += '<div class="ch-description">' + escapeHtml(channel.deploymentUnit) + '</div>';
        }
        if (channel.pipeline) {
            html += '<div class="ch-description"><strong>Pipeline:</strong> ' + escapeHtml(channel.pipeline) + '</div>';
        }
        html += '</div>';

        html += '<div class="ch-bricks">';
        html += '<div class="ch-bricks-label">' + bricks.length + (bricks.length === 1 ? ' brick' : ' bricks') + ' for this product</div>';
        if (!bricks.length) {
            html += '<div class="activity-muted">No bricks deployed here for this product.</div>';
        } else {
            html += '<div class="ch-brick-grid">' + bricks.map(brick => {
                let item = '<a class="ch-brick" href="' + getBrickLandingPageHref(brick.brickId) + '">';
                item += renderSmallBrickIcon(brick.brickId, brick.brickName);
                item += '<span class="ch-brick-text"><span class="ch-brick-name">' + escapeHtml(brick.brickName || brick.brickId) + '</span>';
                const copy = brick.description;
                if (copy) item += '<span class="ch-brick-copy">' + escapeHtml(copy) + '</span>';
                return item + '</span></a>';
            }).join('') + '</div>';
        }
        html += '</div>';

        return html + '</div>';
    }

    function addBricks() {
        let html = '';
        html += '<div class="home-stage">';

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');

    function channelColor(ref) {

        const value = ref || 'channel';
        let hash = 0;
        for (let i = 0; i < value.length; i++) {
            hash = ((hash << 5) - hash) + value.charCodeAt(i);
            hash |= 0;
        }
        return palette[Math.abs(hash) % palette.length];
    }

        }
        if (text.includes('cloud') || text.includes('runtime') || text.includes('edge') || text.includes('cdn')) {

    function hexToRgba(hex, alpha) {
        const value = (hex || '#6b7280').replace('#', '');
        const normalized = value.length === 3
            ? value.split('').map(part => part + part).join('')
            : value;
        const intValue = parseInt(normalized, 16);
        const r = (intValue >> 16) & 255;
        const g = (intValue >> 8) & 255;
        const b = intValue & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function slugify(value) {

            .toLowerCase()

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')

    }

    function mermaidNodeId(prefix, value) {

    function buildDependencyModel() {
        const channels = {};
        const bricks = {};

        const derived = productDeployment();
        derived.bricks.forEach(brick => {
            bricks[brick.brickId] = {
                id: brick.brickId,
                name: brick.brickName || brick.brickId,
                whyNeeded: brick.description || '',
                channelRefs: Array.from(brick.channelRefs)
            };
        });
        Object.values(derived.channelMeta).forEach(channel => {
            channels[channel.ref] = {
                id: channel.ref,
                name: channel.name || channel.ref,
                channelId: channel.channelId || '',
                part: channel.channelType || '',
                environmentName: channel.environmentName || '',
                deploymentUnit: channel.description || '',
                pipeline: ''
            };
        });

        return {
            channels: Object.values(channels).sort((a, b) => a.name.localeCompare(b.name)),
            bricks: Object.values(bricks).sort((a, b) => a.name.localeCompare(b.name))
        };
    }

    function ensureDependencyState() {
        if (dependencyState.initialized) {

        const model = buildDependencyModel();
        model.channels.forEach(item => {

        });
        model.bricks.forEach(item => {

        });
        dependencyState.initialized = true;
    }

    function buildDependencyGraph(model) {
        const visibleChannels = new Set(model.channels.filter(item => dependencyState.channels[item.id] !== false).map(item => item.id));
        const visibleBricks = new Set(model.bricks.filter(item => dependencyState.bricks[item.id] !== false).map(item => item.id));

        const lines = ['flowchart LR'];
        const channelDefs = [];
        const brickDefs = [];
        const edges = new Set();

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                const labelParts = [item.name];
                if (item.part) {
                    labelParts.push(formatChannelPart(item.part));
                }
                channelDefs.push('    ' + mermaidNodeId('chan', item.id) + '[["' + escapeMermaidLabel(labelParts.join(' | ')) + '"]]');
            }
        });

        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                brickDefs.push('    ' + mermaidNodeId('brick', item.id) + '["' + escapeMermaidLabel(item.name) + '"]');
            }
        });

        model.bricks.forEach(brick => {
            if (!visibleBricks.has(brick.id)) {
                return;
            }
            (brick.channelRefs || []).forEach(channelKey => {
                if (!visibleChannels.has(channelKey)) {
                    return;
                }
                edges.add('    ' + mermaidNodeId('chan', channelKey) + ' --- ' + mermaidNodeId('brick', brick.id));
            });
        });

        if (!channelDefs.length && !brickDefs.length) {
            return '';
        }

        if (channelDefs.length) {
            lines.push('    subgraph Channels');
            channelDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        if (brickDefs.length) {
            lines.push('    subgraph Bricks');
            brickDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        Array.from(edges).sort().forEach(line => lines.push(line));

        lines.push('    classDef channel fill:#dbeafe,stroke:#2563eb,color:#1e3a8a');
        lines.push('    classDef brick fill:#d1fae5,stroke:#059669,color:#065f46');

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('chan', item.id) + ' channel');
            }
        });
        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('brick', item.id) + ' brick');
            }
        });

        return lines.join('\n');
    }

    function renderDependencySummary(model) {
        const visibleChannelCount = model.channels.filter(item => dependencyState.channels[item.id] !== false).length;
        const visibleBrickCount = model.bricks.filter(item => dependencyState.bricks[item.id] !== false).length;
        return '<div class="activity-summary">' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleChannelCount + '</div><div class="activity-stat-label">Channels</div></div>' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleBrickCount + '</div><div class="activity-stat-label">Bricks</div></div>' +
            '</div>';
    }

    function renderDependenciesTab() {
        ensureDependencyState();
        const container = document.getElementById('Dependencies');
        if (!container) {

        const model = buildDependencyModel();
        const chart = buildDependencyGraph(model);
        let html = '';
        html += '<div class="home-stage">';
        html += '<div class="home-stage-title">Dependencies</div>';
        html += '<div class="home-stage-subtitle">Channel-to-brick dependencies come from the deployed bricks used in this product</div>';
        html += renderDependencySummary(model);
        html += renderDependencyControls(model);

        if (!chart) {
            html += '<div class="dependency-empty">Select at least one channel or brick to render the dependency diagram.</div>';
        } else {
            html += '<div class="dependency-legend"><div class="dependency-control-title">Legend</div><div class="dependency-legend-items">';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#dbeafe; border-color:#2563eb;"></span>Channel</span>';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#d1fae5; border-color:#059669;"></span>Brick</span>';
            html += '</div></div>';
            html += '<div class="dependency-graph"><div class="mermaid">' + chart + '</div></div>';
        }
        html += '</div>';
        container.innerHTML = html;

        if (chart) {
            mermaid.run({querySelector: '#Dependencies .mermaid'}).catch(error => {
                console.error('Failed to render product dependency diagram', error);
            });
        }
    }

                if (stream.description) card += '<div class="pl-card-copy pl-clamp">' + escapeHtml(stream.description) + '</div>';
                card += '<div class="pl-card-label">Uses ' + stream.bricksUsed.length + ' of this product\'s bricks</div>';
                card += '<div class="pl-tags">' + stream.bricksUsed.map(id => '<span class="pl-tag">' + escapeHtml(brickNameById(id)) + '</span>').join('') + '</div>';
                return card + '</a>';
            }).join('') + '</div>';
        }
        document.getElementById('tab_content_streams').innerHTML = html + '</div>';
    }

    // ---- Overview: the product at a glance; every detail lives in its own tab. ----
    const OVERVIEW_CHIP_LIMIT = 8;

    function overviewChip(href, icon, fallback, label, meta, external) {
        let chip = '<a class="ov-chip" href="' + escapeHtml(href) + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>';
        if (icon) chip += '<img src="' + escapeHtml(icon) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
        chip += '<span class="ov-chip-text"><span class="ov-chip-label">' + escapeHtml(label) + '</span>';
        if (meta) chip += '<span class="ov-chip-meta">' + escapeHtml(meta) + '</span>';
        return chip + '</span></a>';
    }

    function overviewChipList(items, renderItem, tab, emptyText) {
        if (!items.length) return '<div class="ov-empty">' + escapeHtml(emptyText) + '</div>';
        let list = '<div class="ov-chips">' + items.slice(0, OVERVIEW_CHIP_LIMIT).map(renderItem).join('') + '</div>';
        if (items.length > OVERVIEW_CHIP_LIMIT) {
            list += '<button class="ov-more" onclick="openTab(\'' + tab + '\')">+' + (items.length - OVERVIEW_CHIP_LIMIT) + ' more</button>';
        }
        return list;
    }

    function overviewPanel(title, tab, count, body, note) {
        let panel = '<section class="ov-panel"><div class="ov-panel-head"><div class="ov-panel-title">' + escapeHtml(title) +
            (count !== null ? ' <span class="ov-panel-count">' + count + '</span>' : '') + '</div>';
        if (tab) panel += '<button class="ov-panel-link" onclick="openTab(\'' + tab + '\')">Details &rarr;</button>';
        panel += '</div>';
        if (note) panel += '<div class="ov-panel-note">' + escapeHtml(note) + '</div>';
        return panel + body + '</section>';
    }

    // How many other products deploy each of this product's bricks.
    function brickSharing() {
        const others = {};
        (deployment.channels || []).forEach(group => (group.channels || []).forEach(channel => (channel.deployedBricks || []).forEach(deployed => {
            (deployed.usedInProducts || []).forEach(use => {
                if (use.productId === product.id) return;
                (others[deployed.brickId] = others[deployed.brickId] || new Set()).add(use.productId);
            });
        })));
        return others;
    }

    function renderOverviewTab() {
        const groups = getDeploymentChannelGroups();
        const channels = groups.flatMap(group => group.channels.map(channel => ({...channel, groupName: group.name})));
        const bricks = productDeployment().bricks.slice().sort((a, b) => b.channelRefs.size - a.channelRefs.size || a.brickName.localeCompare(b.brickName));
        const sharing = brickSharing();
        const shared = bricks.filter(brick => sharing[brick.brickId] && sharing[brick.brickId].size).length;

        const tiles = [
            ['Customers', productCustomers.length, 'customers'],
            ['Customer jobs', productJobs.length, 'jobs'],
            ['Streams', productStreams.length, 'streams'],
            ['Channels', channels.length, 'ChannelsTab'],
            ['Bricks', bricks.length, 'BricksTab'],
            ['Shared bricks', shared, 'BricksTab'],
            ['Own bricks', bricks.length - shared, 'BricksTab'],
        ];
        let html = '<div class="ov">';
        if (product.type) html += '<div class="ov-facts"><span class="ov-fact">' + escapeHtml(product.type) + '</span></div>';
        html += '<div class="ov-tiles">' + tiles.map(([label, value, tab]) =>
            '<button class="ov-tile' + (value ? '' : ' zero') + '" onclick="openTab(\'' + tab + '\')"><span class="ov-tile-value">' + value +
            '</span><span class="ov-tile-label">' + escapeHtml(label) + '</span></button>').join('') + '</div>';

        html += '<div class="ov-section-title">Who it is for</div><div class="ov-grid">';
        html += overviewPanel('Customers', 'customers', productCustomers.length, overviewChipList(productCustomers, customer =>
            overviewChip('../../customers/landing_pages/' + customer.id + '.html', CUSTOMER_ICONS + (customer.icon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                customer.name, customer.group, true), 'customers', 'No primary customers are listed.'), '');
        html += overviewPanel('Customer jobs', 'jobs', productJobs.length, overviewChipList(productJobs, job =>
            overviewChip('#jobs', CUSTOMER_ICONS + (job.customerIcon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                job.jobName, job.customerName + ' · ' + job.steps.length + (job.steps.length === 1 ? ' step' : ' steps'), false),
            'jobs', 'No customer job steps reference this product.'), '');
        html += overviewPanel('Streams', 'streams', productStreams.length, overviewChipList(productStreams, stream =>
            overviewChip('../../product-bricks/stream_pages/' + stream.id + '.html', '../../product-bricks/icons/' + (stream.icon || 'stream.png'),
                '../../product-bricks/icons/stream.png', stream.name, stream.bricksUsed.length + ' of its bricks', true), 'streams', 'No streams use this product\'s bricks.'), '');
        html += '</div>';

        html += '<div class="ov-section-title">How it ships</div><div class="ov-grid">';
        html += overviewPanel('Channels', 'ChannelsTab', channels.length, overviewChipList(channels, channel =>
            overviewChip('#ChannelsTab', '../icons/deployment/' + deploymentIconFile(channel), '../icons/deployment/deployment.png',
                channel.name, channel.groupName + ' · ' + channel.bricks.length + (channel.bricks.length === 1 ? ' brick' : ' bricks'), false),
            'ChannelsTab', 'No deployment channels defined for this product.'), '');
        html += overviewPanel('Bricks', 'BricksTab', bricks.length, overviewChipList(bricks, brick => {
            const others = sharing[brick.brickId] ? sharing[brick.brickId].size : 0;
            const meta = brick.channelRefs.size + (brick.channelRefs.size === 1 ? ' channel' : ' channels') + ' · ' +
                (others ? 'shared with ' + others + (others === 1 ? ' product' : ' products') : 'only this product');
            return overviewChip(getBrickLandingPageHref(brick.brickId), '../../product-bricks/icons/' + brick.brickId + '.png',
                '../../product-bricks/icons/brick.png', brick.brickName, meta, false);
        }, 'BricksTab', 'No bricks are deployed for this product.'), 'Most widely deployed first.');
        html += '</div></div>';
        document.getElementById('tab_content_overview').innerHTML = html;
    }

    renderCustomersTab();
    renderJobsTab();
    renderStreamsTab();
    renderOverviewTab();

    addHeader();
    addTabLabels();
    addChannels();
    addBricks();
    document.getElementById('Dependencies').innerHTML = '<div class="home-stage"><div class="home-stage-title">Dependencies</div><div class="home-stage-subtitle">Open this tab to render the Mermaid dependency diagram.</div></div>';

</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Occupational Health and Safety Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Products"
    },
    {
      "label": "Kitry Employee and Manager Portals"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
