    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 24px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }

<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        // Overview pages name the open tab in their title, as the start page's sidebar does.
        const heroTitle = document.querySelector('[data-follows-tab]');
        if (heroTitle) {
            if (!heroTitle.dataset.defaultTitle) heroTitle.dataset.defaultTitle = heroTitle.textContent;
            heroTitle.textContent = activeTab.dataset.tabTitle || heroTitle.dataset.defaultTitle;
        }
        // A tab may describe itself; otherwise the page's own subtitle stays.
        const heroSubtitle = document.querySelector('[data-follows-tab-subtitle]');
        if (heroSubtitle) {
            if (!heroSubtitle.dataset.defaultSubtitle) heroSubtitle.dataset.defaultSubtitle = heroSubtitle.textContent.trim();
            heroSubtitle.textContent = activeTab.dataset.tabSubtitle || heroSubtitle.dataset.defaultSubtitle;
        }
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }

    // In-page links to another tab (e.g. the top bar's Insights link on the
    // Customers page) only change the hash; switch to that tab.
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
            openTab(hash, {updateHistory: false});
        }
    });
</script>

"id": "gpph", "name": "GP Practice and Pharmacy Manager", "icon": "customer-gpph-portrait.jpg"}, {"id": "fyth", "name": "Physiotherapy Practice Owner", "icon": "customer-fyth-portrait.jpg"}]}, {"id": "hci-partner-platform", "name": "HCI Partner API and Integration Programme", "icon": "hci-partner-platform.png", "type": "Partner Platform (API and Open Platform)", "description": "The open platform through which exercise apps, questionnaire providers, quality registers, accounting and payment services and HIS/AIS vendors connect once and reach the professionals on HCI's labels: partner onboarding and agreements, API credentials and consent scopes, versioned interfaces across FysioRoadmap, SpotOnMedics, Incura, CRS and HCI One, sandbox and certification, monitoring and release coordination. Partners named by HCI include DigiDoc, HC, QUIN, ProMedico, Pharmapartners, MicroHIS, Fysio AI, PhysioTrack and Vecozo, and the labels also work with Physitrack, Qualiview, Twinfield, Mollie, Bergop, Therapieland and Minddistrict. The partner platform is the standard way to add e-health content and devices to HCI One; partner terms are agreed per partner.", "primaryCustomers": [{"id": "intp", "name": "Integration Partner", "icon": "customer-intp-portrait.jpg"}]}, {"id": "implementation-and-billing-services", "name": "Implementation, Migration, Training and Billing Services", "icon": "implementation-and-billing-services.png", "type": "Professional Services (Onboarding, Migration, Support, Billing Service)", "description": "The services delivered by HCI's customer operations team on top of the software: onboarding of new practices and institutions with configuration, data migration and validation, training and hypercare; the phased migration of acquired labels into HCI One with per-discipline planning; the support desk with ticket handling and knowledge base; and the outsourced billing service in which HCI submits declarations, monitors Vecozo return messages, resolves rejections and follows up patient invoices on behalf of the practice. These services are quoted per project or per practice, as HCI publishes no list prices.", "primaryCustomers": [{"id": "impl", "name": "Implementation and Support Consultant", "icon": "customer-impl-portrait.jpg"}, {"id": "fyth", "name": "Physiotherapy Practice Owner", "icon": "customer-fyth-portrait.jpg"}]}];

ons for CRS customers."}]}, {"brickId": "bidb", "brickName": "Practice BI Dashboards and Reporting", "deploymentRole": "Billing-service revenue and settlement reporting deployed to the internal operations back office.", "usedInProducts": [{"productId": "spotonmedics", "description": "Revenue and settlement reports per SpotOnMedics practice that uses the billing service."}, {"productId": "hci-crs", "description": "Rejection, settlement and outstanding-claim reporting for CRS customers whose return messages the billing service works."}]}]}]}]};
    const productStreams = [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "icon": "schedule-appointments-and-online-booking.png", "group": "Paramedical Practice Journeys", "description": "Take a paramedical practice from a referral, a phone call or a patient request to a booked and confirmed slot in the agenda that FysioRoadmap calls the central heart of the practice. The stream covers the multi-therapist, multi-location agenda, 24/7 online booking from the practice website and the Uw Zorg Online app synchronised with that agenda, waiting-list handling, reminders that cut no-shows, group lessons and subscriptions in SpotOnMedics style, and the mobile agenda in the Zorgverlener App. Because invoices and declarations are generated from the agenda, every booking must already carry the patient, the therapist, the location and the treatment code that the declaration later needs.", "outcomes": ["A patient who finds the practice on the website or in the app books a first appointment without a phone call, and the slot appears in the therapist's agenda with the right treatment code", "Therapists across locations see one agenda on desktop and mobile and no longer double-book rooms, equipment or group lessons", "Reminders and the waiting list keep the agenda full, so cancellations are refilled and no-shows fall", "Every agenda entry is complete enough to generate the invoice or GDS801 declaration without later correction"], "bricksUsed": ["pweb", "appb", "pgoa", "iden"]}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "icon": "keep-the-electronic-patient-record.png", "group": "Paramedical Practice Journeys", "description": "Take a treatment episode from intake to a closed dossier that passes an insurer audit and a KNGF, NVLF or NVD guideline check with as little typing as possible. The stream covers discipline-specific care pathways and guideline templates, the clinical reasoning and treatment plan, session notes with voice-to-text and AI summaries, documents and correspondence, measurement moments in the pathway, and the dossier audit rules that check completeness before the episode is declared or closed. It exists because physiotherapists report about a full working day per week on administration and because the dossier is the evidence behind every declaration, every quality-register delivery and every report to a referrer.", "outcomes": ["A therapist documents the intake, the treatment plan and every session inside the consult time, with voice-to-text and templates instead of free typing", "Every episode follows the care pathway of its discipline and guideline, so audit rules find nothing missing when the episode is declared or closed", "Correspondence with the referrer and the patient is generated from the dossier instead of written twice", "Records are complete, traceable and retained under the AVG and the WGBO retention duty"], "bricksUsed": ["audt"]}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "icon": "measure-outcomes-with-proms-and-rom.png", "group": "Paramedical Practice Journeys", "description": "Take a practice or GGZ provider from the choice of a measurement instrument to outcome dashboards and to the quality registers that contracts require. The stream covers PROMs and clinical measurement instruments inside the paramedical treatment, routine outcome monitoring (ROM) for GGZ with questionnaires orchestrated at intake, interim and end, the Embloom library that supplies the questionnaires, benchmarks across therapists and practices, and the monthly pseudonymised delivery to the Landelijke Database Fysiotherapie (LDF), the Keurmerk practice register and other registers under opt-in patient consent. Outcome data is a contract condition for many insurers and the basis for the practice's own quality conversation, so the stream has to make measuring almost free of effort.", "outcomes": ["Patients receive the right questionnaire at the right moment in the app and the score lands in the episode without retyping", "Therapists and GGZ practitioners see score trends per patient and per caseload and use them in the treatment conversation", "The monthly LDF and Keurmerk delivery is complete, pseudonymised and covered by recorded opt-in consent", "Practices can compare their outcomes with the benchmark and answer insurer quality questions from the dashboard"], "bricksUsed": ["audt", "pgoa"]}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "icon": "coordinate-ggz-treatment-and-medication.png", "group": "Mental Health Care Journeys", "description": "Take a GGZ client from intake and diagnosis to a multidisciplinary treatment plan that is delivered, evaluated and registered correctly in HCI CRS. The stream covers intake and care-demand typing under the zorgprestatiemodel, the treatment plan with goals and the involved professionals, settings and consults, medication management by the psychiatrist or nurse specialist, group treatment, the coordinating practitioner role, and for youth care and WMO the municipal assignment and the iJw/iWmo message exchange with the municipality. It serves both the independent practitioner with a small practice and the institution with hundreds of professionals, in a market where waiting times exceed the 14-week Treeknorm in every region.", "outcomes": ["A client moves from waiting list to intake to a treatment plan with a coordinating practitioner and every involved professional on one plan", "Consults, settings and professionals are registered as care is delivered, so zorgprestatiemodel and municipal declarations are first time right", "Medication is prescribed, reviewed and visible to the client and the pharmacy from the same dossier", "Youth care and WMO trajectories run on a valid municipal assignment with iJw/iWmo messages exchanged on time"], "bricksUsed": ["audt"]}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "icon": "deliver-blended-and-e-health-care.png", "group": "Mental Health Care Journeys", "description": "Take a treatment plan and turn it into a blended programme in which sessions in the practice are combined with e-health between sessions. The stream covers the Embloom library of questionnaires and interventions integrated in the EPD, the blended care programme builder that assigns modules and home tasks per client, exercise programmes from partners such as Physitrack for paramedical patients, the Emogy app for behavioural support, video consultation and NICE Connect remote trajectories that have followed patients after discharge since 2014 with Amsterdam UMC, and the monitoring of home tasks by the practitioner. Blended care is how practices and institutions treat more clients with the same professionals and how waiting-list clients receive something before treatment starts.", "outcomes": ["Every client with a treatment plan can receive modules, exercises and questionnaires between sessions from the same dossier", "Practitioners see who did what at home and adjust the programme in the next session instead of guessing", "Video consultation and remote trajectories replace travel for follow-up without losing the clinical record", "Waiting-list clients start with e-health so that the wait is used"], "bricksUsed": ["pgoa"]}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "icon": "engage-patients-through-portal-and-app.png", "group": "Patient and Care Network Journeys", "description": "Take a patient from an invitation to an active user of the Uw Zorg Online app or the CRS client portal who arranges things digitally instead of by phone. The stream covers activation with DigiD or a practice-issued invitation, e-consult with the GP, pharmacy, therapist or GGZ team, appointment self-service in the practice agenda, repeat prescriptions and the medication overview from the pharmacy system, access to records, treatment plans and correspondence, digital triage such as 'Moet ik naar de dokter?' before contacting the practice, and notifications. Uw Zorg Online connects to the GP and pharmacy information systems (Sanday, HealthConnected, Pharmapartners, CGM) and serves 3 million+ app users, so activation and daily use drive both patient convenience and the reduction of phone calls that practices pay for.", "outcomes": ["A patient invited by a GP practice, pharmacy, therapist or GGZ institution activates the app and finds all their care providers in one place", "Routine questions, appointments and repeat prescriptions move from the phone to the app, which the practice sees in fewer calls", "Patients read their record, treatment plan and correspondence and receive notifications when something new arrives", "Digital triage sends patients to the right route before they contact the practice"], "bricksUsed": ["pgoa", "econ", "rxrp", "appb", "trig", "hisc", "iden", "pweb"]}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "icon": "manage-personal-health-data-and-sharing.png", "group": "Patient and Care Network Journeys", "description": "Take a citizen from a MedMij consent to a personal health environment (PGO) in Quli or Uw Zorg Online in which health data from the GP, the hospital, the pharmacy and the GGZ institution is retrieved under the MedMij framework, self-measurements and diaries are added, and the person decides who sees what: a partner, a parent, an informal carer or a care professional in the network. Quli carries the MedMij label, offers a GGZ app guide with 50+ apps and single login for e-health, and is used for intensive-care aftercare and by GGZ organisations; HCI won a MedMij PGO tender for Uw Zorg Online. The stream covers consent and data retrieval through DVZA services, self-measurement, granular sharing, network care and the audit trail that makes sharing accountable.", "outcomes": ["A citizen retrieves their own data from connected care providers into one environment under MedMij consent, without asking for printouts", "Self-measurements and diaries sit next to professional data and can be shared with the treating professional", "Family members and informal carers see exactly what the person allowed, no more, and the person can withdraw it at any time", "Care professionals in the network work with the person's environment instead of separate portals"], "bricksUsed": ["pgom", "diar", "pgoa", "iden", "audt", "hisc", "econ"]}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "icon": "refer-and-exchange-with-the-care-network.png", "group": "Patient and Care Network Journeys", "description": "Close the loop between the practice and the rest of the care network: a referral from the GP or specialist through ZorgDomein, secure messaging and reports through ZorgMail, connectors to the GP and pharmacy information systems, hospital information system links for paraNICE in rehabilitation departments, and the report back to the referrer at intake and at the end of treatment. Wegiz (in force April 2023) mandates digital data exchange, and the zorgprestatiemodel and GDS801 declarations depend on referral data, so the exchange is both a care quality and a cash-flow matter.", "outcomes": ["Referrals arrive digitally with referrer, referral date and reason, ready for the dossier and the declaration", "Reports to the referrer are generated from the dossier and delivered securely, so GPs know what happened to their patients", "Paramedical departments in hospitals work in paraNICE while the hospital information system stays the source of patient identity and orders", "Every exchange is traceable and compliant with Wegiz and NEN 7510"], "bricksUsed": ["hisc", "audt", "papi"]}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "icon": "publish-and-run-a-practice-website.png", "group": "Patient and Care Network Journeys", "description": "Take a practice from a template to a findable, accessible website that acts as the digital front door: practice websites from the Praktijkinfo portfolio under Uw Zorg Online for GP practices, pharmacies and paramedical practices, with online booking, e-consult, repeat prescription and triage entry points that connect to the practice's agenda and app, content management by practice staff, hosting, security and accessibility. The website is where most patients first meet the practice and where the shift from phone to app starts.", "outcomes": ["A practice publishes a website from a template in days with its team, locations, opening hours and services", "Booking, e-consult, repeat prescription and triage entry points on the website lead directly into the app and the practice agenda", "Practice staff maintain content themselves and the site stays accessible, secure and up to date", "Patients find the practice through search and know the digital route before they call"], "bricksUsed": ["pweb", "econ", "trig", "pgoa", "appb"]}, {"id": "integrate-partners-through-the-open-platform", "name": "Integrate Partners through the Open Platform", "icon": "integrate-partners-through-the-open-platform.png", "group": "Platform and Operations Journeys", "description": "Take an integration partner from a signed agreement to a live, monitored connection that reaches practices across the HCI labels. Partners include exercise-app vendors (Physitrack, Physiotrack, Fysio AI), questionnaire and quality-register providers (Qualiview, MediQuest), accounting (Twinfield), payments (Mollie), HIS/AIS vendors and clearing houses (Vecozo), and the platform must offer them one onboarding, credentials and consent model, versioned interfaces that behave the same on FysioRoadmap, SpotOnMedics, Incura, CRS and HCI One, sandbox and certification, and monitoring and release coordination so that a change on either side does not break care. The open platform is how HCI adds e-health content and devices without building everything itself.", "outcomes": ["A partner goes from agreement to a certified connection through a documented onboarding with sandbox and test data", "One versioned interface serves all labels, so a partner integrates once and reaches 40,000+ professionals", "Practice consent and patient consent govern every data exchange with a partner and are visible to the practice", "Connection health, volumes and errors are monitored and release changes are coordinated with partners in advance"], "bricksUsed": ["papi", "iden", "audt", "hisc"]}, {"id": "onboard-migrate-and-consolidate-labels", "name": "Onboard, Migrate and Consolidate Labels", "icon": "onboard-migrate-and-consolidate-labels.png", "group": "Platform and Operations Journeys", "description": "Take a newly signed practice, or a practice on an acquired label, to live users on HCI One without disturbing daily care. The stream covers the quote and contract, configuration of agenda, disciplines, care pathways, tariffs and integrations, migration of patients, episodes, documents and open declarations from FysioRoadmap, SpotOnMedics, Incura, Evry, Abakus, Podofile, Edevop or FysioLogic with validation and reconciliation, training, the phased per-discipline rollout with physiotherapy first and no forced migration deadline, hypercare and support. It is the operational heart of the buy-and-build strategy: the promise of 'the best of every label' is only kept if migration is boring.", "outcomes": ["A new practice is configured, trained and live within the agreed onboarding period with declarations flowing from the first month", "A practice migrating from an acquired label finds its patients, episodes, documents and open claims complete and reconciled on HCI One", "Migration happens per discipline at the practice's pace, with the old label fully supported until the practice chooses to switch", "Support and hypercare catch issues in the first weeks and feed them back into the migration tooling"], "bricksUsed": ["iden", "papi"]}, {"id": "secure-and-comply-with-health-information-standards", "name": "Secure and Comply with Health Information Standards", "icon": "secure-and-comply-with-health-information-standards.png", "group": "Platform and Operations Journeys", "description": "Turn the regulation that applies to a healthcare software provider into controls and evidence: NEN 7510 and ISO 27001 information security management, AVG consent, retention and data-subject rights, audit logs on every dossier access, UZI and DigiD authentication for professionals and citizens, Wegiz and MedMij conformance for data exchange, secure development and release, and incident and data-breach response. HCI is certified for NEN 7510 and ISO 27001 and operates from the Netherlands and Switzerland; the stream is what keeps those certificates and what every insurer, institution and hospital asks for before contracting.", "outcomes": ["The NEN 7510 and ISO 27001 certificates are maintained with evidence collected from the platform rather than assembled by hand before the audit", "Every access to patient data is authenticated at the right level and logged, and patients and institutions can see who accessed what", "Consent, retention and data-subject requests are handled within the AVG deadlines from the platform", "Incidents and data breaches are detected, contained, reported and learned from within the legal time limits"], "bricksUsed": ["iden", "audt", "pgom", "econ"]}];

ce needs before patient data flows through the app."}, {"step": "Configure which services are open to patients", "description": "Decide with the GPs or pharmacists which appointment types and slots may be booked online, which e-consult subjects are allowed and who answers them, whether repeat prescriptions go straight to the pharmacy of choice, and whether patients can read their record summary and correspondence; set the practice's answering rules and response promise so that the app tells patients what to expect.", "howItSupports": "Exposes the agenda slots and appointment types that the practice releases for patient self-service. Holds the practice's e-consult, prescription and record-access settings and the response promise shown to patients."}, {"step": "Get patients to activate the app", "description": "Invite patients through the practice website, the waiting-room screen, the telephone menu and the assistant's standard answer, help older patients through DigiD activation, and prioritise the frequent callers, chronic patients and parents who generate most of the phone traffic; watch weekly how many invitations turn into activated accounts and first digital requests.", "howItSupports": "Runs invitations, DigiD activation and the first-use nudges that turn an invitation into an active account. Places the activation call to action, app links and triage entry point on the practice website where patients look first."}, {"step": "Handle digital requests inside the daily workflow", "description": "Organise the assistants' morning so that e-consults, booking exceptions, prescription requests and triage outcomes appear in the HIS or AIS work list and are answered within the promised time, route clinical questions to the GP, and agree what still requires a telephone call; make sure a request never gets lost between the app and the practice system.", "howItSupports": "Delivers e-consults, prescription requests and triage outcomes with their status so that the practice an d connection", "description": "Rely on HCI's MedMij-certified role as the practice's exchange party: activate the data sets the practice offers, confirm that the connector delivers them from the HIS or AIS in the required standards, and test with a Quli or another MedMij PGO that a patient can retrieve their record summary and medication overview.", "howItSupports": "Provides the MedMij-certified retrieval path and the PGO test flow for the practice's data sets. Delivers the practice's HIS or AIS data through the connector in the standards MedMij requires."}, {"step": "Handle consent, authentication and identity questions", "description": "Make sure patients log in with DigiD, that parents and carers act only within the rules for children and representatives, that patients can see who accessed their data, and that objections or corrections are handled by the practice; write the practice's own short policy on top of HCI's standard texts.", "howItSupports": "Provides DigiD authentication, consent records, audit logs and representative rules that the practice can rely on. Shows patients their access log and consent settings in the same app they use for care."}, {"step": "Answer patient PGO and data requests without paper", "description": "Route questions about downloading data, sharing with family or an informal carer and combining GP, pharmacy and hospital data to the app and Quli instead of printing or mailing, and use the network care functions so that a patient's informal carer can act for them with the patient's permission.", "howItSupports": "Lets patients retrieve, combine and share their data with family and carers so that the practice no longer handles paper copies. Answers the practical questions about downloading and sharing inside the app's help and messaging."}, {"step": "Keep the evidence for audits and quality conditions", "description": "Collect the conformance statements, the processing agreement, the NEN 7510 and ISO 27001 certificates of HCI, the access logs and the yearly check of settings in one place, so that an insurer's quality audit, an Autoriteit Persoonsgegevens question or the practice accreditation can be answered in an afternoon.", "howItSupports": "Publishes certificates, conformance statements and audit log exports that the practice files as evidence."}]}, {"customerId": "gpph", "customerName": "GP Practice and Pharmacy Manager", "customerIcon": "customer-gpph-portrait.jpg", "jobId": "jtbd-gpph-3", "jobName": "Keep the practice findable and up to date online", "jobOutcome": "Patients find correct information and a working entry point into the app on the practice website, the manager keeps hours, team and news current without a developer, the site meets accessibility and security expectations, and the website is measurably the largest route into online booking, e-consults and app activations.", "steps": [{"step": "Set up the website from a practice template", "description": "Choose a template suited to a GP practice or pharmacy, load the practice details, team, locations, opening hours and services, connect the domain, and check the layout on a phone, since that is where most patients will look before they call.", "howItSupports": "Provides the templates, content management and hosting for the practice website without a developer."}, {"step": "Embed the digital front door on every page", "description": "Place online booking, e-consult, repeat prescription and triage entry points on the pages where patients arrive, link the Uw Zorg Online activation flow and app download, and make the emergency and out-of-hours instructions impossible to miss.", "howItSupports": "Embeds booking, e-consult and triage entry points and the app links into the site's pages. Receives the patients who click through from the website into activation, booking and e-consult. Serves the bookable slots that the website's booking entry point shows to patients."}, {"step": "Keep content current with minimal effort", "description":     const dependencyState = {
        initialized: false,
        channels: {},
        bricks: {}
    };

    // Derive this product's deployed bricks and the channels they ship to from
    // deployment.json (deployedBricks[].usedInProducts). products.json no longer carries
    // brick/channel links.
    function buildProductDeployment() {
        const channelMeta = {};   // ref -> {ref, groupId, groupName, channelName, channelType, ...}
        const bricks = {};        // brickId -> {brickId, brickName, description, channelRefs:Set}
        (deployment.channels || []).forEach(group => {
            (group.channels || []).forEach(channel => {
                const ref = (group.groupId || '') + '/' + (channel.subChannelId || '');
                (channel.deployedBricks || []).forEach(deployed => {
                    const use = (deployed.usedInProducts || []).find(item => item.productId === product.id);
                    if (!use) {
                        return;
                    }
                    if (!channelMeta[ref]) {
                        channelMeta[ref] = {
                            ref: ref,
                            groupId: group.groupId || '',
                            groupName: group.groupName || prettifyChannelGroup(group.groupId || 'other'),
                            groupDescription: group.description || '',
                            name: channel.subChannelName || channel.subChannelId || ref,
                            channelId: channel.subChannelId || '',
                            channelType: channel.channelType || '',
                            description: channel.description || '',
                            bricks: []
                        };
                    }
                    if (!bricks[deployed.brickId]) {
                        bricks[deployed.brickId] = {
                            brickId: deployed.brickId,
                            brickName: deployed.brickName || deployed.brickId,
                            description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name),
                            channelRefs: new Set()
                        };
                    }
                    bricks[deployed.brickId].channelRefs.add(ref);
                    channelMeta[ref].bricks.push({
                        brickId: deployed.brickId,
                        brickName: deployed.brickName || deployed.brickId,
                        deploymentRole: deployed.deploymentRole || '',
                        description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name)
                    });
                });
            });
        });
        return {channelMeta: channelMeta, bricks: Object.values(bricks)};
    }

    // A usage note that only says "<brick> in <product>" repeats the names around it; drop it.
    function meaningfulUsageNote(note, brickName, productName) {
        const normalize = value => String(value || '').toLowerCase().replace(/[.\s]+$/, '').replace(/\s+/g, ' ').trim();
        const text = normalize(note);
        if (!text) return '';
        return text === normalize((brickName || '') + ' in ' + (productName || '')) ? '' : note;
    }

    let productDeploymentCache = null;
    function productDeployment() {
        if (!productDeploymentCache) {
            productDeploymentCache = buildProductDeployment();
        }
        return productDeploymentCache;
    }
    mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'loose',
        flowchart: {
            htmlLabels: false
        }
    });
