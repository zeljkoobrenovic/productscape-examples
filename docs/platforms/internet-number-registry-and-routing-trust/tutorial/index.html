<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Internet Number Registry and Routing Trust: an introduction</title>
    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <style>* { box-sizing: border-box; }
html { scroll-padding-top: 1.5rem; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-wrap: anywhere;
}
a { color: var(--accent-ink); text-underline-offset: .2em; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
.page { max-width: 1160px; padding: 1.5rem 2.5rem 3rem; margin: auto; }
.domain-nav { display: flex; flex-wrap: wrap; gap: .75rem; color: var(--ink-soft); font-size: .85rem; }
.domain-nav a { color: inherit; }
.hero { padding: 3rem 0 2.5rem; border-bottom: 1px solid var(--line-strong); }
.eyebrow, .chapter-number {
    color: var(--accent-ink); font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
h1, h2, h3, h4 { line-height: 1.25; text-wrap: balance; }
h1 { font-size: clamp(2rem, 4.5vw, 3.4rem); letter-spacing: -.035em; margin: .5rem 0 1rem; max-width: 22ch; }
h2 { font-size: 1.9rem; letter-spacing: -.025em; margin: .35rem 0 1.4rem; }
h3 { font-size: 1.25rem; margin: 0 0 .6rem; }
h4 { font-size: 1.1rem; margin: 0 0 .5rem; }
p { margin: 0 0 1rem; }
.metadata { display: flex; flex-wrap: wrap; gap: .35rem 1.5rem; color: var(--ink-soft); font-size: .85rem; }
.reader-context { display: grid; grid-template-columns: 1fr 1.4fr; gap: 1.5rem 3rem; margin-top: 1.8rem; font-size: .95rem; }
.reader-context p:last-child { margin-bottom: 0; }
.label { color: var(--ink-soft); font-size: .78rem; font-weight: 700; margin: 0 0 .25rem; }
.labeled { margin-top: .75rem; }
.reading-layout { display: grid; grid-template-columns: 225px minmax(0, 1fr); gap: 3.5rem; align-items: start; padding-top: 2.75rem; }
.contents { position: sticky; top: 1.5rem; max-height: calc(100vh - 3rem); overflow-y: auto; padding: .3rem .5rem .5rem 0; }
.reading-layout > aside { align-self: stretch; }
.contents h2 { font-size: .8rem; letter-spacing: .03em; margin: 0 0 .75rem; }
.contents ol { padding-left: 1.4rem; margin: 0; font-size: .82rem; line-height: 1.45; }
.contents li { padding: .28rem 0 .28rem .2rem; color: var(--ink-soft); }
.contents a { color: var(--ink-soft); text-decoration: none; display: inline-block; padding: .1rem 0; }
.contents a:hover { color: var(--accent-ink); text-decoration: underline; }
main { min-width: 0; max-width: 740px; }
section { margin-bottom: 3rem; padding-bottom: 2.5rem; border-bottom: 1px solid var(--line-strong); }
section:last-child { margin-bottom: 0; }
.chapter-number { margin: 0; }
section ul { padding-left: 1.35rem; }
section li { padding-left: .3rem; }
.entry { padding: 1.4rem 0; border-top: 1px solid var(--line); }
h2 + .entry { border-top: 0; padding-top: 0; }
.entry:last-child { padding-bottom: 0; }
.entry > :last-child, .labeled > :last-child { margin-bottom: 0; }
.tutorial-illustration { margin: 1.3rem 0 1.5rem; break-inside: avoid; }
.illustration-link { display: block; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: white; }
.illustration-link:hover { border-color: var(--accent); }
.tutorial-illustration img { display: block; width: 100%; height: auto; border-radius: inherit; }
.tutorial-illustration figcaption { margin-top: .6rem; color: var(--ink-soft); font-size: .85rem; line-height: 1.5; }
.tutorial-illustration figcaption p { margin: 0 0 .35rem; }
.image-hint { display: block; font-size: .75rem; }
.example { background: var(--accent-soft); border-left: 3px solid var(--accent-line); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 1rem 1.3rem; margin: 1.3rem 0; }
.example .labeled:first-child { margin-top: 0; }
.example > :last-child { margin-bottom: 0; }
.timeline { border-left: 2px solid var(--accent-line); padding: 0 0 0 1.5rem; list-style: none; }
.timeline li { position: relative; padding: .3rem 0 1.5rem; }
.timeline li::before { content: ""; position: absolute; width: .7rem; height: .7rem; border-radius: 50%; background: var(--accent); left: -1.92rem; top: .7rem; }
.timeline li:last-child { padding-bottom: 0; }
.source { font-size: .8rem; margin-top: .7rem; }
.steps { padding-left: 1.5rem; }
.steps > li { padding: .4rem 0 1rem .5rem; }
.steps > li::marker { color: var(--accent-ink); font-weight: 700; }
.notice { background: var(--surface-muted); border: 1px solid var(--line-strong); border-radius: var(--radius); padding: 1.4rem; margin-bottom: 2rem; }
.notice h2 { font-size: 1.4rem; }
.notice p:last-child { margin-bottom: 0; }
details { margin-top: 1rem; background: var(--panel); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); }
summary { cursor: pointer; padding: .7rem 1rem; color: var(--accent-ink); font-size: .95rem; font-weight: 600; }
summary:hover { background: var(--accent-soft); border-radius: inherit; }
.answer { padding: .5rem 1rem 1rem; }
.answer > :last-child { margin-bottom: 0; }
.reading-list { list-style: none; padding: 0; }
.reading-list li { padding: 0 0 1rem; }
.reading-list p { margin: .3rem 0 0; color: var(--ink-soft); font-size: .95rem; }
footer { text-align: right; padding-top: 2rem; font-size: .85rem; }
.skip-link { position: fixed; top: -10rem; left: 1rem; background: var(--panel); padding: .6rem 1rem; z-index: 2; }
.skip-link:focus { top: 1rem; }
.visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
@media (max-width: 850px) {
    .page { padding: 1.25rem; }
    .hero { padding: 2rem 0; }
    .reader-context { grid-template-columns: 1fr; gap: .5rem; }
    .reading-layout { display: block; padding-top: 1.5rem; }
    .contents { position: static; max-height: none; padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--line-strong); }
    .contents ol { columns: 2; column-gap: 2rem; }
    .contents li { break-inside: avoid; }
    .contents a { padding: .25rem 0; }
    h2 { font-size: 1.65rem; }
}
@media (max-width: 430px) {
    .contents ol { columns: 1; }
    body { font-size: 16px; }
}
@media print {
    body { background: white; color: black; font-size: 11pt; }
    .page { max-width: none; padding: 0; }
    .domain-nav, .reading-layout > aside, footer, .skip-link { display: none; }
    .hero { padding: 0 0 1rem; }
    h1 { font-size: 28pt; }
    .reading-layout { display: block; padding-top: 1rem; }
    main { max-width: none; }
    section { padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h2, h3, h4 { break-after: avoid; }
    p { orphans: 3; widows: 3; }
    .example, details, .timeline li { break-inside: avoid; }
    details::details-content { content-visibility: visible; }
    details > :not(summary) { display: block !important; }
    summary { display: none; }
    .image-hint { display: none; }
}
</style>
</head>

            <p class="eyebrow">A beginner's guide</p>
            <h1>Internet Number Registry and Routing Trust: an introduction</h1>
            <div class="metadata"></div>
            <div class="reader-context"></div>

            <aside></aside>

        </div>

    </div>
</body>
</html>
