    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 4px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }
</style>

        }

        .matrix-layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .matrix-controls {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f8fafc;
            padding: 14px;
        }

        .matrix-shell {
            min-width: 0;
        }

        .matrix-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .matrix-table-wrap {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: white;
            overflow: auto;
            max-height: 75vh;
        }

        .matrix-table {
            border-collapse: collapse;
            width: max-content;
            min-width: 100%;
        }

        .matrix-table th,
        .matrix-table td {
            border-bottom: 1px solid #e5e7eb;
            border-right: 1px solid #f3f4f6;
            padding: 6px;
            text-align: center;
            vertical-align: middle;
        }

        .matrix-table th {
            position: sticky;
            top: 0;
            background-color: #f8fafc;
            z-index: 1;
        }

        .matrix-row-head {
            position: sticky;
            left: 0;
            background-color: white;
            min-width: 220px;
            text-align: left;
            z-index: 1;
        }

        .matrix-corner {
            position: sticky;
            left: 0;
            top: 0;
            z-index: 2;
            background-color: #f8fafc;
            min-width: 220px;
            text-align: left;
        }

        .matrix-col-icon {
            width: 14px;
            height: 14px;
            object-fit: contain;
        }

        .matrix-col-count {
            font-size: 10px;
            color: #6b7280;
            min-width: 24px;
        }

        .matrix-row-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 80%;
            text-align: left;
        }

        .matrix-row-count {
            margin-left: auto;
            font-size: 11px;
            color: #6b7280;
            padding-left: 8px;
            white-space: nowrap;
        }

        .matrix-row-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            flex: 0 0 auto;
        }

        .matrix-hit {
            background-color: #dbeafe;
            color: #1e3a8a;
            font-size: 11px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-hit-external {
            background-color: #ecfccb;
            color: #365314;
            font-size: 10px;
            line-height: 1.2;
            max-width: 6px;
        }

        .matrix-empty-cell {
            color: #d1d5db;
        }

        @media (max-width: 1080px) {
            .dependencies-layout {
                grid-template-columns: 1fr;
            }

            .matrix-layout {
                grid-template-columns: 1fr;
            }
        }
