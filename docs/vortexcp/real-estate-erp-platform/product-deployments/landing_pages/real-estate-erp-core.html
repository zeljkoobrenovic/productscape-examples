    <style>
    .tab {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid #e5e7eb;
        margin-bottom: 24px;
    }

    .tab button {
        position: relative;
        background-color: transparent;
        border: none;
        outline: none;
        cursor: pointer;
        padding: 11px 16px;
        margin-bottom: -1px;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #6b7280;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        transition: color 0.18s ease, background-color 0.18s ease, border-color 0.18s ease;
    }

    .tab button:hover {
        color: #1f2937;
        background-color: #f3f4f6;
    }

    .tab button:focus-visible {
        outline: 2px solid #1d4ed8;
        outline-offset: -2px;
    }

    .tab button.active {
        color: #1d4ed8;
        border-bottom-color: #1d4ed8;
    }

    .tabcontent {
        display: none;
        padding: 2px 2px;
        animation: tabContentFade 0.2s ease;
    }

    @keyframes tabContentFade {
        from {
            opacity: 0;
            transform: translateY(3px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @media (max-width: 720px) {
        .tab {
            flex-direction: column;
            gap: 0;
        }

        .tab button {
            width: 100%;
            text-align: left;
            margin-bottom: 0;
            border-bottom: 1px solid #e5e7eb;
            border-radius: 0;
        }

        .tab button.active {
            border-bottom-color: #1d4ed8;
        }
    }

<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        // Overview pages name the open tab in their title, as the start page's sidebar does.
        const heroTitle = document.querySelector('[data-follows-tab]');
        if (heroTitle) {
            if (!heroTitle.dataset.defaultTitle) heroTitle.dataset.defaultTitle = heroTitle.textContent;
            heroTitle.textContent = activeTab.dataset.tabTitle || heroTitle.dataset.defaultTitle;
        }
        // A tab may describe itself; otherwise the page's own subtitle stays.
        const heroSubtitle = document.querySelector('[data-follows-tab-subtitle]');
        if (heroSubtitle) {
            if (!heroSubtitle.dataset.defaultSubtitle) heroSubtitle.dataset.defaultSubtitle = heroSubtitle.textContent.trim();
            heroSubtitle.textContent = activeTab.dataset.tabSubtitle || heroSubtitle.dataset.defaultSubtitle;
        }
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }

    // In-page links to another tab (e.g. the top bar's Insights link on the
    // Customers page) only change the hash; switch to that tab.
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
            openTab(hash, {updateHistory: false});
        }
    });
</script>

    const productCustomers = [{"id": "asmg", "name": "Asset and Portfolio Manager", "icon": "customer-asmg-portrait.jpg", "group": "Real Estate Investors and Asset Managers", "description": "Steers the performance of an investment portfolio at a Dutch or German real estate investor or asset management firm such as Rockfield, Urban Interest, Burgstate or Dunavast: several hundred to twenty thousand residential, commercial, retail, logistics or healthcare units held in a stack of legal entities, funds and joint ventures. Sets occupancy and rent targets, drives the annual indexation round, decides on capex, renovation and transformation projects, prepares hold-or-sell cases on valuations and yields, and answers to fund managers, investors and lenders every quarter. Works with a small asset management team, an in-house or outsourced property manager and a finance controller, and is judged on net rental income growth, occupancy and the credibility of the numbers presented to investors.", "careAbout": ["A rent roll, occupancy and vacancy picture per entity, complex and unit that is correct today, not at the end of the quarter when finance has caught up", "Every eligible contract indexed on its anniversary or on 1 July with the right index, cap and legal notice, so no rent growth is left on the table and no letter is challenged", "Vacancy days per turnover kept short because letting, screening and contract creation run as one flow with the property manager", "Service charges fully recovered through timely, defensible settlements rather than absorbed as non-recoverable cost", "Valuations, yields, loan covenants and capex kept next to the operating data so hold, sell and invest decisions rest on one set of numbers", "Quarterly investor and lender reports that come out of the system in days, with an audit trail from every figure back to contracts, invoices and bank lines"]}, {"id": "finc", "name": "Real Estate Finance Controller", "icon": "customer-finc-portrait.jpg", "group": "Real Estate Investors and Asset Managers", "description": "Runs the financial administration of a real estate investor, fund or asset manager: a group of ten to a hundred legal entities that each own objects, borrow from banks and invoice rent. Prepares the periodic rent runs and direct debits, reconciles bank statements per entity every day, manages debtors and dunning, processes supplier and maintenance invoices, handles VAT with its mix of exempt residential rent and taxed commercial leases, settles service charges per complex, closes the period, consolidates the entities per fund and produces investor and owner statements for the auditor and the asset manager. Leads a small team of two to six accounting staff and is judged on how fast and how cleanly the period closes.", "careAbout": ["Every active contract invoiced in the periodic rent run at the right amount, with indexation, service charge advances and VAT treatment applied without manual correction", "Bank statements of every entity matched to invoices and supplier payments the same day, so the debtor and creditor positions are true at any moment", "A dunning process that runs on schedule, treats tenants correctly and hands over to collection with a complete file, without the team chasing individual invoices", "Supplier and maintenance invoices captured, coded, approved and paid within terms and matched to work orders and contracts", "VAT returns per entity, pro-rata calculations and taxed-lease options handled correctly, and the ICP and audit file ready without a rebuild", "A period close per entity and consolidation per fund that finishes in days, with service charge settlements and investor statements produced from the same books"]}, {"id": "prpm", "name": "Property Manager", "icon": "customer-prpm-portrait.jpg", "group": "Property Management and VvE Firms", "description": "Manages leases and tenant relations on behalf of owner clients at a Dutch property management firm: lets vacant units, screens candidates and checks the rent price against the points system, creates and e-signs contracts, runs the annual indexation, processes changes and terminations, settles deposits and service charges, and sends owners their periodic statements. Typical employer: a firm such as FIT Vastgoedbeheer, Ruijters or CRMD Vastgoed Management, or one of the property managers from the Informant base, administering a few hundred to several thousand residential and commercial units for dozens of private owners, family offices and small investors, with a lettings and administration team of two to fifteen people.", "careAbout": ["Every vacant unit re-let within weeks, to a candidate whose income, identity and rental history were checked and documented before the contract was drafted", "A rent price that is demonstrably within the legal maximum for regulated and mid-rent units, with the points calculation and rent-price check stored on the contract", "One lease record that drives the contract text, the rent invoice, the indexation letter, the service charge advance and the deposit, so a change is made once and lands everywhere", "Indexation, terminations, deposit returns and service charge settlements executed on the legal deadlines without a colleague remembering them", "Owners who see their statements, payouts and documents without calling, and who approve a repair or a new tenant in a day rather than a week", "Units administered per employee growing when a new owner mandate arrives, instead of a vacancy in the team"]}, {"id": "mdir", "name": "Real Estate Company Director", "icon": "customer-mdir-portrait.jpg", "group": "Real Estate Business Leadership", "description": "Managing director, owner or partner of a Dutch or German real estate organisation of 5 to 200 FTE: an investment and asset management firm such as Rockfield, Urban Interest, Burgstate or Dunavast, a third-party property manager such as FIT Vastgoedbeheer, Ruijters or CRMD Vastgoed Management, or one of the hundreds of property managers and VvE administrators that grew up on Informant since the 1990s. Signs the ERP subscription, decides which of the eight modules (Relaties, Projecten, Objecten, Techniek, Contracten, Financieel, Rapportages, Portalen) and which add-ons (portals, API Platform, hyper automation) get switched on, sponsors the migration from Informant, a legacy package or spreadsheets, and is personally accountable to owners, investors, lenders, the tax authority and the Huurcommissie rent rules. Judges the platform on units and associations managed per FTE, operating margin, client retention, compliance and total cost of ownership rather than on feature lists.", "careAbout": ["Growing the number of units, entities and associations under management without adding back-office headcount in a tight Dutch labour market", "A healthy operating margin in a trade where management fees are a few percent of rent and every manual correction eats into it", "Keeping owner and investor mandates for decades by delivering statements, reports and service that clients can check for themselves", "One system of record from object to bank statement so that letting, technical management, finance and reporting stop re-keying each other's data", "Passing every audit, rent-price check, VAT return and investor covenant test as a by-product of daily operations rather than a quarterly scramble", "Predictable total cost of ownership: a subscription that scales with modules and portfolio size, not surprise consultancy invoices or a forced migration"]}];
    const productJobs = [{"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerIcon": "customer-asmg-portrait.jpg", "jobId": "jtbd-asmg-1", "jobName": "Know portfolio performance in real time", "jobOutcome": "Occupancy, rent roll, arrears, valuations and capex are available per unit, complex, entity and fund from one system of record, are reconciled with the ledger without a monthly reconciliation exercise, and the asset manager can answer any performance question the same day with figures that survive audit and due diligence.", "steps": [{"step": "Keep object, unit, entity and contract master data complete", "description": "Register every complex, building, unit, parking place and storage box with its surface, energy label, WOZ value, ownership entity and financing, and link every active lease, option and special term to its unit and tenant. When a portfolio is acquired or migrated from a legacy system such as Informant, import the objects, relations, contracts and opening balances in one structured onboarding rather than re-keying them over months.", "howItSupports": "Brings entities, objects, complexes, units, relations, contracts and opening balances from contracts, spreadsheets or a legacy system into one structured portfolio with validation of gaps and duplicates. Shows master-data completeness per complex and entity so the asset manager knows which units lack surface, energy label or contract links before they distort a report."}, {"step": "Monitor occupancy, vacancy and the rent roll", "description": "Follow let, vacant and in-notice units per complex and entity, the contracted versus market rent per square metre, upcoming expiries and break options, and the letting pipeline of the property manager. Distinguish structural vacancy from turnover vacancy and see for how many days a unit has been empty and why.", "howItSupports": "Provides the occupancy, vacancy-days, expiry and rent-roll dashboards per entity, complex and unit type, refreshed from contracts and letting status rather than from a monthly extract. Keeps every contract's start, end, notice, break option and rent history current so the rent roll reflects what is actually signed. Feeds vacancy and letting-pipeline status per unit so the asset manager sees when a vacant unit is listed, has viewings or a candidate in screening."}, {"step": "Track collection, arrears and cash per entity", "description": "See invoiced rent, collected rent and arrears per entity, complex and tenant, with ageing buckets and the dunning stage each debtor is in. Judge whether a dip in collection is a payment-timing effect, a tenant in trouble or a direct-debit mandate problem, and follow up with the property manager or the finance controller.", "howItSupports": "Supplies invoiced, collected and outstanding amounts per contract and entity, ageing buckets and dunning stage, straight from the rent runs and bank reconciliation. Puts collection rate and arrears next to occupancy and rent growth per entity, so cash performance is read in the same cockpit as operational performance."}, {"step": "Follow valuations, yields and market position", "description": "Record external appraisals and internal valuations per object, compare gross and net initial yields with market benchmarks and transactions, watch loan-to-value and interest cover per financed entity, and prepare the valuation inputs (rent roll, vacancy, capex, lease terms) that appraisers and lenders request each half year.", "howItSupports": "Links valuations and market data to objects and computes yield, value per square metre and covenant ratios per entity, with a valuation-input export for appraisers and lenders. Provides the audited net rental income and balance-sheet figures per entity that valuation and covenant calculations must reconcile with."}, {"step": "Watch capex and project spend against budget", "description": "Track renovation, sustainability and transformation projects per object with budget, commitments, invoices and milestones, see forecast-to-complete against the business case, and follow the hand-over of a delivered building or renovated units into the exploitation books and the rent roll.", "howItSupports": "Holds project budgets, commitments, invoices and milestones per object and moves delivered units into exploitation without re-keying. Shows capex spent and committed against budget per complex alongside the rent effect of the investment."}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerIcon": "customer-asmg-portrait.jpg", "jobId": "jtbd-asmg-2", "jobName": "Grow rental income through indexation, letting and active asset management", "jobOutcome": "Every eligible contract is indexed on time with the correct index and cap, vacancy days per turnover and structural vacancy fall, renewals and rent reviews are decided before deadlines pass, service charges are recovered rather than absorbed, and net rental income grows like-for-like without a compliance incident.", "steps": [{"step": "Run the annual indexation round across the portfolio", "description": "Select the contracts due for indexation by anniversary date or by 1 July, apply the contractual index (CPI, CPI plus a percentage, Staffel) and the legal or contractual caps, generate the rent-increase letters with the required notice period, post the new rents to the next rent run, and handle objections and regulated-sector exceptions without pausing the batch.", "howItSupports": "Calculates indexation per contract from the index series and contract terms, produces the letters and posts the new rent, with an exception list for capped, regulated and special-term contracts. Picks up the new rent amounts in the next periodic rent run and adjusts direct-debit amounts and mandates. Runs the indexation batch and letter generation as a scheduled robot job so thousands of contracts are processed without a manual campaign."}, {"step": "Shorten vacancy and turnover time with the property manager", "description": "Set target rents and letting conditions per unit type and complex, watch listed units, viewings, screened candidates and rent-price checks in the letting pipeline, approve exceptions such as incentives or below-target rents, and push the property manager on units that exceed the vacancy-day norm.", "howItSupports": "Runs listing, viewings, candidate screening, rent-price check, contract generation and e-signing so a unit moves from notice to signed lease in one flow with approvals for the asset manager. Reports vacancy days per turnover and per complex against the norm and flags units that stall in the pipeline."}, {"step": "Manage renewals, break options and commercial rent reviews", "description": "Get a rolling view of commercial leases approaching expiry, break or review dates, decide whether to renew, re-let or renegotiate, negotiate rent-free periods and incentives, and record the outcome as a contract change so the rent roll and cash flow forecast update immediately.", "howItSupports": "Tracks break options, expiries and review clauses per contract, generates the renewal or termination documents and records rent changes and incentives with effective dates. Shows expiry and break-option exposure per year and the rent-roll effect of each renewal decision."}, {"step": "Recover service charges fully and defensibly", "description": "Set the service charge advances per complex at a realistic level, monitor recoverable costs during the year, review the annual settlement per complex and tenant within the legal deadline, and adjust advances so that non-recoverable cost and tenant disputes shrink year on year.", "howItSupports": "Calculates the annual service charge settlement per complex and contract from booked costs and distribution keys and produces the tenant statements. Delivers the booked recoverable and non-recoverable costs per complex that the settlement and the recovery-rate analysis rest on."}, {"step": "Decide on capex, transformation and hold or sell", "description": "Build the case for a renovation, energy-label upgrade, transformation of offices into housing or a disposal on the object's rent roll, vacancy, valuation, capex forecast and financing, run the project when approved, and compare the realised rent and value uplift with the business case afterwards.", "howItSupports": "Carries the approved project budget, commitments and milestones and hands the delivered units over into exploitation. Provides the object-level rent, vacancy, valuation and yield history and the before-and-after comparison for each investment case."}]}, {"customerId": "asmg", "customerName": "Asset and Portfolio Manager", "customerIcon": "customer-asmg-portrait.jpg", "jobId": "jtbd-asmg-3", "jobName": "Report to investors and lenders without a reporting project", "jobOutcome": "Investor and lender reports are generated from the closed period and the live rent roll in days rather than weeks, every figure traces back to contracts, invoices and bank lines, ad-hoc questions are answered from the same data, and the asset manager spends the quarter steering assets instead of assembling spreadsheets.", "steps": [{"step": "Define the reporting pack per fund, investor and lender", "description": "Agree with each fund, investor and lender which figures, definitions and layouts they need (rent roll, occupancy, net rental income, covenants, capex, ESG), map them to entities and ledger accounts, and set the reporting calendar so the pack is a template that refreshes every quarter rather than a new document.", "howItSupports": "Holds the report definitions per fund, entity and lender, mapped to ledger accounts and rent-roll fields, and the reporting calendar. Supplies the standard real estate KPI definitions (occupancy, yield, rent per square metre) that the packs reuse so investors see consistent numbers."}, {"step": "Close the period with the finance controller", "description": "Confirm with finance that rent runs, bank reconciliation, supplier invoices, accruals and valuation postings are complete per entity, review the period-close checklist, and freeze the figures so the operating data in the report and the ledger tell the same story.", "howItSupports": "Runs the close checklist per entity, consolidates the entities of a fund and locks the period so reports are built on frozen figures. Confirms that all rent runs are invoiced and payments matched for the period, so invoiced and collected rent in the report equal the ledger."}, {"step": "Generate the quarterly reports and dashboards", "description": "Produce the investor pack per fund and the lender pack per financed entity from the closed period: rent roll and occupancy, net rental income versus budget, arrears, valuations and yields, covenant ratios, capex and projects. Review exceptions and commentary, and publish interactive dashboards for investors who prefer them to a PDF.", "howItSupports": "Generates the investor and lender report packs from the closed ledger and the rent roll with the agreed definitions and layouts. Provides the interactive dashboards and Power BI datasets that investors and the asset management team explore between quarterly packs."}, {"step": "Answer covenant tests and ad-hoc investor questions", "description": "Run the loan-to-value, interest-cover and debt-service tests per financed entity when the bank asks, answer questions on a specific complex, tenant concentration, expiry profile or energy-label distribution within a day, and keep every answer traceable to the data it came from.", "howItSupports": "Lets the asset manager slice occupancy, rent, expiries, valuations and energy labels by entity, complex and tenant on demand and export the answer with its source. Provides an AI assistant that drafts answers to recurring investor and lender questions from the portfolio data and the API that feeds the investor's own BI tools."}, {"step": "Share reports and approvals through the investor and owner portal", "description": "Publish the packs, dashboards, valuation reports and project updates to investors, joint-venture partners and lenders in a branded portal with the right access per fund and entity, collect approvals for capex and sale decisions where the structure requires them, and retire the e-mail-and-attachment distribution.", "howItSupports": "Gives investors and partners a portal with reports, statements, documents and approvals scoped to their funds and entities. Publishes the released report versions and investor statements to the portal and keeps the distribution history."}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerIcon": "customer-finc-portrait.jpg", "jobId": "jtbd-finc-1", "jobName": "Invoice and collect every euro of rent on time", "jobOutcome": "The rent run per entity goes out on the invoicing date without manual corrections, direct debits are collected on schedule, payments are matched automatically, arrears are visible and acted on by ageing bucket, and the collection rate stays above target with a complete file for every case handed to collection.", "steps": [{"step": "Prepare and check the periodic rent run", "description": "Before the invoicing date, review contract changes since the last run (new leases, terminations, indexations, changed service charge advances, deposit settlements), run the pre-invoicing check per entity for anomalies such as zero amounts, missing VAT codes or overlapping periods, and release the run.", "howItSupports": "Builds the periodic rent run per entity from active contracts and runs the pre-invoicing check that flags anomalies before invoices are generated. Delivers the contract changes with effective dates (indexation, changes, terminations, advances) that the rent run must reflect."}, {"step": "Issue invoices and collect through direct debit", "description": "Generate the invoices with the correct VAT treatment per contract, deliver them to tenants by e-mail and the tenant portal, create the SEPA direct debit batch per entity with valid mandates and pre-notifications, submit it to the bank and process rejections and reversals.", "howItSupports": "Generates invoices and SEPA direct debit batches per entity, submits them through the bank integration and books rejections and reversals back to the debtor. Publishes invoices, payment status and mandate details to the tenant portal and app so tenants pay and check without calling."}, {"step": "Match incoming payments to invoices every day", "description": "Import bank statements per entity daily, let the matching rules and robot allocate transfers and direct debit collections to open invoices by reference, amount and debtor, handle partial payments, overpayments and payments on the wrong entity, and keep the debtor position true at the end of each day.", "howItSupports": "Matches bank lines to open rent invoices automatically per entity and queues the unmatched remainder for manual allocation. Runs the daily statement import and matching robot and learns allocation rules from the controller's manual decisions."}, {"step": "Run dunning and agree payment arrangements", "description": "Execute the dunning schedule per entity and tenant type (reminder, formal notice, final notice with costs), pause it for tenants with an agreed payment plan or a dispute, register payment arrangements and monitor compliance, and coordinate with the property manager on tenants who need a conversation rather than a letter.", "howItSupports": "Runs the configurable dunning schedule, records payment arrangements and disputes, and reports arrears by ageing bucket and dunning stage. Lets tenants see their arrears, propose a payment plan and pay online, reducing the letters and calls the team handles."}, {"step": "Hand over to collection and settle deposits and write-offs", "description": "For tenants that do not respond, compile the collection file (contract, invoices, dunning history, correspondence) for the collection agency or bailiff, follow the case, settle deposits against final invoices at termination, and book write-offs and provisions per entity with the asset manager's approval.", "howItSupports": "Assembles the collection file from the debtor history and tracks handed-over cases, recoveries and write-offs per entity. Settles the deposit against the final invoice and damages at termination and closes the contract's financial position. Books provisions and write-offs per entity so the debtor position in the closed period is realistic."}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerIcon": "customer-finc-portrait.jpg", "jobId": "jtbd-finc-2", "jobName": "Keep multi-entity books accurate and reconciled every day", "jobOutcome": "Every entity's ledger is reconciled with its bank accounts, debtors and creditors at the end of each day, supplier invoices are approved and paid within terms, VAT is filed correctly per entity, intercompany positions balance, and the finance team spends its time on exceptions and analysis rather than on booking and reconciling.", "steps": [{"step": "Maintain the entity structure, chart of accounts and opening balances", "description": "Set up each legal entity with its objects, bank accounts, loans, VAT status and reporting group, apply the group chart of accounts and cost-centre structure per complex, and load opening balances when an entity or portfolio is acquired or migrated from a legacy system.", "howItSupports": "Creates entities, bank accounts, chart of accounts mappings and opening balances as part of portfolio onboarding, including migrations from legacy systems. Holds the multi-entity ledger, cost centres per complex and the consolidation structure per fund that all postings follow."}, {"step": "Capture, code and approve supplier and maintenance invoices", "description": "Receive supplier invoices by e-mail, portal or e-invoicing, let the AI assistant extract and code them to entity, complex, cost account and recoverability, match them to work orders, maintenance contracts or project commitments, route them through the approval workflow and schedule payment within terms.", "howItSupports": "Runs accounts payable: invoice capture, coding to entity, complex and account, approval workflow and payment batches per entity. Provides the work orders and completion reports that maintenance invoices are matched against before approval. Supplies the AI invoice-coding assistant and the inbox robot that turn incoming invoices into coded, matched drafts."}, {"step": "Reconcile bank accounts per entity daily", "description": "Import statements for every entity's bank accounts through the bank connectors, match rent receipts, supplier payments, loan instalments, interest and bank costs to the ledger, book the unmatched lines, and confirm at day end that every bank balance equals the ledger balance per entity.", "howItSupports": "Imports bank statements per entity through the bank integration and matches receipts and payments to open items. Reconciles bank balances to ledger balances per entity and books the remaining lines such as interest, loan instalments and bank costs. Runs the daily reconciliation robot and reports the automation rate and the exceptions that need a person."}, {"step": "Handle VAT, pro-rata and tax positions per entity", "description": "Apply the right VAT treatment per contract and invoice (exempt residential rent, taxed commercial leases with an opted lease, service charges), calculate the pro-rata deduction on mixed-use entities, prepare and file the VAT return and ICP per entity, and keep the transfer tax, property tax and depreciation positions correct for the accountant.", "howItSupports": "Handles VAT coding per contract and invoice, pro-rata calculations, VAT return preparation and tax positions per entity. Applies the contract's VAT treatment to every rent and service charge invoice so the VAT return is built from correct source documents."}, {"step": "Balance intercompany positions and automate recurring postings", "description": "Book management fees, recharges and loans between entities as matched intercompany pairs, run recurring postings for depreciation, accruals, loan interest and prepayments per entity on schedule, and let robots and integrations with the accountant's software take over repetitive work so the team handles only exceptions.", "howItSupports": "Posts intercompany pairs, recurring journals and accruals per entity and checks that intercompany positions balance across the group. Schedules the recurring posting robots and connects the ledger to the accountant's and auditor's tools through certified integrations and the API."}]}, {"customerId": "finc", "customerName": "Real Estate Finance Controller", "customerIcon": "customer-finc-portrait.jpg", "jobId": "jtbd-finc-3", "jobName": "Close the period and settle service charges without spreadsheets", "jobOutcome": "The period closes per entity in days with a documented checklist, consolidation per fund and investor statements come out of the same books, service charge settlements are issued to every tenant before the legal deadline with postings that reconcile to the ledger, and the auditor works from a complete file without a spreadsheet trail.", "steps": [{"step": "Run the period-close checklist per entity", "description": "Work through the close checklist per entity: rent runs complete, bank reconciled, supplier invoices booked, VAT reconciled, intercompany balanced, sub-ledgers tied to the general ledger. Track who completed what, resolve open items and lock the period when the checklist is green.", "howItSupports": "Provides the close checklist per entity with status per task, sub-ledger tie-outs and the period lock. Runs the tie-out checks and reminder tasks automatically so the controller sees only the entities and items that are not green."}, {"step": "Post accruals, depreciation, valuations and loan positions", "description": "Book accruals for costs not yet invoiced, prepayments, depreciation per object, loan interest and repayments, and the valuation results and deferred tax positions per entity, using the valuation records and project data already in the system rather than a separate valuation spreadsheet.", "howItSupports": "Posts accruals, depreciation, loan and valuation journals per entity from configured schedules and the valuation and project records. Provides the valuation records per object that the revaluation postings and the investor statements rely on."}, {"step": "Settle service charges per complex within the legal deadline", "description": "After year end, gather the recoverable costs booked per complex, apply the distribution keys and the contractual and legal rules per tenant, calculate the settlement against the advances paid, issue the statements to tenants and post the receivables or payables and the next year's advances in one run, complex by complex, before the statutory deadline.", "howItSupports": "Calculates the service charge settlement per complex and contract from booked costs, keys and advances, produces tenant statements and updates the advances. Supplies the booked recoverable costs per complex and posts the settlement receivables and payables per entity. Invoices or refunds the settlement amounts and collects them through the normal direct debit and dunning cycle."}, {"step": "Consolidate per fund and produce investor and owner statements", "description": "Consolidate the entities of each fund with intercompany eliminations, produce the balance sheet, profit and loss and cash flow per entity and fund, generate investor and owner statements with distributions, and publish them to the investor and owner portal for the asset manager and the investors.", "howItSupports": "Consolidates entities per fund, eliminates intercompany positions and generates the financial statements and investor statements. Publishes the statements and distributions to investors and owners in their portal with scoped access per fund."}, {"step": "Hand over to the accountant and auditor through integrations", "description": "Give the accountant and auditor access to the closed period, the audit file and the supporting documents through certified integrations with their software and the API, answer sample requests from the document trail, and process the annual accounts adjustments back into the ledger without re-keying.", "howItSupports": "Provides the certified accounting integrations, the audit-file export and the API through which the accountant and auditor read the closed period. Keeps the document trail from every posting to its invoice, bank line or contract and books the year-end adjustments into the locked period under control."}]}, {"customerId": "prpm", "customerName": "Property Manager", "customerIcon": "customer-prpm-portrait.jpg", "jobId": "jtbd-prpm-1", "jobName": "Fill a vacant unit with the right tenant fast and compliantly", "jobOutcome": "Each vacancy is filled within weeks rather than months by a screened tenant, at a rent that is documented as compliant, with a signed contract and a paid deposit before the keys change hands, and every step traceable for the owner and for a rent tribunal.", "steps": [{"step": "Register the termination and prepare the unit for re-letting", "description": "Record the tenant's notice against the contract, calculate the end date and the notice period, plan the pre-inspection and final inspection, and raise the small repairs and cleaning needed before viewings can start. Decide with the owner whether the unit is re-let at the same rent, renovated first or upgraded to a higher points class.", "howItSupports": "Registers the termination against the lease, calculates end date and notice period and schedules the inspections and deposit settlement. Turns the pre-inspection findings into work orders for cleaning and repairs so the unit is ready before the first viewing. Opens the vacancy record with the expected availability date so the unit appears in the letting pipeline as soon as notice is given."}, {"step": "Publish the listing and organise viewings", "description": "Create the listing from the unit record with photos, floor area, energy label, points score and asking rent, publish it to the firm's website and listing channels, and plan viewings in slots that candidates book themselves. Keep the owner informed of interest and viewing results.", "howItSupports": "Generates the listing from the unit data, tracks candidate interest and viewing appointments per vacancy. Lets candidates register interest and book viewings online and shows the owner the letting status of their unit in the owner portal."}, {"step": "Screen candidates and check the rent price", "description": "Collect the candidate's identity, income and employer documents through a secure upload, apply the firm's income ratio and guarantor rules, check the rental history and any sanctions or fraud lists that the firm uses, and calculate the points score so the asking rent is verified against the legal maximum for regulated and mid-rent units before an offer is made.", "howItSupports": "Holds the candidate file, applies screening rules, ranks candidates and records the reasons for acceptance or rejection for the owner and the tenant. Connects the Huurprijscheck.app rent-price check so the points calculation and the maximum rent are fetched and stored on the vacancy instead of retyped."}, {"step": "Generate the lease contract and get it e-signed", "description": "Draft the contract from the firm's template for the contract type (indefinite, fixed-term, room, commercial under the 290 or 230a regime), with the special terms, service charge advances, deposit and indexation clause filled from the unit and candidate record, send it for digital signature to the tenant, guarantor and owner, and store the signed version on the lease.", "howItSupports": "Generates the contract from templates and structured lease data and routes it through e-signing to every signing party. Runs the e-signing integration and files the signed document and audit trail on the lease automatically."}, {"step": "Collect the deposit and first rent and hand over the keys", "description": "Invoice the deposit and the first rent period, watch the incoming payments, activate the direct debit mandate, schedule the check-in inspection with meter readings and photos, and release the keys only when the money is in and the inspection report is signed by both parties.", "howItSupports": "Creates the deposit and first-rent invoices, matches the payments on the bank statement and activates the direct debit mandate for the periodic rent. Records the check-in inspection with meter readings and photos and closes the vacancy when the keys are handed over. Gives the new tenant a portal account with the contract, the inspection report and the payment overview from day one."}]}, {"customerId": "prpm", "customerName": "Property Manager", "customerIcon": "customer-prpm-portrait.jpg", "jobId": "jtbd-prpm-2", "jobName": "Run every lease through indexation, changes and termination without errors", "jobOutcome": "No lease misses its indexation, no termination is processed late, deposits and service charges are settled correctly and on the legal deadlines, and the firm can show for every lease event who did what and when.", "steps": [{"step": "Run the annual rent indexation", "description": "Select the leases due for increase, apply the permitted percentage per segment (regulated, mid-rent and liberalised follow different rules, and commercial contracts follow their own index clause), generate the increase letters within the statutory notice period, update the rent invoices and direct debit amounts, and handle objections.", "howItSupports": "Calculates the permitted increase per lease and contract type, generates the letters and records the new rent with its effective date. Runs the indexation as a supervised robot batch nd VAT per owner and per entity, produce the statement in the owner's format and pay out the balance to the owner's account by batch payment.", "howItSupports": "Generates the owner statement from the ledger per entity and object, including fees and VAT, and archives it. Supplies the collected rent and arrears per owner and creates the payout batch to the owners' bank accounts. Runs the statement and payout cycle as a scheduled robot with exceptions routed to the property manager."}, {"step": "Give owners self-service through the owner portal", "description": "Activate every owner on a branded portal where they see occupancy, rent collected, open tickets, statements, contracts and documents for their properties in real time, so that the standard questions stop arriving by phone and email.", "howItSupports": "Provides the owner portal with statements, documents, tickets and performance per property, updated from the system of record."}, {"step": "Obtain approvals for expenses and new tenants", "description": "Route repair quotes above the mandate limit, candidate tenant proposals and rent changes to the owner for approval with the underlying documents, record the decision with a timestamp, and continue the process automatically once approved.", "howItSupports": "Presents approval requests in the owner portal and app and records the owner's decision on the ticket, candidate or lease. Holds the work order until the owner has approved the quote and releases it to the supplier afterwards."}, {"step": "Review the property's performance with the owner", "description": "Prepare the annual review: gross and net yield, vacancy, arrears, maintenance spend, indexation applied and the market rent compared with the contract rent, and advise the owner on renovation, rent policy or sale.", "howItSupports": "Produces yield, vacancy and cost dashboards per owner and property and compares contract rents with market data. Delivers the annual owner report with the financial statements per entity and property."}]}, {"customerId": "mdir", "customerName": "Real Estate Company Director", "customerIcon": "customer-mdir-portrait.jpg", "jobId": "jtbd-mdir-1", "jobName": "Scale units under management without scaling headcount", "jobOutcome": "Units and associations per FTE rise year over year; a newly acquired portfolio or a migrated Informant client is absorbed without a new administrator; the director can take on a new mandate or buy a competitor without first hiring.", "steps": [{"step": "Map where the hours go today", "description": "Walk the lifecycle Portfolio to Let to Contract to Collect to Maintain to Account to Report to Serve with the team and count the hand-offs: objects in one package, contracts in Word, rent runs in the accounting system, bank statements matched by hand, fault reports in a shared mailbox, owner statements in Excel.", "howItSupports": "Provides the baseline of units, hours and cost per process step that shows where headcount is being spent. Exposes how many parallel registers of objects, contracts and relations exist and must be consolidated."}, {"step": "Bring the portfolio onto one data model", "description": "Load entities, objects, complexes, units, relations, contracts and opening balances once so that rent runs, tickets, ledgers, statements and dashboards all read the same record; retire the parallel spreadsheets and the legacy package one by one.", "howItSupports": "Imports the portfolio from Informant, spreadsheets or a legacy system into one structure of entities, objects, units, relations and contracts. Generates the rent run, direct debit and reconciliation straight from the contracts, removing double entry into finance. Makes the multi-entity ledger and the owner and investor statements read from the same transactions."}, {"step": "Automate repetitive financial and technical work", "description": "Switch on hyper automation robots for bank reconciliation, invoice coding, indexation letters and dunning, and AI assi automation and portal step."}]}, {"customerId": "mdir", "customerName": "Real Estate Company Director", "customerIcon": "customer-mdir-portrait.jpg", "jobId": "jtbd-mdir-2", "jobName": "Win and retain owner and investor clients with service quality", "jobOutcome": "Owner and investor mandates renew without a tender, referrals become the main source of new clients, and a new mandate is live on the platform and its portals within a quarter.", "steps": [{"step": "Define the service promise per client type", "description": "Agree with the team what a private owner, an institutional investor, an owners' association and a lender each get: statement timing, report content, approval thresholds, response times on faults and the portal they use.", "howItSupports": "Provides the performance and service data the promise is built on and measured against. Defines the standard owner statement and investor report content per client type."}, {"step": "Deliver owner statements and investor reports on time, every period", "description": "Have the monthly or quarterly owner statement and the investor report produced from the closed ledger by the same robot every period, reviewed by the controller, and published to the owner portal without a spreadsheet in between.", "howItSupports": "Closes the period and produces owner and investor statements from the multi-entity ledger. Publishes statements and reports to the owner portal with notifications and an audit trail."}, {"step": "Show responsiveness through the portals", "description": "Let owners see fault reports, work orders, quotes and approvals in real time in their portal, and let tenants follow their tickets, so the quality of technical and tenant management is visible instead of asserted.", "howItSupports": "Gives owners real-time visibility of tickets, approvals and documents on their property. Supplies the ticket, work order and completion data that owners and tenants follow."}, {"step": "Onboard a new mandate in weeks", "description": "Import the new client's objects, units, contracts and relations, set up the entity and bank connection, let the vacant units, and give the owner portal access before the first rent run, so the client experiences the switch as an upgrade.", "howItSupports": "Brings the new mandate's portfolio and contracts onto the platform with validated data. Fills vacant units of the new mandate with screened tenants and e-signed contracts from the first month."}, {"step": "Track retention and referrals", "description": "Review mandate renewals, lost clients, owner satisfaction and referral-sourced leads per quarter, and act on the clients whose statements were late or whose approvals stalled.", "howItSupports": "Reports client retention, statement timeliness and service KPIs per client on the management dashboard."}]}, {"customerId": "mdir", "customerName": "Real Estate Company Director", "customerIcon": "customer-mdir-portrait.jpg", "jobId": "jtbd-mdir-3", "jobName": "Run a compliant, insight-driven real estate business", "jobOutcome": "The director opens one dashboard on Monday morning and knows occupancy, arrears, margin per client and per entity and cash position; rent-price checks, indexation, VAT returns and audit files come from the system with no spreadsheet reconciliation.", "steps": [{"step": "Define the steering KPIs", "description": "Agree with finance, letting and technical management on the handful of numbers that run the business: units per FTE, operating margin, occupancy, arrears share, ticket resolution time, days to close and client retention.", "howItSupports": "Turns the KPI definitions into dashboards fed from contract, invoice, ticket and ledger data."}, {"step": "Get margin and arrears live per client and per entity", "description": "Have management fees, staff cost, rent invoiced, rent collected and supplier cost flow into a live margin and arrears view per client, entity and complex, so pricing of mandates and collection decisions are made on facts during the year, not after it.", "howItSupports": "Provides the drill-down from portfolio to client, entity, complex and unit. Supplies invoiced, collected and overdue rent per contract in real time. Adds actual supplier invoices and fees so realised margin replaces planned margin."}, {"step": "Make compliance a by-product of the process", "description": "Ensure every letting runs a rent-price check and candidate screening, every indexation follows the legal cap and the contract clause, every service charge settlement is issued on time and every VAT return and audit file comes straight from the ledger.", "howItSupports": "Embeds rent-price checks and screening in every letting before the contract is signed. Applies indexation caps, special terms and settlement deadlines automatically across all contracts. Produces VAT returns, audit files and investor covenant reports from the closed ledger."}, {"step": "Keep data secure and integrations under control", "description": "Manage who in the firm, at clients and at partners can see and change what, keep accounting, bank, e-mail and maintenance partner connections certified and monitored, and be able to show the auditor and the investor how the SaaS environment is secured.", "howItSupports": "Provides certified integrations, API connections and monitored robot runs with an audit trail. Controls what each tenant, owner and supplier can see and do in the branded portals."}, {"step": "Review, decide and adjust weekly", "description": "Run the weekly management meeting from the dashboard: chase arrears, decide on vacant units and rent levels, prioritise maintenance budgets, review late statements and track the effect next week.", "howItSupports": "Provides weekly KPI trends and drill-down to client, entity and unit level. Shows maintenance budgets and multi-year plans against actual spend for the meeting's capex decisions."}]}];

    // Derive this product's deployed bricks and the channels they ship to from
    // deployment.json (deployedBricks[].usedInProducts). products.json no longer carries
    // brick/channel links.
    function buildProductDeployment() {
        const channelMeta = {};   // ref -> {ref, groupId, groupName, channelName, channelType, ...}
        const bricks = {};        // brickId -> {brickId, brickName, description, channelRefs:Set}
        (deployment.channels || []).forEach(group => {
            (group.channels || []).forEach(channel => {
                const ref = (group.groupId || '') + '/' + (channel.subChannelId || '');
                (channel.deployedBricks || []).forEach(deployed => {
                    const use = (deployed.usedInProducts || []).find(item => item.productId === product.id);
                    if (!use) {
                        return;
                    }
                    if (!channelMeta[ref]) {
                        channelMeta[ref] = {
                            ref: ref,
                            groupId: group.groupId || '',
                            groupName: group.groupName || prettifyChannelGroup(group.groupId || 'other'),
                            groupDescription: group.description || '',
                            name: channel.subChannelName || channel.subChannelId || ref,
                            channelId: channel.subChannelId || '',
                            channelType: channel.channelType || '',
                            description: channel.description || '',
                            bricks: []
                        };
                    }
                    if (!bricks[deployed.brickId]) {
                        bricks[deployed.brickId] = {
                            brickId: deployed.brickId,
                            brickName: deployed.brickName || deployed.brickId,
                            description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name),
                            channelRefs: new Set()
                        };
                    }
                    bricks[deployed.brickId].channelRefs.add(ref);
                    channelMeta[ref].bricks.push({
                        brickId: deployed.brickId,
                        brickName: deployed.brickName || deployed.brickId,
                        deploymentRole: deployed.deploymentRole || '',
                        description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name)
                    });
                });
            });
        });
        return {channelMeta: channelMeta, bricks: Object.values(bricks)};
    }

    // A usage note that only says "<brick> in <product>" repeats the names around it; drop it.
    function meaningfulUsageNote(note, brickName, productName) {
        const normalize = value => String(value || '').toLowerCase().replace(/[.\s]+$/, '').replace(/\s+/g, ' ').trim();
        const text = normalize(note);
        if (!text) return '';
        return text === normalize((brickName || '') + ' in ' + (productName || '')) ? '' : note;
    }

    let productDeploymentCache = null;
    function productDeployment() {
        if (!productDeploymentCache) {
            productDeploymentCache = buildProductDeployment();
        }
        return productDeploymentCache;
    }
    mermaid.initialize({

        }
    });

    function addTabLabels() {

    function addChannels() {
        const groups = getDeploymentChannelGroups();
        let html = '<div class="ch-page">';
        html += '<div class="pl-section-title">Deployment channels</div>';
        html += '<div class="pl-section-note">Where this product\'s bricks run, one channel per row: the channel on the left, the bricks it ships for this product on the right.</div>';
        if (!groups.length) {
            html += '<div class="activity-muted">No deployment channels defined for this product.</div>';
        }
        groups.forEach(group => {
            html += '<section class="ch-group">';
            html += '<div class="ch-group-head"><span class="ch-group-title">' + escapeHtml(group.name) + '</span>' +
                '<span class="ch-group-count">' + group.channels.length + (group.channels.length === 1 ? ' channel' : ' channels') + '</span></div>';
            if (group.description) {
                html += '<div class="ch-group-description">' + escapeHtml(group.description) + '</div>';
            }
            group.channels.forEach(channel => { html += renderChannelRow(channel); });
            html += '</section>';
        });
        html += '</div>';
        document.getElementById('Channels').innerHTML = html;
    }

    function renderChannelRow(channel) {
        const color = channelColor(channel.ref);
        const bricks = channel.bricks || [];
        let html = '<div class="ch-row" style="border-left-color:' + color + '">';

        html += '<div class="ch-info">';
        html += '<div class="ch-info-head">';
        html += '<div class="ch-icon" style="background:' + hexToRgba(color, 0.12) + ';">' + renderDeploymentIcon(channel) + '</div>';
        html += '<div class="ch-titles"><a class="ch-title" href="../deployment/' + encodeURIComponent(channel.channelId || '') + '.html">' + escapeHtml(channel.name || channel.ref) + '</a>';
        html += '<div class="ch-meta">' + escapeHtml(formatChannelPart(channel.deploymentPart)) + ' · ' + escapeHtml(channel.channelId || channel.ref) + '</div></div>';
        html += '</div>';
        if (channel.deploymentUnit) {
            html += '<div class="ch-description">' + escapeHtml(channel.deploymentUnit) + '</div>';
        }
        if (channel.pipeline) {
            html += '<div class="ch-description"><strong>Pipeline:</strong> ' + escapeHtml(channel.pipeline) + '</div>';
        }
        html += '</div>';

        html += '<div class="ch-bricks">';
        html += '<div class="ch-bricks-label">' + bricks.length + (bricks.length === 1 ? ' brick' : ' bricks') + ' for this product</div>';
        if (!bricks.length) {
            html += '<div class="activity-muted">No bricks deployed here for this product.</div>';
        } else {
            html += '<div class="ch-brick-grid">' + bricks.map(brick => {
                let item = '<a class="ch-brick" href="' + getBrickLandingPageHref(brick.brickId) + '">';
                item += renderSmallBrickIcon(brick.brickId, brick.brickName);
                item += '<span class="ch-brick-text"><span class="ch-brick-name">' + escapeHtml(brick.brickName || brick.brickId) + '</span>';
                const copy = brick.description;
                if (copy) item += '<span class="ch-brick-copy">' + escapeHtml(copy) + '</span>';
                return item + '</span></a>';
            }).join('') + '</div>';
        }
        html += '</div>';

        return html + '</div>';
    }

    function addBricks() {
        let html = '';

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function channelColor(ref) {
        const palette = ['#1d4ed8', '#b45309', '#047857', '#7c3aed', '#be123c', '#0f766e', '#c2410c', '#4338ca', '#15803d', '#a21caf'];
        const value = ref || 'channel';
        let hash = 0;
        for (let i = 0; i < value.length; i++) {
            hash = ((hash << 5) - hash) + value.charCodeAt(i);
            hash |= 0;
        }
        return palette[Math.abs(hash) % palette.length];
    }

        if (text.includes('cloud') || text.includes('runtime') || text.includes('edge') || text.includes('cdn')) {

    function hexToRgba(hex, alpha) {
        const value = (hex || '#6b7280').replace('#', '');
        const normalized = value.length === 3
            ? value.split('').map(part => part + part).join('')
            : value;
        const intValue = parseInt(normalized, 16);
        const r = (intValue >> 16) & 255;
        const g = (intValue >> 8) & 255;
        const b = intValue & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function slugify(value) {

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')

            .replaceAll('[', '(')

    }

    function mermaidNodeId(prefix, value) {

    function buildDependencyModel() {
        const channels = {};
        const bricks = {};

        const derived = productDeployment();
        derived.bricks.forEach(brick => {
            bricks[brick.brickId] = {
                id: brick.brickId,
                name: brick.brickName || brick.brickId,
                whyNeeded: brick.description || '',
                channelRefs: Array.from(brick.channelRefs)
            };
        });
        Object.values(derived.channelMeta).forEach(channel => {
            channels[channel.ref] = {
                id: channel.ref,
                name: channel.name || channel.ref,
                channelId: channel.channelId || '',
                part: channel.channelType || '',
                environmentName: channel.environmentName || '',
                deploymentUnit: channel.description || '',
                pipeline: ''
            };
        });

        return {
            channels: Object.values(channels).sort((a, b) => a.name.localeCompare(b.name)),
            bricks: Object.values(bricks).sort((a, b) => a.name.localeCompare(b.name))
        };
    }

    function ensureDependencyState() {
        if (dependencyState.initialized) {

        });
        model.bricks.forEach(item => {

        dependencyState.initialized = true;
    }

    function buildDependencyGraph(model) {
        const visibleChannels = new Set(model.channels.filter(item => dependencyState.channels[item.id] !== false).map(item => item.id));
        const visibleBricks = new Set(model.bricks.filter(item => dependencyState.bricks[item.id] !== false).map(item => item.id));

        const lines = ['flowchart LR'];
        const channelDefs = [];
        const brickDefs = [];
        const edges = new Set();

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                const labelParts = [item.name];
                if (item.part) {
                    labelParts.push(formatChannelPart(item.part));
                }
                channelDefs.push('    ' + mermaidNodeId('chan', item.id) + '[["' + escapeMermaidLabel(labelParts.join(' | ')) + '"]]');
            }
        });

        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                brickDefs.push('    ' + mermaidNodeId('brick', item.id) + '["' + escapeMermaidLabel(item.name) + '"]');
            }
        });

        model.bricks.forEach(brick => {
            if (!visibleBricks.has(brick.id)) {
                return;
            }
            (brick.channelRefs || []).forEach(channelKey => {
                if (!visibleChannels.has(channelKey)) {
                    return;
                }
                edges.add('    ' + mermaidNodeId('chan', channelKey) + ' --- ' + mermaidNodeId('brick', brick.id));
            });
        });

        if (!channelDefs.length && !brickDefs.length) {
            return '';
        }

        if (channelDefs.length) {
            lines.push('    subgraph Channels');
            channelDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        if (brickDefs.length) {
            lines.push('    subgraph Bricks');
            brickDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        Array.from(edges).sort().forEach(line => lines.push(line));

        lines.push('    classDef channel fill:#dbeafe,stroke:#2563eb,color:#1e3a8a');
        lines.push('    classDef brick fill:#d1fae5,stroke:#059669,color:#065f46');

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('chan', item.id) + ' channel');
            }
        });
        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('brick', item.id) + ' brick');
            }
        });

        return lines.join('\n');
    }

    function renderDependencySummary(model) {
        const visibleChannelCount = model.channels.filter(item => dependencyState.channels[item.id] !== false).length;
        const visibleBrickCount = model.bricks.filter(item => dependencyState.bricks[item.id] !== false).length;
        return '<div class="activity-summary">' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleChannelCount + '</div><div class="activity-stat-label">Channels</div></div>' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleBrickCount + '</div><div class="activity-stat-label">Bricks</div></div>' +
            '</div>';
    }

    function renderDependenciesTab() {
        ensureDependencyState();
        const container = document.getElementById('Dependencies');
        if (!container) {

        const model = buildDependencyModel();

        let html = '';
        html += '<div class="home-stage">';
        html += '<div class="home-stage-title">Dependencies</div>';
        html += '<div class="home-stage-subtitle">Channel-to-brick dependencies come from the deployed bricks used in this product</div>';
        html += renderDependencySummary(model);
        html += renderDependencyControls(model);

        if (!chart) {
            html += '<div class="dependency-empty">Select at least one channel or brick to render the dependency diagram.</div>';
        } else {
            html += '<div class="dependency-legend"><div class="dependency-control-title">Legend</div><div class="dependency-legend-items">';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#dbeafe; border-color:#2563eb;"></span>Channel</span>';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#d1fae5; border-color:#059669;"></span>Brick</span>';
            html += '</div></div>';
            html += '<div class="dependency-graph"><div class="mermaid">' + chart + '</div></div>';
        }
        html += '</div>';
        container.innerHTML = html;

        if (chart) {
            mermaid.run({querySelector: '#Dependencies .mermaid'}).catch(error => {
                console.error('Failed to render product dependency diagram', error);
            });
        }
    }

                card += '<div class="pl-card-label">Uses ' + stream.bricksUsed.length + ' of this product\'s bricks</div>';
                card += '<div class="pl-tags">' + stream.bricksUsed.map(id => '<span class="pl-tag">' + escapeHtml(brickNameById(id)) + '</span>').join('') + '</div>';
                return card + '</a>';
            }).join('') + '</div>';
        }
        document.getElementById('tab_content_streams').innerHTML = html + '</div>';
    }

    // ---- Overview: the product at a glance; every detail lives in its own tab. ----
    const OVERVIEW_CHIP_LIMIT = 8;

    function overviewChip(href, icon, fallback, label, meta, external) {
        let chip = '<a class="ov-chip" href="' + escapeHtml(href) + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>';
        if (icon) chip += '<img src="' + escapeHtml(icon) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
        chip += '<span class="ov-chip-text"><span class="ov-chip-label">' + escapeHtml(label) + '</span>';
        if (meta) chip += '<span class="ov-chip-meta">' + escapeHtml(meta) + '</span>';
        return chip + '</span></a>';
    }

    function overviewChipList(items, renderItem, tab, emptyText) {
        if (!items.length) return '<div class="ov-empty">' + escapeHtml(emptyText) + '</div>';
        let list = '<div class="ov-chips">' + items.slice(0, OVERVIEW_CHIP_LIMIT).map(renderItem).join('') + '</div>';
        if (items.length > OVERVIEW_CHIP_LIMIT) {
            list += '<button class="ov-more" onclick="openTab(\'' + tab + '\')">+' + (items.length - OVERVIEW_CHIP_LIMIT) + ' more</button>';
        }
        return list;
    }

    function overviewPanel(title, tab, count, body, note) {
        let panel = '<section class="ov-panel"><div class="ov-panel-head"><div class="ov-panel-title">' + escapeHtml(title) +
            (count !== null ? ' <span class="ov-panel-count">' + count + '</span>' : '') + '</div>';
        if (tab) panel += '<button class="ov-panel-link" onclick="openTab(\'' + tab + '\')">Details &rarr;</button>';
        panel += '</div>';
        if (note) panel += '<div class="ov-panel-note">' + escapeHtml(note) + '</div>';
        return panel + body + '</section>';
    }

    // How many other products deploy each of this product's bricks.
    function brickSharing() {
        const others = {};
        (deployment.channels || []).forEach(group => (group.channels || []).forEach(channel => (channel.deployedBricks || []).forEach(deployed => {
            (deployed.usedInProducts || []).forEach(use => {
                if (use.productId === product.id) return;
                (others[deployed.brickId] = others[deployed.brickId] || new Set()).add(use.productId);
            });
        })));
        return others;
    }

    function renderOverviewTab() {
        const groups = getDeploymentChannelGroups();
        const channels = groups.flatMap(group => group.channels.map(channel => ({...channel, groupName: group.name})));
        const bricks = productDeployment().bricks.slice().sort((a, b) => b.channelRefs.size - a.channelRefs.size || a.brickName.localeCompare(b.brickName));
        const sharing = brickSharing();
        const shared = bricks.filter(brick => sharing[brick.brickId] && sharing[brick.brickId].size).length;

        const tiles = [
            ['Customers', productCustomers.length, 'customers'],
            ['Customer jobs', productJobs.length, 'jobs'],
            ['Streams', productStreams.length, 'streams'],
            ['Channels', channels.length, 'ChannelsTab'],
            ['Bricks', bricks.length, 'BricksTab'],
            ['Shared bricks', shared, 'BricksTab'],
            ['Own bricks', bricks.length - shared, 'BricksTab'],
        ];
        let html = '<div class="ov">';
        if (product.type) html += '<div class="ov-facts"><span class="ov-fact">' + escapeHtml(product.type) + '</span></div>';
        html += '<div class="ov-tiles">' + tiles.map(([label, value, tab]) =>
            '<button class="ov-tile' + (value ? '' : ' zero') + '" onclick="openTab(\'' + tab + '\')"><span class="ov-tile-value">' + value +
            '</span><span class="ov-tile-label">' + escapeHtml(label) + '</span></button>').join('') + '</div>';

        html += '<div class="ov-section-title">Who it is for</div><div class="ov-grid">';
        html += overviewPanel('Customers', 'customers', productCustomers.length, overviewChipList(productCustomers, customer =>
            overviewChip('../../customers/landing_pages/' + customer.id + '.html', CUSTOMER_ICONS + (customer.icon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                customer.name, customer.group, true), 'customers', 'No primary customers are listed.'), '');
        html += overviewPanel('Customer jobs', 'jobs', productJobs.length, overviewChipList(productJobs, job =>
            overviewChip('#jobs', CUSTOMER_ICONS + (job.customerIcon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                job.jobName, job.customerName + ' · ' + job.steps.length + (job.steps.length === 1 ? ' step' : ' steps'), false),
            'jobs', 'No customer job steps reference this product.'), '');
        html += overviewPanel('Streams', 'streams', productStreams.length, overviewChipList(productStreams, stream =>
            overviewChip('../../product-bricks/stream_pages/' + stream.id + '.html', '../../product-bricks/icons/' + (stream.icon || 'stream.png'),
                '../../product-bricks/icons/stream.png', stream.name, stream.bricksUsed.length + ' of its bricks', true), 'streams', 'No streams use this product\'s bricks.'), '');
        html += '</div>';

        html += '<div class="ov-section-title">How it ships</div><div class="ov-grid">';
        html += overviewPanel('Channels', 'ChannelsTab', channels.length, overviewChipList(channels, channel =>
            overviewChip('#ChannelsTab', '../icons/deployment/' + deploymentIconFile(channel), '../icons/deployment/deployment.png',
                channel.name, channel.groupName + ' · ' + channel.bricks.length + (channel.bricks.length === 1 ? ' brick' : ' bricks'), false),
            'ChannelsTab', 'No deployment channels defined for this product.'), '');
        html += overviewPanel('Bricks', 'BricksTab', bricks.length, overviewChipList(bricks, brick => {
            const others = sharing[brick.brickId] ? sharing[brick.brickId].size : 0;
            const meta = brick.channelRefs.size + (brick.channelRefs.size === 1 ? ' channel' : ' channels') + ' · ' +
                (others ? 'shared with ' + others + (others === 1 ? ' product' : ' products') : 'only this product');
            return overviewChip(getBrickLandingPageHref(brick.brickId), '../../product-bricks/icons/' + brick.brickId + '.png',
                '../../product-bricks/icons/brick.png', brick.brickName, meta, false);
        }, 'BricksTab', 'No bricks are deployed for this product.'), 'Most widely deployed first.');
        html += '</div></div>';
        document.getElementById('tab_content_overview').innerHTML = html;
    }

    renderCustomersTab();
    renderJobsTab();
    renderStreamsTab();
    renderOverviewTab();

    addHeader();
    addTabLabels();
    addChannels();
    addBricks();
    document.getElementById('Dependencies').innerHTML = '<div class="home-stage"><div class="home-stage-title">Dependencies</div><div class="home-stage-subtitle">Open this tab to render the Mermaid dependency diagram.</div></div>';

</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Real Estate ERP Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Products"
    },
    {
      "label": "Real Estate ERP Core"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
