<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

<script>
    function resolveHashTabName() {
        if (window.location.hash) {
            const hash = window.location.hash.substring(1);
            if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
                return hash;
            }
        }

        return '';
    }

    function resolveFallbackTabName(tabName) {
        if (tabName && document.getElementById('tab_' + tabName) && document.getElementById('tab_content_' + tabName)) {
            return tabName;
        }

        const firstTab = document.querySelector('.tablinks[id^="tab_"]');
        if (firstTab) {
            return firstTab.id.substring(4);
        }

        return '';
    }

    function initTab(tabName) {
        setupTabAccessibility();
        const resolvedTabName = resolveHashTabName() || resolveFallbackTabName(tabName);
        openTab(resolvedTabName, { updateHistory: false });
    }

    // WAI-ARIA tab pattern: roles, aria-selected, and arrow-key navigation.
    // Applied once; safe to call repeatedly.
    function setupTabAccessibility() {
        document.querySelectorAll('.tab').forEach(bar => {
            if (bar.dataset.a11yReady) return;
            bar.dataset.a11yReady = '1';
            bar.setAttribute('role', 'tablist');
            const buttons = Array.from(bar.querySelectorAll('.tablinks'));
            buttons.forEach(btn => {
                btn.setAttribute('role', 'tab');
                const name = btn.id && btn.id.startsWith('tab_') ? btn.id.substring(4) : '';
                if (name && document.getElementById('tab_content_' + name)) {
                    btn.setAttribute('aria-controls', 'tab_content_' + name);
                    const panel = document.getElementById('tab_content_' + name);
                    panel.setAttribute('role', 'tabpanel');
                }
            });
            bar.addEventListener('keydown', event => {
                if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
                const current = buttons.indexOf(document.activeElement);
                if (current === -1) return;
                event.preventDefault();
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const next = buttons[(current + offset + buttons.length) % buttons.length];
                next.focus();
                next.click();
            });
        });
    }

    function openTab(tabName, options) {
        const resolvedTabName = resolveFallbackTabName(tabName);
        if (!resolvedTabName) {
            return '';
        }

        const tabcontent = document.getElementsByClassName('tabcontent');
        for (let i = 0; i < tabcontent.length; i++) {
            tabcontent[i].style.display = 'none';
        }
        const tablinks = document.getElementsByClassName('tablinks');
        for (let i = 0; i < tablinks.length; i++) {
            tablinks[i].className = tablinks[i].className.replace(' active', '');
            tablinks[i].setAttribute('aria-selected', 'false');
        }

        const shouldUpdateHistory = !options || options.updateHistory !== false;
        if (shouldUpdateHistory && window.location.hash !== '#' + resolvedTabName) {
            history.pushState({}, '', '#' + resolvedTabName);
        }

        document.getElementById('tab_content_' + resolvedTabName).style.display = 'block';
        const activeTab = document.getElementById('tab_' + resolvedTabName);
        activeTab.className += ' active';
        activeTab.setAttribute('aria-selected', 'true');
        // Overview pages name the open tab in their title, as the start page's sidebar does.
        const heroTitle = document.querySelector('[data-follows-tab]');
        if (heroTitle) {
            if (!heroTitle.dataset.defaultTitle) heroTitle.dataset.defaultTitle = heroTitle.textContent;
            heroTitle.textContent = activeTab.dataset.tabTitle || heroTitle.dataset.defaultTitle;
        }
        // A tab may describe itself; otherwise the page's own subtitle stays.
        const heroSubtitle = document.querySelector('[data-follows-tab-subtitle]');
        if (heroSubtitle) {
            if (!heroSubtitle.dataset.defaultSubtitle) heroSubtitle.dataset.defaultSubtitle = heroSubtitle.textContent.trim();
            heroSubtitle.textContent = activeTab.dataset.tabSubtitle || heroSubtitle.dataset.defaultSubtitle;
        }
        if (typeof window.afterOpenTab === 'function') {
            window.afterOpenTab(resolvedTabName);
        }

        return resolvedTabName;
    }

    // In-page links to another tab (e.g. the top bar's Insights link on the
    // Customers page) only change the hash; switch to that tab.
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.substring(1);
        if (hash && document.getElementById('tab_' + hash) && document.getElementById('tab_content_' + hash)) {
            openTab(hash, {updateHistory: false});
        }
    });
</script>

ollows up patient invoices on behalf of the practice. These services are quoted per project or per practice, as HCI publishes no list prices.", "primaryCustomers": [{"id": "impl", "name": "Implementation and Support Consultant", "icon": "customer-impl-portrait.jpg"}, {"id": "fyth", "name": "Physiotherapy Practice Owner", "icon": "customer-fyth-portrait.jpg"}]}];

ci-crs", "description": "Work queue for CRS return messages and municipal rejections handled by the billing-service desk."}]}, {"brickId": "decl", "brickName": "Declaration Engine (GDS801 and Zorgprestatiemodel)", "deploymentRole": "Declaration correction and resubmission tooling deployed to the internal operations back office.", "usedInProducts": [{"productId": "spotonmedics", "description": "Declaration correction runs for SpotOnMedics practices on the billing service."}, {"productId": "implementation-and-billing-services", "description": "Correction and resubmission tooling with which the billing-service desk fixes rejected lines for practices."}]}, {"brickId": "vcgw", "brickName": "Vecozo Gateway and Insurance Eligibility", "deploymentRole": "Return-message monitoring per practice deployed to the internal operations back office.", "usedInProducts": [{"productId": "implementation-and-billing-services", "description": "Return-message monitoring per practice for the billing-service desk."}]}, {"brickId": "pinv", "brickName": "Patient Invoicing and Payments", "deploymentRole": "Patient invoice reminder and follow-up tooling deployed to the internal operations back office.", "usedInProducts": [{"productId": "spotonmedics", "description": "Patient invoice reminders and follow-up handled by the billing service for SpotOnMedics practices."}, {"productId": "hci-one", "description": "Patient invoice reminders and follow-up handled by the billing service for HCI One practices."}]}, {"brickId": "zpmc", "brickName": "Zorgprestatiemodel Registration and Compliance", "deploymentRole": "Zorgprestatiemodel rejection analysis deployed to the internal operations back office.", "usedInProducts": [{"productId": "hci-crs", "description": "Rejection analysis against the zorgprestatiemodel rule set for the billing-service desk."}, {"productId": "implementation-and-billing-services", "description": "Compliance rules the billing service applies when it corrects zorgprestatiemodel rejections for CRS customers."}]}, {"brickId": "bidb", "brickName": "Practice BI Dashboards and Reporting", "deploymentRole": "Billing-service revenue and settlement reporting deployed to the internal operations back office.", "usedInProducts": [{"productId": "spotonmedics", "description": "Revenue and settlement reports per SpotOnMedics practice that uses the billing service."}, {"productId": "hci-crs", "description": "Rejection, settlement and outstanding-claim reporting for CRS customers whose return messages the billing service works."}]}]}]}]};
    const productStreams = [{"id": "schedule-appointments-and-online-booking", "name": "Schedule Appointments and Online Booking", "icon": "schedule-appointments-and-online-booking.png", "group": "Paramedical Practice Journeys", "description": "Take a paramedical practice from a referral, a phone call or a patient request to a booked and confirmed slot in the agenda that FysioRoadmap calls the central heart of the practice. The stream covers the multi-therapist, multi-location agenda, 24/7 online booking from the practice website and the Uw Zorg Online app synchronised with that agenda, waiting-list handling, reminders that cut no-shows, group lessons and subscriptions in SpotOnMedics style, and the mobile agenda in the Zorgverlener App. Because invoices and declarations are generated from the agenda, every booking must already carry the patient, the therapist, the location and the treatment code that the declaration later needs.", "outcomes": ["A patient who finds the practice on the website or in the app books a first appointment without a phone call, and the slot appears in the therapist's agenda with the right treatment code", "Therapists across locations see one agenda on desktop and mobile and no longer double-book rooms, equipment or group lessons", "Reminders and the waiting list keep the agenda full, so cancellations are refilled and no-shows fall", "Every agenda entry is complete enough to generate the invoice or GDS801 declaration without later correction"], "bricksUsed": ["agnd", "obok", "grpm", "dosr", "iden"]}, {"id": "keep-the-electronic-patient-record", "name": "Keep the Electronic Patient Record", "icon": "keep-the-electronic-patient-record.png", "group": "Paramedical Practice Journeys", "description": "Take a treatment episode from intake to a closed dossier that passes an insurer audit and a KNGF, NVLF or NVD guideline check with as little typing as possible. The stream covers discipline-specific care pathways and guideline templates, the clinical reasoning and treatment plan, session notes with voice-to-text and AI summaries, documents and correspondence, measurement moments in the pathway, and the dossier audit rules that check completeness before the episode is declared or closed. It exists because physiotherapists report about a full working day per week on administration and because the dossier is the evidence behind every declaration, every quality-register delivery and every report to a referrer.", "outcomes": ["A therapist documents the intake, the treatment plan and every session inside the consult time, with voice-to-text and templates instead of free typing", "Every episode follows the care pathway of its discipline and guideline, so audit rules find nothing missing when the episode is declared or closed", "Correspondence with the referrer and the patient is generated from the dossier instead of written twice", "Records are complete, traceable and retained under the AVG and the WGBO retention duty"], "bricksUsed": ["dosr", "clin", "vtxt", "meas", "zdom", "agnd", "decl"]}, {"id": "measure-outcomes-with-proms-and-rom", "name": "Measure Outcomes with PROMs and ROM", "icon": "measure-outcomes-with-proms-and-rom.png", "group": "Paramedical Practice Journeys", "description": "Take a practice or GGZ provider from the choice of a measurement instrument to outcome dashboards and to the quality registers that contracts require. The stream covers PROMs and clinical measurement instruments inside the paramedical treatment, routine outcome monitoring (ROM) for GGZ with questionnaires orchestrated at intake, interim and end, the Embloom library that supplies the questionnaires, benchmarks across therapists and practices, and the monthly pseudonymised delivery to the Landelijke Database Fysiotherapie (LDF), the Keurmerk practice register and other registers under opt-in patient consent. Outcome data is a contract condition for many insurers and the basis for the practice's own quality conversation, so the stream has to make measuring almost free of effort.", "outcomes": ["Patients receive the right questionnaire at the right moment in the app and the score lands in the episode without retyping", "Therapists and GGZ practitioners see score trends per patient and per caseload and use them in the treatment conversation", "The monthly LDF and Keurmerk delivery is complete, pseudonymised and covered by recorded opt-in consent", "Practices can compare their outcomes with the benchmark and answer insurer quality questions from the dashboard"], "bricksUsed": ["meas", "qdat", "dosr", "bidb"]}, {"id": "declare-and-get-paid", "name": "Declare and Get Paid", "icon": "declare-and-get-paid.png", "group": "Paramedical Practice Journeys", "description": "Take a registered treatment to money on the practice's bank account. The stream covers the insurance eligibility check (COV) through Vecozo before treatment starts, the generation of GDS801 paramedical declarations from the agenda and dossier (GDS801 replaced PM304 on 1 January 2025), zorgprestatiemodel claims for GGZ practices, submission through the Vecozo declaration portal, the handling of return messages with rejection reasons, patient invoices for non-reimbursed care with Mollie payments, the outsourced billing service that handles return messages for practices that prefer not to, and the export to accounting packages such as Twinfield. HCI processed more than 500 million euro in annual declarations at the time of the 2022 investment, so a rejection spike after a standard change is felt immediately in practice cash flow.", "outcomes": ["Declarations are generated from the agenda and dossier without re-registration and submitted to Vecozo in the current GDS801 or zorgprestatiemodel format", "Return messages are resolved within the practice or by the billing service before the next batch, so first-time-right rates stay high after standard changes", "Patients pay non-reimbursed care and no-show fees online without the practice chasing paper invoices", "Every paid claim and invoice is exported to the accounting package with the right ledger allocation"], "bricksUsed": ["decl", "vcgw", "pinv", "agnd", "dosr", "bidb"]}, {"id": "run-the-practice-with-management-insight", "name": "Run the Practice with Management Insight", "icon": "run-the-practice-with-management-insight.png", "group": "Paramedical Practice Journeys", "description": "Take a practice owner or an institution's management from the registrations in the agenda, the dossier and the declarations to decisions: production per therapist and location, revenue per insurer and financier, treatment duration and number of sessions per diagnosis, referrers and their volume, waiting times against the Treeknorm, no-shows, outcome and response rates, and contract monitoring against insurer and municipal ceilings. SpotOnMedics-style BI tooling and CRS reporting exist because practices are contracted on quality and administrative conditions and because owners must see the effect of tariffs, session limits and productivity on a business with low reimbursement rates.", "outcomes": ["The owner sees production, revenue, waiting times and no-shows per therapist and location without exporting to a spreadsheet", "Insurer and municipal contract ceilings and conditions are monitored during the year, not discovered at year end", "Referrer and outcome views support the practice's quality conversation with insurers and the Keurmerk", "Institution management gets registration compliance and throughput reporting across teams"], "bricksUsed": ["bidb", "qdat", "decl", "agnd", "dosr"]}, {"id": "coordinate-ggz-treatment-and-medication", "name": "Coordinate GGZ Treatment and Medication", "icon": "coordinate-ggz-treatment-and-medication.png", "group": "Mental Health Care Journeys", "description": "Take a GGZ client from intake and diagnosis to a multidisciplinary treatment plan that is delivered, evaluated and registered correctly in HCI CRS. The stream covers intake and care-demand typing under the zorgprestatiemodel, the treatment plan with goals and the involved professionals, settings and consults, medication management by the psychiatrist or nurse specialist, group treatment, the coordinating practitioner role, and for youth care and WMO the municipal assignment and the iJw/iWmo message exchange with the municipality. It serves both the independent practitioner with a small practice and the institution with hundreds of professionals, in a market where waiting times exceed the 14-week Treeknorm in every region.", "outcomes": ["A client moves from waiting list to intake to a treatment plan with a coordinating practitioner and every involved professional on one plan", "Consults, settings and professionals are registered as care is delivered, so zorgprestatiemodel and municipal declarations are first time right", "Medication is prescribed, reviewed and visible to the client and the pharmacy from the same dossier", "Youth care and WMO trajectories run on a valid municipal assignment with iJw/iWmo messages exchanged on time"], "bricksUsed": ["dosr", "zdom", "vtxt"]}, {"id": "deliver-blended-and-e-health-care", "name": "Deliver Blended and E-health Care", "icon": "deliver-blended-and-e-health-care.png", "group": "Mental Health Care Journeys", "description": "Take a treatment plan and turn it into a blended programme in which sessions in the practice are combined with e-health between sessions. The stream covers the Embloom library of questionnaires and interventions integrated in the EPD, the blended care programme builder that assigns modules and home tasks per client, exercise programmes from partners such as Physitrack for paramedical patients, the Emogy app for behavioural support, video consultation and NICE Connect remote trajectories that have followed patients after discharge since 2014 with Amsterdam UMC, and the monitoring of home tasks by the practitioner. Blended care is how practices and institutions treat more clients with the same professionals and how waiting-list clients receive something before treatment starts.", "outcomes": ["Every client with a treatment plan can receive modules, exercises and questionnaires between sessions from the same dossier", "Practitioners see who did what at home and adjust the programme in the next session instead of guessing", "Video consultation and remote trajectories replace travel for follow-up without losing the clinical record", "Waiting-list clients start with e-health so that the wait is used"], "bricksUsed": ["exrc", "dosr"]}, {"id": "engage-patients-through-portal-and-app", "name": "Engage Patients through Portal and App", "icon": "engage-patients-through-portal-and-app.png", "group": "Patient and Care Network Journeys", "description": "Take a patient from an invitation to an active user of the Uw Zorg Online app or the CRS client portal who arranges things digitally instead of by phone. The stream covers activation with DigiD or a practice-issued invitation, e-consult with the GP, pharmacy, therapist or GGZ team, appointment self-service in the practice agenda, repeat prescriptions and the medication overview from the pharmacy system, access to records, treatment plans and correspondence, digital triage such as 'Moet ik naar de dokter?' before contacting the practice, and notifications. Uw Zorg Online connects to the GP and pharmacy information systems (Sanday, HealthConnected, Pharmapartners, CGM) and serves 3 million+ app users, so activation and daily use drive both patient convenience and the reduction of phone calls that practices pay for.", "outcomes": ["A patient invited by a GP practice, pharmacy, therapist or GGZ institution activates the app and finds all their care providers in one place", "Routine questions, appointments and repeat prescriptions move from the phone to the app, which the practice sees in fewer calls", "Patients read their record, treatment plan and correspondence and receive notifications when something new arrives", "Digital triage sends patients to the right route before they contact the practice"], "bricksUsed": ["agnd", "iden"]}, {"id": "manage-personal-health-data-and-sharing", "name": "Manage Personal Health Data and Sharing", "icon": "manage-personal-health-data-and-sharing.png", "group": "Patient and Care Network Journeys", "description": "Take a citizen from a MedMij consent to a personal health environment (PGO) in Quli or Uw Zorg Online in which health data from the GP, the hospital, the pharmacy and the GGZ institution is retrieved under the MedMij framework, self-measurements and diaries are added, and the person decides who sees what: a partner, a parent, an informal carer or a care professional in the network. Quli carries the MedMij label, offers a GGZ app guide with 50+ apps and single login for e-health, and is used for intensive-care aftercare and by GGZ organisations; HCI won a MedMij PGO tender for Uw Zorg Online. The stream covers consent and data retrieval through DVZA services, self-measurement, granular sharing, network care and the audit trail that makes sharing accountable.", "outcomes": ["A citizen retrieves their own data from connected care providers into one environment under MedMij consent, without asking for printouts", "Self-measurements and diaries sit next to professional data and can be shared with the treating professional", "Family members and informal carers see exactly what the person allowed, no more, and the person can withdraw it at any time", "Care professionals in the network work with the person's environment instead of separate portals"], "bricksUsed": ["iden", "dosr"]}, {"id": "refer-and-exchange-with-the-care-network", "name": "Refer and Exchange with the Care Network", "icon": "refer-and-exchange-with-the-care-network.png", "group": "Patient and Care Network Journeys", "description": "Close the loop between the practice and the rest of the care network: a referral from the GP or specialist through ZorgDomein, secure messaging and reports through ZorgMail, connectors to the GP and pharmacy information systems, hospital information system links for paraNICE in rehabilitation departments, and the report back to the referrer at intake and at the end of treatment. Wegiz (in force April 2023) mandates digital data exchange, and the zorgprestatiemodel and GDS801 declarations depend on referral data, so the exchange is both a care quality and a cash-flow matter.", "outcomes": ["Referrals arrive digitally with referrer, referral date and reason, ready for the dossier and the declaration", "Reports to the referrer are generated from the dossier and delivered securely, so GPs know what happened to their patients", "Paramedical departments in hospitals work in paraNICE while the hospital information system stays the source of patient identity and orders", "Every exchange is traceable and compliant with Wegiz and NEN 7510"], "bricksUsed": ["zdom", "dosr", "agnd", "decl"]}, {"id": "publish-and-run-a-practice-website", "name": "Publish and Run a Practice Website", "icon": "publish-and-run-a-practice-website.png", "group": "Patient and Care Network Journeys", "description": "Take a practice from a template to a findable, accessible website that acts as the digital front door: practice websites from the Praktijkinfo portfolio under Uw Zorg Online for GP practices, pharmacies and paramedical practices, with online booking, e-consult, repeat prescription and triage entry points that connect to the practice's agenda and app, content management by practice staff, hosting, security and accessibility. The website is where most patients first meet the practice and where the shift from phone to app starts.", "outcomes": ["A practice publishes a website from a template in days with its team, locations, opening hours and services", "Booking, e-consult, repeat prescription and triage entry points on the website lead directly into the app and the practice agenda", "Practice staff maintain content themselves and l pay themselves, so there is no dispute at invoice time.", "howItSupports": "Performs the Vecozo COV eligibility check and holds the insurer contracts and tariffs that determine what can be declared for this patient. Authenticates the therapist with UZI or DigiD-based credentials and logs the BSN lookup as required under NEN 7510."}, {"step": "Register the treatment from the agenda so the claim writes itself", "description": "Confirm the appointment as treated, let the system derive the CSI code, treatment code and diagnosis code from the episode, and close the day without a separate declaration screen. Handle the exceptions: a no-show that may not be declared to the insurer, a long session that counts as one treatment, a patient who switched insurer on 1 January, a treatment on a public holiday.", "howItSupports": "Holds the episode with diagnosis code, referral and treatment plan from which the treatment registration derives its codes. Turns confirmed agenda items into declaration lines without retyping, applying the GDS801 rules and the insurer contract."}, {"step": "Submit GDS801 declarations through Vecozo and handle return messages", "description": "Batch the declarations per insurer, submit them through Vecozo, and process the return messages: fully accepted, partially rejected with a reason code, or rejected because the policy ended, the referral is missing or the treatment count exceeded the policy maximum. Correct and resubmit, or hand the whole cycle to HCI's billing services that process the return messages for the practice.", "howItSupports": "Submits GDS801 batches through the Vecozo gateway, matches return messages to claims and drives correction or the outsourced billing service. Shows rejection reasons per insurer and per therapist so recurring causes are fixed at the source instead of corrected every month."}, {"step": "Invoice the patient for the uninsured remainder and collect the money", "description": "Invoice the sessions beyond the policy ma he Uw Zorg Online app at any hour, with the right slot lengths per treatment type and per therapist. Decide which slots are open for online booking and which are held for GP referrals.", "howItSupports": "Hosts the practice website with the online booking, e-consult and triage entry points that feed the agenda. Exposes bookable slots per therapist and location and writes online bookings straight into the agenda."}, {"step": "Cut no-shows with reminders and self-service rescheduling", "description": "Send SMS, e-mail and app reminders, let patients reschedule and cancel themselves within the practice's rules, fill freed slots from the waiting list, and apply the no-show fee consistently.", "howItSupports": "Sends reminders, handles self-service rescheduling within the rules and refills slots from the waiting list. Gives patients appointment self-service and notifications in the app so they do not need to call."}, {"step": "Give a home programme the patient actually does", "description": "Prescribe an exercise programme from Physitrack or another integrated exercise partner directly from the dossier, with videos in the patient's app, and see adherence and pain scores come back before the next session so the plan is adjusted and the patient does not drop out.", "howItSupports": "Links exercise programmes from Physitrack and other partners to the episode and monitors home task completion. Shows the programme, reminders and progress to the patient in Uw Zorg Online."}, {"step": "Run group lessons, programmes and subscriptions", "description": "Set up group lessons for COPD, oncology rehabilitation, falls prevention or medical fitness, manage capacity, attendance and the subscription or programme fee, and make sure group contacts are declared or invoiced correctly.", "howItSupports": "Manages group lessons, programmes and subscriptions with capacity, attendance and self-enrolment. Declares group treatments to insurers where allowed and invoices subscriptions and programme     // Derive this product's deployed bricks and the channels they ship to from
    // deployment.json (deployedBricks[].usedInProducts). products.json no longer carries
    // brick/channel links.
    function buildProductDeployment() {
        const channelMeta = {};   // ref -> {ref, groupId, groupName, channelName, channelType, ...}
        const bricks = {};        // brickId -> {brickId, brickName, description, channelRefs:Set}
        (deployment.channels || []).forEach(group => {
            (group.channels || []).forEach(channel => {
                const ref = (group.groupId || '') + '/' + (channel.subChannelId || '');
                (channel.deployedBricks || []).forEach(deployed => {
                    const use = (deployed.usedInProducts || []).find(item => item.productId === product.id);
                    if (!use) {
                        return;
                    }
                    if (!channelMeta[ref]) {
                        channelMeta[ref] = {
                            ref: ref,
                            groupId: group.groupId || '',
                            groupName: group.groupName || prettifyChannelGroup(group.groupId || 'other'),
                            groupDescription: group.description || '',
                            name: channel.subChannelName || channel.subChannelId || ref,
                            channelId: channel.subChannelId || '',
                            channelType: channel.channelType || '',
                            description: channel.description || '',
                            bricks: []
                        };
                    }
                    if (!bricks[deployed.brickId]) {
                        bricks[deployed.brickId] = {
                            brickId: deployed.brickId,
                            brickName: deployed.brickName || deployed.brickId,
                            description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name),
                            channelRefs: new Set()
                        };
                    }
                    bricks[deployed.brickId].channelRefs.add(ref);
                    channelMeta[ref].bricks.push({
                        brickId: deployed.brickId,
                        brickName: deployed.brickName || deployed.brickId,
                        deploymentRole: deployed.deploymentRole || '',
                        description: meaningfulUsageNote(use.description, deployed.brickName || deployed.brickId, product.name)
                    });
                });
            });
        });
        return {channelMeta: channelMeta, bricks: Object.values(bricks)};
    }

    // A usage note that only says "<brick> in <product>" repeats the names around it; drop it.
    function meaningfulUsageNote(note, brickName, productName) {
        const normalize = value => String(value || '').toLowerCase().replace(/[.\s]+$/, '').replace(/\s+/g, ' ').trim();
        const text = normalize(note);
        if (!text) return '';
        return text === normalize((brickName || '') + ' in ' + (productName || '')) ? '' : note;
    }

    let productDeploymentCache = null;
    function productDeployment() {
        if (!productDeploymentCache) {
            productDeploymentCache = buildProductDeployment();
        }
        return productDeploymentCache;
    }

        }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#39;');
    }

    function channelColor(ref) {
        const palette = ['#1d4ed8', '#b45309', '#047857', '#7c3aed', '#be123c', '#0f766e', '#c2410c', '#4338ca', '#15803d', '#a21caf'];
        const value = ref || 'channel';
        let hash = 0;
        for (let i = 0; i < value.length; i++) {
            hash = ((hash << 5) - hash) + value.charCodeAt(i);
            hash |= 0;
        }
        return palette[Math.abs(hash) % palette.length];
    }

    function deploymentIconFile(channel) {
        const text = [
            channel && channel.ref,
            channel && channel.groupId,
            channel && channel.name
        ].join(' ').toLowerCase();

        if (text.includes('ios')) {
            return 'app_store_ios.png';
        }
        if (text.includes('android') || text.includes('play store') || text.includes('play-store')) {
            return 'app_store_android.png';
        }
        if (text.includes('private cloud') || text.includes('private-cloud')) {
            return 'private_cloud.png';
        }
        if (text.includes('cloud') || text.includes('runtime') || text.includes('edge') || text.includes('cdn')) {
            return 'public_cloud.png';
        }
        if (text.includes('saas') || text.includes('analytics') || text.includes('crm') || text.includes('datadog') || text.includes('snowflake') || text.includes('databricks') || text.includes('salesforce')) {
            return 'saas.png';
        }
        return 'deployment.png';
    }

    function renderDeploymentIcon(channel) {
        const fileName = deploymentIconFile(channel);
        const label = escapeHtml((channel && channel.name) || 'Deployment channel');
        return '<img class="channel-pill-icon" src="../icons/deployment/' + fileName + '" alt="' + label + '" title="' + label + '" onerror="this.onerror=null;this.src=\'../icons/deployment/deployment.png\'">';

    function getDeploymentChannelGroups() {
        const grouped = {};
        Object.values(productDeployment().channelMeta).forEach(channel => {
            const groupId = channel.groupId || 'other';
            if (!grouped[groupId]) {
                grouped[groupId] = {
                    id: groupId,
                    name: channel.groupName || prettifyChannelGroup(groupId),
                    description: channel.groupDescription || '',
                    channels: []
                };
            }
            grouped[groupId].channels.push({
                ref: channel.ref,
                groupId: groupId,
                name: channel.name,
                channelId: channel.channelId,
                channelType: channel.channelType,
                deploymentPart: channel.channelType || '',
                deploymentUnit: channel.description || '',
                pipeline: '',
                environmentName: channel.environmentName,
                environmentRef: '',
                bricks: channel.bricks.slice().sort((a, b) => (a.brickName || a.brickId).localeCompare(b.brickName || b.brickId))
            });
        });
        return Object.values(grouped).map(group => ({

            channels: group.channels.sort((a, b) => a.name.localeCompare(b.name))

    function hexToRgba(hex, alpha) {
        const value = (hex || '#6b7280').replace('#', '');
        const normalized = value.length === 3
            ? value.split('').map(part => part + part).join('')
            : value;
        const intValue = parseInt(normalized, 16);
        const r = (intValue >> 16) & 255;
        const g = (intValue >> 8) & 255;
        const b = intValue & 255;
        return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
    }

    function formatDate(dateValue) {
        if (!dateValue) return 'No date';
        const date = new Date(dateValue + 'T00:00:00');

    }

    function slugify(value) {
        return (value || 'item')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '')
            || 'item';
    }

    function escapeMermaidLabel(value) {
        return (value || '')
            .replaceAll('&', 'and')
            .replaceAll('"', '')
            .replaceAll("'", '')
            .replaceAll('<', '')
            .replaceAll('>', '')
            .replaceAll('[', '(')
            .replaceAll(']', ')')
            .replaceAll('{', '(')
            .replaceAll('}', ')')
            .replaceAll('\n', ' ');
    }

    function mermaidNodeId(prefix, value) {
        return prefix + '_' + slugify(value).replace(/-/g, '_');
    }

    function buildDependencyModel() {
        const channels = {};
        const bricks = {};

        const derived = productDeployment();
        derived.bricks.forEach(brick => {
            bricks[brick.brickId] = {
                id: brick.brickId,
                name: brick.brickName || brick.brickId,
                whyNeeded: brick.description || '',
                channelRefs: Array.from(brick.channelRefs)
            };
        });
        Object.values(derived.channelMeta).forEach(channel => {
            channels[channel.ref] = {
                id: channel.ref,
                name: channel.name || channel.ref,
                channelId: channel.channelId || '',
                part: channel.channelType || '',
                environmentName: channel.environmentName || '',
                deploymentUnit: channel.description || '',
                pipeline: ''
            };
        });

        return {
            channels: Object.values(channels).sort((a, b) => a.name.localeCompare(b.name)),
            bricks: Object.values(bricks).sort((a, b) => a.name.localeCompare(b.name))
        };
    }

    function ensureDependencyState() {
        if (dependencyState.initialized) {
            return;
        }
        const model = buildDependencyModel();
        model.channels.forEach(item => {
            dependencyState.channels[item.id] = true;
        });
        model.bricks.forEach(item => {
            dependencyState.bricks[item.id] = true;
        });
        dependencyState.initialized = true;
    }

    function setDependencySelection(group, value) {

    function toggleDependencySelection(group, id, value) {

    }

    function buildDependencyGraph(model) {
        const visibleChannels = new Set(model.channels.filter(item => dependencyState.channels[item.id] !== false).map(item => item.id));
        const visibleBricks = new Set(model.bricks.filter(item => dependencyState.bricks[item.id] !== false).map(item => item.id));

        const lines = ['flowchart LR'];
        const channelDefs = [];
        const brickDefs = [];
        const edges = new Set();

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                const labelParts = [item.name];
                if (item.part) {
                    labelParts.push(formatChannelPart(item.part));
                }
                channelDefs.push('    ' + mermaidNodeId('chan', item.id) + '[["' + escapeMermaidLabel(labelParts.join(' | ')) + '"]]');
            }
        });

        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                brickDefs.push('    ' + mermaidNodeId('brick', item.id) + '["' + escapeMermaidLabel(item.name) + '"]');
            }
        });

        model.bricks.forEach(brick => {
            if (!visibleBricks.has(brick.id)) {
                return;
            }
            (brick.channelRefs || []).forEach(channelKey => {
                if (!visibleChannels.has(channelKey)) {
                    return;
                }
                edges.add('    ' + mermaidNodeId('chan', channelKey) + ' --- ' + mermaidNodeId('brick', brick.id));
            });
        });

        if (!channelDefs.length && !brickDefs.length) {
            return '';
        }

        if (channelDefs.length) {
            lines.push('    subgraph Channels');
            channelDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        if (brickDefs.length) {
            lines.push('    subgraph Bricks');
            brickDefs.forEach(line => lines.push(line));
            lines.push('    end');
        }
        Array.from(edges).sort().forEach(line => lines.push(line));

        lines.push('    classDef channel fill:#dbeafe,stroke:#2563eb,color:#1e3a8a');
        lines.push('    classDef brick fill:#d1fae5,stroke:#059669,color:#065f46');

        model.channels.forEach(item => {
            if (visibleChannels.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('chan', item.id) + ' channel');
            }
        });
        model.bricks.forEach(item => {
            if (visibleBricks.has(item.id)) {
                lines.push('    class ' + mermaidNodeId('brick', item.id) + ' brick');
            }
        });

        return lines.join('\n');
    }

    function renderDependencySummary(model) {
        const visibleChannelCount = model.channels.filter(item => dependencyState.channels[item.id] !== false).length;
        const visibleBrickCount = model.bricks.filter(item => dependencyState.bricks[item.id] !== false).length;
        return '<div class="activity-summary">' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleChannelCount + '</div><div class="activity-stat-label">Channels</div></div>' +
            '<div class="activity-stat"><div class="activity-stat-value">' + visibleBrickCount + '</div><div class="activity-stat-label">Bricks</div></div>' +
            '</div>';
    }

    function renderDependenciesTab() {
        ensureDependencyState();
        const container = document.getElementById('Dependencies');
        if (!container) {
            return;
        }

        const model = buildDependencyModel();
        const chart = buildDependencyGraph(model);
        let html = '';
        html += '<div class="home-stage">';
        html += '<div class="home-stage-title">Dependencies</div>';
        html += '<div class="home-stage-subtitle">Channel-to-brick dependencies come from the deployed bricks used in this product</div>';
        html += renderDependencySummary(model);
        html += renderDependencyControls(model);

        if (!chart) {
            html += '<div class="dependency-empty">Select at least one channel or brick to render the dependency diagram.</div>';
        } else {
            html += '<div class="dependency-legend"><div class="dependency-control-title">Legend</div><div class="dependency-legend-items">';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#dbeafe; border-color:#2563eb;"></span>Channel</span>';
            html += '<span class="dependency-legend-item"><span class="dependency-legend-swatch" style="background:#d1fae5; border-color:#059669;"></span>Brick</span>';
            html += '</div></div>';
            html += '<div class="dependency-graph"><div class="mermaid">' + chart + '</div></div>';
        }
        html += '</div>';
        container.innerHTML = html;

        if (chart) {
            mermaid.run({querySelector: '#Dependencies .mermaid'}).catch(error => {
                console.error('Failed to render product dependency diagram', error);
            });
        }
    }

                if (job.jobOutcome) card += '<div class="pl-card-copy">' + escapeHtml(job.jobOutcome) + '</div>';
                card += '<div class="pl-card-label">Steps it helps with</div><ul class="pl-list">' + job.steps.map(step =>
                    '<li><strong>' + escapeHtml(step.step) + '</strong>' + (step.howItSupports ? ' — ' + escapeHtml(step.howItSupports) : '') + '</li>').join('') + '</ul>';
                return card + '</div>';
            }).join('') + '</div>';
        }
        document.getElementById('tab_content_jobs').innerHTML = html + '</div>';
    }

    function renderStreamsTab() {
        let html = '<div class="pl-section"><div class="pl-section-title">Streams this product takes part in</div>';
        html += '<div class="pl-section-note">Streams composed of at least one brick this product deploys.</div>';
        if (!productStreams.length) {
            html += '<div class="activity-muted">No streams use this product\'s bricks.</div>';
        } else {
            html += '<div class="pl-cards">' + productStreams.map(stream => {
                let card = '<a class="pl-card" target="_blank" rel="noopener noreferrer" href="../../product-bricks/stream_pages/' + escapeHtml(stream.id) + '.html">';
                card += '<div class="pl-card-head"><img class="pl-card-icon" src="../../product-bricks/icons/' + escapeHtml(stream.icon || 'stream.png') + '" alt="" onerror="this.onerror=null;this.src=\'../../product-bricks/icons/stream.png\'">';
                card += '<div><div class="pl-card-meta">' + escapeHtml(stream.group || 'Stream') + '</div><div class="pl-card-title">' + escapeHtml(stream.name) + '</div></div></div>';
                if (stream.description) card += '<div class="pl-card-copy pl-clamp">' + escapeHtml(stream.description) + '</div>';
                card += '<div class="pl-card-label">Uses ' + stream.bricksUsed.length + ' of this product\'s bricks</div>';
                card += '<div class="pl-tags">' + stream.bricksUsed.map(id => '<span class="pl-tag">' + escapeHtml(brickNameById(id)) + '</span>').join('') + '</div>';
                return card + '</a>';
            }).join('') + '</div>';
        }
        document.getElementById('tab_content_streams').innerHTML = html + '</div>';
    }

    // ---- Overview: the product at a glance; every detail lives in its own tab. ----
    const OVERVIEW_CHIP_LIMIT = 8;

    function overviewChip(href, icon, fallback, label, meta, external) {
        let chip = '<a class="ov-chip" href="' + escapeHtml(href) + '"' + (external ? ' target="_blank" rel="noopener noreferrer"' : '') + '>';
        if (icon) chip += '<img src="' + escapeHtml(icon) + '" alt="" onerror="this.onerror=null;this.src=\'' + fallback + '\'">';
        chip += '<span class="ov-chip-text"><span class="ov-chip-label">' + escapeHtml(label) + '</span>';
        if (meta) chip += '<span class="ov-chip-meta">' + escapeHtml(meta) + '</span>';
        return chip + '</span></a>';
    }

    function overviewChipList(items, renderItem, tab, emptyText) {
        if (!items.length) return '<div class="ov-empty">' + escapeHtml(emptyText) + '</div>';
        let list = '<div class="ov-chips">' + items.slice(0, OVERVIEW_CHIP_LIMIT).map(renderItem).join('') + '</div>';
        if (items.length > OVERVIEW_CHIP_LIMIT) {
            list += '<button class="ov-more" onclick="openTab(\'' + tab + '\')">+' + (items.length - OVERVIEW_CHIP_LIMIT) + ' more</button>';
        }
        return list;
    }

    function overviewPanel(title, tab, count, body, note) {
        let panel = '<section class="ov-panel"><div class="ov-panel-head"><div class="ov-panel-title">' + escapeHtml(title) +
            (count !== null ? ' <span class="ov-panel-count">' + count + '</span>' : '') + '</div>';
        if (tab) panel += '<button class="ov-panel-link" onclick="openTab(\'' + tab + '\')">Details &rarr;</button>';
        panel += '</div>';
        if (note) panel += '<div class="ov-panel-note">' + escapeHtml(note) + '</div>';
        return panel + body + '</section>';
    }

    // How many other products deploy each of this product's bricks.
    function brickSharing() {
        const others = {};
        (deployment.channels || []).forEach(group => (group.channels || []).forEach(channel => (channel.deployedBricks || []).forEach(deployed => {
            (deployed.usedInProducts || []).forEach(use => {
                if (use.productId === product.id) return;
                (others[deployed.brickId] = others[deployed.brickId] || new Set()).add(use.productId);
            });
        })));
        return others;
    }

    function renderOverviewTab() {
        const groups = getDeploymentChannelGroups();
        const channels = groups.flatMap(group => group.channels.map(channel => ({...channel, groupName: group.name})));
        const bricks = productDeployment().bricks.slice().sort((a, b) => b.channelRefs.size - a.channelRefs.size || a.brickName.localeCompare(b.brickName));
        const sharing = brickSharing();
        const shared = bricks.filter(brick => sharing[brick.brickId] && sharing[brick.brickId].size).length;

        const tiles = [
            ['Customers', productCustomers.length, 'customers'],
            ['Customer jobs', productJobs.length, 'jobs'],
            ['Streams', productStreams.length, 'streams'],
            ['Channels', channels.length, 'ChannelsTab'],
            ['Bricks', bricks.length, 'BricksTab'],
            ['Shared bricks', shared, 'BricksTab'],
            ['Own bricks', bricks.length - shared, 'BricksTab'],
        ];
        let html = '<div class="ov">';
        if (product.type) html += '<div class="ov-facts"><span class="ov-fact">' + escapeHtml(product.type) + '</span></div>';
        html += '<div class="ov-tiles">' + tiles.map(([label, value, tab]) =>
            '<button class="ov-tile' + (value ? '' : ' zero') + '" onclick="openTab(\'' + tab + '\')"><span class="ov-tile-value">' + value +
            '</span><span class="ov-tile-label">' + escapeHtml(label) + '</span></button>').join('') + '</div>';

        html += '<div class="ov-section-title">Who it is for</div><div class="ov-grid">';
        html += overviewPanel('Customers', 'customers', productCustomers.length, overviewChipList(productCustomers, customer =>
            overviewChip('../../customers/landing_pages/' + customer.id + '.html', CUSTOMER_ICONS + (customer.icon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                customer.name, customer.group, true), 'customers', 'No primary customers are listed.'), '');
        html += overviewPanel('Customer jobs', 'jobs', productJobs.length, overviewChipList(productJobs, job =>
            overviewChip('#jobs', CUSTOMER_ICONS + (job.customerIcon || 'customer.png'), CUSTOMER_ICONS + 'customer.png',
                job.jobName, job.customerName + ' · ' + job.steps.length + (job.steps.length === 1 ? ' step' : ' steps'), false),
            'jobs', 'No customer job steps reference this product.'), '');
        html += overviewPanel('Streams', 'streams', productStreams.length, overviewChipList(productStreams, stream =>
            overviewChip('../../product-bricks/stream_pages/' + stream.id + '.html', '../../product-bricks/icons/' + (stream.icon || 'stream.png'),
                '../../product-bricks/icons/stream.png', stream.name, stream.bricksUsed.length + ' of its bricks', true), 'streams', 'No streams use this product\'s bricks.'), '');
        html += '</div>';

        html += '<div class="ov-section-title">How it ships</div><div class="ov-grid">';
        html += overviewPanel('Channels', 'ChannelsTab', channels.length, overviewChipList(channels, channel =>
            overviewChip('#ChannelsTab', '../icons/deployment/' + deploymentIconFile(channel), '../icons/deployment/deployment.png',
                channel.name, channel.groupName + ' · ' + channel.bricks.length + (channel.bricks.length === 1 ? ' brick' : ' bricks'), false),
            'ChannelsTab', 'No deployment channels defined for this product.'), '');
        html += overviewPanel('Bricks', 'BricksTab', bricks.length, overviewChipList(bricks, brick => {
            const others = sharing[brick.brickId] ? sharing[brick.brickId].size : 0;
            const meta = brick.channelRefs.size + (brick.channelRefs.size === 1 ? ' channel' : ' channels') + ' · ' +
                (others ? 'shared with ' + others + (others === 1 ? ' product' : ' products') : 'only this product');
            return overviewChip(getBrickLandingPageHref(brick.brickId), '../../product-bricks/icons/' + brick.brickId + '.png',
                '../../product-bricks/icons/brick.png', brick.brickName, meta, false);
        }, 'BricksTab', 'No bricks are deployed for this product.'), 'Most widely deployed first.');
        html += '</div></div>';
        document.getElementById('tab_content_overview').innerHTML = html;
    }

    renderCustomersTab();
    renderJobsTab();
    renderStreamsTab();
    renderOverviewTab();

    addHeader();
    addTabLabels();
    addChannels();
    addBricks();
    document.getElementById('Dependencies').innerHTML = '<div class="home-stage"><div class="home-stage-title">Dependencies</div><div class="home-stage-subtitle">Open this tab to render the Mermaid dependency diagram.</div></div>';

</script>

<script>
    const breadcrumbs_context = {
  "breadcrumbs": [
    {
      "link": "../../start/index.html",
      "label": "Paramedical and Mental Health Practice Platform Home"
    },
    {
      "link": "../index.html",
      "label": "Products"
    },
    {
      "label": "FysioRoadmap Physiotherapy EPD and Agenda"
    }
  ]
}
;
    const divId = "breadcrumbs";

    function renderBreadcrumbs() {
        const container = document.getElementById(divId);
        if (!container) {
            console.log('Breadcrumbs container with id "' + divId + '" not found.');
            return;
        }
        container.innerHTML = '';
        let html = '';
        html += '<div class="breadcrumbs-container">';
        if (breadcrumbs_context && breadcrumbs_context.breadcrumbs && breadcrumbs_context.breadcrumbs.length) {
            breadcrumbs_context.breadcrumbs.forEach((crumb, index) => {
                html += '<div class="breadcrumb">';
                let suffix = index < breadcrumbs_context.breadcrumbs.length - 1 ? '&nbsp;&nbsp;>&nbsp;&nbsp;' : '';
                if (crumb.link) {
                    html += '<a href="' + crumb.link + '">' + crumb.label + '</a>';
                } else {
                    html += '<span>' + crumb.label + '</span>';
                }
                html += '<span>' + suffix + '</span>';
                html += '</div>';
            });
        }
        html += '</div>';

        container.innerHTML = html;
    }

    renderBreadcrumbs();
</script>

</body>
</html>
