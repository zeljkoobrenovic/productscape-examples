<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231d4ed8'/><rect x='18' y='22' width='30' height='24' rx='4' fill='white'/><rect x='52' y='22' width='30' height='24' rx='4' fill='%2393c5fd'/><rect x='18' y='54' width='64' height='24' rx='4' fill='%23dbeafe'/></svg>">
    <title>eMobility</title>
    <style>
    /* Shared design tokens for all generated pages.
       Canonical palette promoted from the evidence-explorer page, plus the
       de-facto grays/blues already used across templates. New CSS should use
       these instead of hex literals; existing literals migrate opportunistically. */
    :root {
        /* surfaces */
        --bg: #f6f8fb;
        --panel: #ffffff;
        --surface: #f8fafc;
        --surface-muted: #eef2f7;
        --surface-fallback: #f8fafc;

        /* text */
        --ink: #1f2430;
        --ink-soft: #5b6472;
        --muted: #6b7280;
        --muted-strong: #8a94a6;

        /* lines and borders */
        --line: #e5e7eb;
        --line-strong: #d1d5db;
        --group-border: #d8e0ea;

        /* accent */
        --accent: #2563eb;
        --accent-ink: #1d4ed8;
        --accent-soft: #eff4ff;
        --accent-line: #c9dbff;
        --highlight-color: #dbeafe;

        /* shape and depth */
        --radius: 14px;
        --radius-sm: 10px;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 6px 18px rgba(16, 24, 40, 0.06);
        --shadow-hover: 0 2px 6px rgba(16, 24, 40, 0.08), 0 14px 30px rgba(16, 24, 40, 0.12);
        --card-shadow: rgba(0, 0, 0, 0.15) 0px 2px 8px;
    }
</style>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Ubuntu">
    <style>
        :root {
            --sidebar-width: 310px;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: Ubuntu, Optima, Segoe, Segoe UI, Candara, Calibri, Arial, sans-serif;
            color: var(--ink);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
            color: inherit;
        }

        .shell {
            display: flex;
            height: 100vh;
        }

        /* ---------- sidebar ---------- */

        .sidebar {
            flex: 0 0 var(--sidebar-width);
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--panel);
            border-right: 1px solid var(--line);
            transition: margin-left 0.18s ease;
        }

        .shell.sidebar-hidden .sidebar {
            margin-left: calc(-1 * var(--sidebar-width));
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 14px 14px 10px;
            border: 0;
            background: none;
            text-align: left;
            cursor: pointer;
        }

        .sidebar-brand img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 3px;
            background: white;
            flex: none;
        }

        .sidebar-brand span {
            font-weight: 700;
            font-size: 15px;
            line-height: 1.25;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .sidebar-brand:hover span {
            color: var(--accent-ink);
        }

        .sidebar-search {
            padding: 2px 12px 8px;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            width: 100%;
            height: 34px;
            padding: 0 54px 0 32px;
            border: 1px solid var(--line-strong);
            border-radius: 8px;
            font: inherit;
            font-size: 14px;
            background: var(--surface);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 10px;
            width: 14px;
            height: 14px;
            color: var(--muted);
        }

        .search-hint {
            position: absolute;
            right: 8px;
            top: 7px;
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--line-strong);
            border-radius: 4px;
            padding: 1px 6px;
            background: white;
        }

        .search-clear {
            position: absolute;
            right: 6px;
            top: 5px;
            border: 0;
            background: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
        }

        .sidebar-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: var(--muted);
            min-height: 18px;
        }

        .link-button {
            border: 0;
            background: none;
            padding: 0 2px;
            color: var(--muted);
            cursor: pointer;
            font-size: 12px;
        }

        .link-button:hover, .link-button:focus-visible {
            color: var(--accent-ink);
            text-decoration: underline;
        }

        .sidebar-tree {
            flex: 1;
            overflow-y: auto;
            padding: 2px 8px 24px;
            border-top: 1px solid var(--line);
        }

        .nav-section {
            margin-top: 6px;
        }

        .nav-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            border: 0;
            background: none;
            cursor: pointer;
            text-align: left;
            border-radius: 7px;
        }

        .nav-toggle:hover {
            background: var(--surface-muted);
        }

        .nav-toggle:focus-visible, .nav-item:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .chevron {
            flex: none;
            width: 10px;
            height: 10px;
            color: var(--muted-strong);
            transition: transform 0.12s ease;
        }

        [aria-expanded="true"] > .chevron {
            transform: rotate(90deg);
        }

        .nav-category {
            margin: 16px 6px 2px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted-strong);
        }

        .nav-category:first-child {
            margin-top: 10px;
        }

        .nav-item.nav-single {
            margin-top: 6px;
            padding: 7px 6px 7px 24px;
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
        }

        .nav-item.nav-single img {
            width: 22px;
            height: 22px;
        }

        .nav-section-header {
            padding: 7px 6px;
            font-weight: 700;
            font-size: 13.5px;
        }

        .nav-section-header img {
            width: 22px;
            height: 22px;
            object-fit: contain;
            flex: none;
        }


        .nav-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .count {
            flex: none;
            font-size: 11px;
            font-weight: 500;
            color: var(--muted);
            background: var(--surface-muted);
            border-radius: 999px;
            padding: 1px 7px;
        }

        .nav-body[hidden] {
            display: none;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 8px 4px 34px;
            border-radius: 7px;
            font-size: 13px;
            color: var(--ink-soft);
            line-height: 1.3;
        }


        .nav-item img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            border-radius: 4px;
            flex: none;
        }

        .nav-item:hover {
            background: var(--accent-soft);
            color: var(--accent-ink);
        }

        .nav-item.active {
            background: var(--highlight-color);
            color: var(--accent-ink);
            font-weight: 500;
        }

        .nav-item.overview {
            color: var(--muted);
        }

        /* A thin rule separates a section's overview pages from its item pages. */
        .nav-item.overview + .nav-item:not(.overview) {
            margin-top: 4px;
            box-shadow: inset 0 1px 0 var(--line);
        }

        .nav-item mark {
            background: #fde68a;
            color: inherit;
            border-radius: 2px;
        }

        .nav-empty {
            padding: 18px 10px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        /* ---------- main ---------- */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            flex: none;
            display: flex;
            align-items: center;
            gap: 8px;
            height: 46px;
            padding: 0 12px;
            background: var(--panel);
            border-bottom: 1px solid var(--line);
        }

        .icon-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 30px;
            min-width: 30px;
            padding: 0 8px;
            border: 1px solid transparent;
            border-radius: 7px;
            background: none;
            color: var(--ink-soft);
            cursor: pointer;
            font-size: 13px;
            white-space: nowrap;
        }

        .icon-button:hover, .icon-button:focus-visible {
            background: var(--surface-muted);
            border-color: var(--line);
            color: var(--accent-ink);
        }

        .icon-button svg {
            width: 16px;
            height: 16px;
        }

        .topbar-title {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: var(--muted);
            overflow: hidden;
            white-space: nowrap;
        }

        .topbar-title strong {
            color: var(--ink);
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .view {
            flex: 1;
            min-height: 0;
            padding-top: 12px;
        }

        .view[hidden] {
            display: none;
        }

        #frameView iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: white;
        }

        #homeView {
            overflow-y: auto;
            padding: 32px 36px 60px;
        }

        .home {
            max-width: 1180px;
            margin: 0 auto;
        }

        .hero {
            display: flex;
            gap: 28px;
            align-items: center;
            margin-bottom: 50px;
        }

        .hero-logo {
            width: 202px;
            height: 202px;
            object-fit: contain;
            flex: none;
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 10px;
            background: white;
        }

        .hero h1 {
            margin: 0 0 8px;
            font-size: 52px;
            font-weight: 500;
            color: var(--ink);
        }

        .domain-description {
            font-size: 16px;
            line-height: 1.55;
            color: var(--ink-soft);
            overflow-wrap: anywhere;
        }

        .domain-description.clamped #domain-description {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .domain-description a {
            color: var(--accent-ink);
            text-decoration: underline;
        }

        .app-tab-title {
            margin: 0 0 12px;
            font-size: 13px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .app-group {
            margin-bottom: 26px;
        }

        .app-group-title {
            margin: 0 0 10px;
            font-size: 16px;
            font-weight: 500;
            color: var(--ink-soft);
            text-transform: capitalize;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 14px;
        }

        .app {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 18px 14px 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            box-shadow: var(--shadow);
            transition: box-shadow 0.15s ease, transform 0.15s ease;
        }

        .app:hover, .app:focus-visible {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
            outline: none;
        }

        .app img {
            width: 84px;
            height: 84px;
            object-fit: contain;
            margin-bottom: 12px;
            filter: grayscale(100%);
            transition: filter 0.15s ease;
        }

        .app:hover img, .app:focus-visible img {
            filter: none;
        }

        .app .name {
            font-weight: 700;
            font-size: 15px;
            color: #5009DC;
        }

        .app .source {
            font-size: 11px;
            color: var(--muted);
            margin-top: 2px;
        }

        .app .description {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.45;
            margin-top: 6px;
        }

        .app-counts {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-top: 10px;
        }

        .app-count {
            font-size: 12px;
            color: var(--accent-ink);
            background: var(--accent-soft);
            border: 1px solid var(--accent-line);
            border-radius: 999px;
            padding: 2px 10px;
        }

        .app-count strong {
            font-weight: 700;
        }

        .backdrop {
            display: none;
        }

        @media (max-width: 900px) {
            .sidebar {
                position: fixed;
                z-index: 20;
                top: 0;
                bottom: 0;
                left: 0;
                max-width: 88vw;
                box-shadow: var(--shadow-hover);
                margin-left: 0;
            }

            .shell:not(.sidebar-open) .sidebar {
                margin-left: calc(-1 * var(--sidebar-width) - 20px);
            }

            .shell.sidebar-open .backdrop {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 10;
                background: rgba(15, 23, 42, 0.3);
            }

            #homeView {
                padding: 20px 16px 40px;
            }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }

            .hero-logo {
                width: 84px;
                height: 84px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .topbar .label {
                display: none;
            }
        }
    </style>
</head>
<body>
<div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Productscape navigation">
        <button class="sidebar-brand" type="button" id="brand" title="Overview">
            <img src="icons/logo.png" alt="">
            <span>eMobility</span>
        </button>
        <div class="sidebar-search" id="search_container">
            <div class="search-box">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <circle cx="7" cy="7" r="5"/>
                    <path d="M11 11l4 4"/>
                </svg>
                <input id="filter_all" type="search" placeholder="Search pages..." autocomplete="off"
                       aria-label="Search pages" aria-controls="sidebarTree">
                <span class="search-hint" id="searchHint" aria-hidden="true">/</span>
                <button class="search-clear" id="searchClear" type="button" aria-label="Clear search" hidden>&times;</button>
            </div>
            <div class="sidebar-tools">
                <span id="summary_all" aria-live="polite"></span>
                <span>
                    <button class="link-button" type="button" id="expandAll">expand all</button>
                    &middot;
                    <button class="link-button" type="button" id="collapseAll">collapse all</button>
                </span>
            </div>
        </div>
        <nav class="sidebar-tree" id="sidebarTree"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-button" type="button" id="sidebarToggle" aria-controls="sidebar"
                    aria-label="Toggle navigation" title="Toggle navigation">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2 4h12M2 8h12M2 12h12"/>
                </svg>
            </button>
            <div class="topbar-title" id="topbarTitle"></div>
            <button class="icon-button" type="button" id="homeButton" hidden title="Back to overview">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M2 8l6-5 6 5M4 7v6h8V7"/>
                </svg>
                <span class="label">Overview</span>
            </button>
            <a class="icon-button" id="openExternal" href="#" target="_blank" hidden title="Open page in a new tab">
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                    <path d="M9 2h5v5M14 2L7 9M12 10v4H2V4h4"/>
                </svg>
                <span class="label">New tab</span>
            </a>
        </header>

        <section class="view" id="homeView">
            <div class="home">
                <div class="hero">
                    <img class="hero-logo" src="icons/logo.png" alt="">
                    <div>
                        <h1>eMobility</h1>
                        <div class="domain-description clamped" id="descriptionContainer">
                            <span id="domain-description">The eMobility domain covers the platforms, operations, and customer journeys required to run charging networks, roaming services, driver experiences, and fleet electrification at scale.</span>
                            <button id="domain-description-toggle" class="link-button" type="button"
                                    aria-expanded="false" aria-controls="domain-description" hidden>more</button>
                        </div>
                    </div>
                </div>
                <div id="appGroups"></div>
            </div>
        </section>

        <section class="view" id="frameView" hidden>
            <iframe id="pageFrame" title="Selected page"></iframe>
        </section>
    </div>
</div>

            '<div class="name">' + app.name + '</div>' +
            (app.source ? '<div class="source">source: ' + escapeHtml(app.source) + '</div>' : '') +
            '<div class="description">' + escapeHtml(app.description) + '</div>' + appCountsHtml(app) + '</a>';
    }

    function renderApps() {
        let html = '';
        apps.forEach(tab => {
            if (apps.length > 1) html += '<h2 class="app-tab-title">' + escapeHtml(tab.tab) + '</h2>';
            (tab.apps || []).forEach(group => {
                html += '<div class="app-group"><h3 class="app-group-title">' + escapeHtml(group.group) + '</h3>' +
                    '<div class="app-grid">' + (group.apps || []).map(renderAppCard).join('') + '</div></div>';
            });
        });
        document.getElementById('appGroups').innerHTML = html;
    }

    homeView.addEventListener('click', event => {
        const link = event.target.closest('a.app');
        if (link) followLink(event, link.getAttribute('href'));
    });

    // ---------- domain description: three lines with a "more" toggle ----------

    const descriptionContainer = document.getElementById('descriptionContainer');
    const descriptionText = document.getElementById('domain-description');
    const descriptionToggle = document.getElementById('domain-description-toggle');

    function updateDescriptionToggle() {
        const isExpanded = descriptionToggle.getAttribute('aria-expanded') === 'true';
        descriptionContainer.classList.add('clamped');
        const overflows = descriptionText.scrollHeight > descriptionText.clientHeight + 1;
        descriptionContainer.classList.toggle('clamped', overflows && !isExpanded);
        descriptionToggle.hidden = !overflows;
        descriptionToggle.textContent = isExpanded ? 'less' : 'more';
    }

    descriptionToggle.addEventListener('click', () => {
        const isExpanded = descriptionToggle.getAttribute('aria-expanded') === 'true';
        descriptionToggle.setAttribute('aria-expanded', String(!isExpanded));
        updateDescriptionToggle();
    });
    window.addEventListener('resize', updateDescriptionToggle);

    renderSidebar();
    renderApps();
    route();
    updateDescriptionToggle();
    if (document.fonts) document.fonts.ready.then(updateDescriptionToggle);
</script>
</body>
</html>
