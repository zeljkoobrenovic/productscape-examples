<script>
    // Pages shown inside the start page's viewer get their section links,
    // breadcrumbs and sibling-page icon strips from its sidebar and top bar,
    // so hide their own.
    if (window.self !== window.top) {
        document.documentElement.classList.add('embedded');
        // Keep links to other Productscape pages inside the viewer instead of a new
        // browser tab, where they would show without the sidebar.
        document.addEventListener('click', event => {
            const link = event.target.closest && event.target.closest('a[target="_blank"]');
            const href = link && link.getAttribute('href');
            if (!href || href.startsWith('#') || /^([a-z][a-z0-9+.-]*:|\/\/)/i.test(href)) return;
            if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
            event.preventDefault();
            window.location.href = link.href;
        }, true);
    }
</script>

            return layeredModulesOf(brick || {}).find(module => module.id === moduleId) || null;
        }

        function moduleNameForBrick(brick, moduleId) {
            const moduleInfo = moduleByIdForBrick(brick, moduleId);
            if (!moduleInfo) {
                return moduleId || '';
            }
            return moduleInfo.displayName || moduleInfo.name || moduleInfo.id || moduleId;
        }

        function brickDependencyEdgeLabel(sourceBrick, targetBrick, dependency) {
            const dependencyType = dependency.type || 'unspecified';
            const sourceModule = moduleNameForBrick(sourceBrick, dependency.sourceModuleId);
            const targetModule = moduleNameForBrick(targetBrick, dependency.moduleId);
            const modulePath = [sourceModule, targetModule].filter(Boolean).join(' -> ');
            return [dependencyType, modulePath].filter(Boolean).join(' / ');
        }

        function dataDependencyModuleNames(brick, dependency) {
            const moduleIds = Array.isArray(dependency.moduleIds) ? dependency.moduleIds : (dependency.moduleIds ? [dependency.moduleIds] : []);
            return moduleIds.map(moduleId => moduleNameForBrick(brick, moduleId)).filter(Boolean).join(', ');
        }

        function shouldShowBrickStructure() {
            const toggle = document.getElementById('brickStructureToggle');
            return !toggle || toggle.checked;
        }

        function shouldShowBrickDescriptions() {
            const toggle = document.getElementById('brickDescriptionToggle');
            return !toggle || toggle.checked;
        }

        function shouldShowBrickStatus() {
            const toggle = document.getElementById('brickStatusToggle');
            return Boolean(toggle && toggle.checked);
        }

        function getBrickStatusOptions() {
            const counts = {};
            getBrickCatalog().forEach(brick => {
                const statusId = normalizeStatus(brick.status) || 'unspecified';
                counts[statusId] = (counts[statusId] || 0) + 1;
            });
            const options = brickStatuses.map(status => {
                const statusId = normalizeStatus(status.id || status.name);
                return {
                    id: statusId,
                    name: status.name || status.id || statusId,
                    color: status.color || '#6b7280',
                    count: counts[statusId] || 0
                };
            });
            Object.keys(counts).forEach(statusId => {
                if (!options.some(option => option.id === statusId)) {
                    const status = statusDefinitionOf(statusId);
                    options.push({
                        id: statusId,
                        name: status.name || statusId,
                        color: status.color || '#6b7280',
                        count: counts[statusId] || 0
                    });
                }
            });
            return options;
        }

        function ensureBrickStatusControls() {
            const container = document.getElementById('BrickStatusFilters');
            if (!container || brickStatusControlsInitialized) {
                return;
            }
            const options = getBrickStatusOptions();
            if (!options.length) {
                container.style.display = 'none';
                brickStatusControlsInitialized = true;
                return;
            }
            container.innerHTML = options.map(status => {
                const id = 'brickStatusFilter_' + status.id;
                return `
                    <label class="bricks-toggle bricks-status-filter" for="${escapeHtml(id)}">
                        <input type="checkbox" class="brick-status-filter-input" id="${escapeHtml(id)}" value="${escapeHtml(status.id)}" checked onchange="updateBricksView()">
                        <span class="status-swatch" style="background-color: ${escapeHtml(status.color)}"></span>
                        <span>${escapeHtml(status.name)} (${status.count})</span>
                    </label>
                `;
            }).join('');
            brickStatusControlsInitialized = true;
        }

        function selectedBrickStatuses() {
            const checkboxes = Array.from(document.querySelectorAll('.brick-status-filter-input'));
            if (!checkboxes.length) {
                return new Set(getBrickStatusOptions().map(status => status.id));
            }
            return new Set(checkboxes.filter(input => input.checked).map(input => normalizeStatus(input.value)));
        }

        function brickSearchQuery() {
            const input = document.getElementById('BrickSearch');
            return input ? input.value.trim().toLowerCase() : '';
        }

        function brickMatchesSearch(item, query) {
            if (!query) return true;
            const haystack = [item.id, item.name, item.description, item.type, item.status]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.includes(query);
        }

        function shouldRenderBrick(item) {
            return selectedBrickStatuses().has(normalizeStatus(item.status) || 'unspecified')
                && brickMatchesSearch(item, brickSearchQuery());
        }

        function statusBorderStyle(item) {
            if (!shouldShowBrickStatus()) {
                return '';
            }
            return `border-color: ${statusColorOf(item.status)}; border-width: 3px;`;
        }

        function renderBrick(item) {
            const structureCards = layeredModulesOf(item);
            const structureMarkup = shouldShowBrickStructure() && structureCards.length
                ? `<div class="brick-structure-list">${structureCards.map(structure => `
                    <div class="brick-structure-card ${escapeHtml(moduleLayerClass(structure.layerId))}" style="" title="${escapeHtml(structure.layerLabel + ': ' + structure.displayName)}">
                        <div class="structure-card-type">${escapeHtml(structure.type || structure.layerLabel)}</div>
                        <div>${escapeHtml(structure.displayName)}</div>
                    </div>
                `).join('')}</div>`
                : '';
            const brickCard = `
                <div class="brick-card${item.isHighlighted ? ' highlighted' : ''}" style="background-color: ${item.color}; ${statusBorderStyle(item)}">
                    <div class="brick-card-main">
                        <div style="background-color: #fafafa; width: 100%; border-bottom: 1px solid black">
                        <img class="brick-icon" src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        </div>
                        <div class="brick-name">
                            <div class="brick-name-title">${item.name || ''}</div>
                        </div>
                        ${shouldShowBrickDescriptions() && item.description ? `<div class="brick-description" title="${escapeHtml(item.description)}">${escapeHtml(item.description)}</div>` : ''}
                    </div>
                    ${structureMarkup}
                </div>
            `;

            if (!item.id) {
                return brickCard;
            }

            return `<a target="_blank" href="landing_pages/${item.id}.html">${brickCard}</a>`;
        }

        function renderGroup(group) {
            const renderedSubGroups = (group.subGroups || []).map(renderGroup).join('');
            const renderedBricks = (group.bricks || []).map(renderBrick).join('');
            return `
                <div class="group">
                    <div class="group-title">${group.name}</div>
                    <div class="group-items">${renderedSubGroups}${renderedBricks}</div>
                </div>
            `;
        }

        function renderDomain(domain) {
            // A domain's own bricks wrap side by side, like the bricks of its groups.
            const renderedBricks = (domain.bricks || []).map(renderBrick).join('');
            return `
                <section class="domain-column">
                    <div class="domain-title">${domain.name}</div>
                    <div class="domain-groups">${(domain.subGroups || []).map(renderGroup).join('')}${renderedBricks ? `<div class="group-items">${renderedBricks}</div>` : ''}</div>
                </section>
            `;
        }

        function buildGroupRowLookup() {
            const lookup = {};
            ((brickRendering.rows) || []).forEach(rowInfo => {
                const row = Number(rowInfo.row) || 1;
                (rowInfo.rootGroupNames || rowInfo.groupNames || rowInfo.brickIds || []).forEach(groupName => {
                    lookup[slugify(groupName)] = row;
                });
            });
            return lookup;
        }

        function applyRowsToHierarchy(items, groupRows) {
            return items.map(group => ({
                ...normalizeGroup(group),
                row: groupRows[slugify(group.name)] || Number(group.row) || 1
            }));
        }

        function filterGroupByStatus(group) {
            const subGroups = (group.subGroups || [])
                .map(filterGroupByStatus)
                .filter(Boolean);
            const bricks = (group.bricks || []).filter(shouldRenderBrick);
            if (!subGroups.length && !bricks.length) {
                return null;
            }
            return {
                ...group,
                subGroups,
                bricks
            };
        }

        function filterHierarchyForRow(items, targetRow) {
            return items.filter(group => group.row === targetRow);
        }

        function renderMap(items) {
            const groupRows = buildGroupRowLookup();
            const normalizedItems = applyRowsToHierarchy(items, groupRows)
                .map(filterGroupByStatus)
                .filter(Boolean);
            const rows = Array.from(new Set(
                Object.values(groupRows)
                    .map(value => Number(value) || 1)
                    .concat([1])
            )).sort((left, right) => left - right);

            if (!normalizedItems.length) {
                return '<div class="empty-state">No bricks match the current search and status filters.</div>';
            }

            return `
                <div class="map">
                    ${rows.map(row => {
                const rowItems = filterHierarchyForRow(normalizedItems, row);
                if (!rowItems.length) {
                    return '';
                }
                return `
                            <div class="map-row" data-row="${row}">
                                ${rowItems.map(renderDomain).join('')}
                            </div>
                        `;
            }).join('')}
                </div>
            `;
        }

        function renderLegend() {
            return `
                <div class="legend-title">Legend:</div>
                ${brickTypes.map(type => `
                    <div class="legend-item" style="background-color: ${type.color}">${type.name}</div>
                `).join('')}
            `;
        }

        function escapeMermaidLabel(value) {
            return String(value || '')
                .replaceAll('&', 'and')
                .replaceAll('"', '')
                .replaceAll("'", '')
                .replaceAll('<', '')
                .replaceAll('>', '')
                .replaceAll('[', '(')
                .replaceAll(']', ')')
                .replaceAll('{', '(')
                .replaceAll('}', ')')
                .replaceAll('|', '/');
        }

        function flattenBricks(groups, ancestors = []) {
            let leaves = [];
            (groups || []).forEach(group => {
                const nextAncestors = ancestors.concat(group);
                leaves = leaves.concat(flattenBricks(group.subGroups || [], nextAncestors));
                const domain = nextAncestors[0] ? nextAncestors[0].name : '';
                const groupName = nextAncestors.length ? nextAncestors[nextAncestors.length - 1].name : '';
                (group.bricks || []).forEach(item => {
                    leaves.push({
                        ...item,
                        domain: domain,
                        group: groupName
                    });
                });
            });
            return leaves;
        }

        function getBrickCatalog() {
            return flattenBricks(rootGroups);
        }

        function getStreamCatalogItems() {
            const fallbackStreams = getBrickCatalog().map(item => ({
                ...item,
                sourceType: 'brick-fallback'
            }));

            return explicitStreams.length ? explicitStreams : fallbackStreams;
        }

        function normalizeStreamGroups(groups) {
            return (groups || []).map(group => ({
                ...group,
                subGroups: normalizeStreamGroups(group.subGroups || []),
                streams: (group.streams || []).map(item => ({
                    ...item,
                    group: item.group || group.name,
                    rootGroup: item.rootGroup || ''
                }))
            }));
        }

        function buildBrickLookup() {
            const lookup = {};
            getBrickCatalog().forEach(item => {
                lookup[item.id] = item;
            });
            return lookup;
        }

        function streamAreaOf(stream, brickLookup) {
            if (stream.group) {
                return stream.group;
            }
            const groups = {};
            (stream.brickDependencies || []).forEach(dep => {
                const brick = brickLookup[dep.targetBrickId] || {};
                const area = brick.group || brick.domain || 'General';
                groups[area] = (groups[area] || 0) + 1;
            });
            const ranked = Object.entries(groups).sort((left, right) => {
                if (right[1] !== left[1]) {
                    return right[1] - left[1];
                }
                return left[0].localeCompare(right[0]);
            });
            return ranked.length ? ranked[0][0] : 'General';
        }

        function renderStreamPills(stream, brickLookup) {
            const brickPills = (stream.brickDependencies || []).map(dep => {
                if (!dep.targetBrickId) {
                    return '';
                }
                const brick = brickLookup[dep.targetBrickId] || {};
                const pillColor = colorOf(brick.type);
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${dep.targetBrickId}.html" title="${dep.description || ''}">
                        <img src="icons/${dep.targetBrickId}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || dep.targetBrickId}</span>
                    </a>
                `;
            }).filter(Boolean).join('');

            return `
                <div class="stream-pills">${brickPills || ''}</div>
            `;
        }


        let streamView = 'cards';

        function setStreamView(view) {
            streamView = view;
            document.querySelectorAll('.stream-view-btn').forEach(button => {
                button.classList.toggle('active', button.getAttribute('data-stream-view') === view);
            });
            renderStreamsView();
        }

        // Stream rows (grouped as authored) against the bricks they run on. Columns are the
        // bricks used by any stream, most shared first, so shared foundations sit on the left.
        function renderStreamMatrix(hierarchicalGroups, grouped, brickLookup, brickUsage) {
            const rows = [];
            function collect(group, path) {
                const label = path.concat(group.name).join(' / ');
                const streams = group.streams || [];
                if (streams.length) rows.push({group: label, streams: streams});
                (group.subGroups || []).forEach(child => collect(child, path.concat(group.name)));
            }
            if (hierarchicalGroups.length) {
                hierarchicalGroups.forEach(group => collect(group, []));
            } else {
                Object.keys(grouped).sort().forEach(area => rows.push({group: area, streams: grouped[area]}));
            }
            const brickIds = Object.keys(brickUsage).sort((a, b) =>
                brickUsage[b].length - brickUsage[a].length || String((brickLookup[a] || {}).name || a).localeCompare(String((brickLookup[b] || {}).name || b)));
            if (!brickIds.length) {
                return '<div class="activity-muted">No stream lists brick dependencies yet.</div>';
            }
            const maxUse = Math.max(...brickIds.map(id => brickUsage[id].length));
            const heat = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95'];
            const heatOf = n => heat[Math.min(heat.length - 1, Math.floor((n - 1) / Math.max(1, maxUse) * heat.length))];
            const name = id => escapeHtml((brickLookup[id] || {}).name || id);

            let html = '<div class="smx-note">Each filled cell means the stream runs on that brick. Columns are ordered by how many streams share the brick; the bottom row counts them.</div>';
            html += '<div class="smx-wrap"><table class="smx"><thead><tr><th class="smx-corner">Stream</th>';
            brickIds.forEach(id => {
                html += `<th class="smx-col" title="${name(id)}"><a href="landing_pages/${id}.html" target="_blank"><span>${name(id)}</span></a></th>`;
            });
            html += '<th class="smx-total-head">Bricks</th></tr></thead><tbody>';
            rows.forEach(row => {
                html += `<tr class="smx-group-row"><th colspan="${brickIds.length + 2}">${escapeHtml(row.group)}</th></tr>`;
                row.streams.forEach(stream => {
                    const used = new Set((stream.brickDependencies || []).map(dep => dep.targetBrickId));
                    html += `<tr><th class="smx-row"><a href="stream_pages/${stream.id}.html" target="_blank">${escapeHtml(stream.name || stream.id)}</a></th>`;
                    brickIds.forEach(id => {
                        html += used.has(id)
                            ? `<td class="smx-cell on" title="${escapeHtml(stream.name || stream.id)} runs on ${name(id)}"></td>`
                            : '<td class="smx-cell"></td>';
                    });
                    html += `<td class="smx-total">${used.size}</td></tr>`;
                });
            });
            html += '<tr class="smx-count-row"><th class="smx-row">Streams using the brick</th>';
            brickIds.forEach(id => {
                const n = brickUsage[id].length;
                html += `<td class="smx-count" style="background:${heatOf(n)};color:${n / maxUse > 0.5 ? '#fff' : '#111827'}" title="${name(id)}: ${n} stream${n === 1 ? '' : 's'}">${n}</td>`;
            });
            html += '<td></td></tr></tbody></table></div>';
            return html;
        }

        function renderStreamsView() {
            const container = document.getElementById('StreamsContent');
            if (!container) {
                return;
            }
            const descriptionToggle = document.getElementById('streamDescriptionToggle');
            const showDescriptions = Boolean(descriptionToggle && descriptionToggle.checked);

            const streams = getStreamCatalogItems();
            const brickLookup = buildBrickLookup();
            const grouped = {};
            streams.forEach(stream => {
                const area = streamAreaOf(stream, brickLookup);
                if (!grouped[area]) {
                    grouped[area] = [];
                }
                grouped[area].push(stream);
            });

            function summarizeStreamStory(stream) {
                const firstFlow = (stream.flows || [])[0] || {};
                const firstStep = (firstFlow.steps || [])[0] || {};
                const actor = firstFlow.primaryActor || firstStep.actor || '';
                const trigger = firstFlow.trigger || firstStep.trigger || '';
                return {actor, trigger};
            }

            function renderStreamCard(stream) {
                const story = summarizeStreamStory(stream);
                const flows = stream.flows || [];
                const steps = flows.reduce((sum, flow) => sum + (flow.steps || []).length, 0);
                const pains = flows.reduce((sum, flow) => sum + (flow.steps || []).reduce((n, step) => n + (step.painPoints || []).length, 0), 0);
                const deps = (stream.brickDependencies || []).filter(dep => dep.targetBrickId);
                const outcomes = stream.outcomes || [];
                const counts = [[flows.length, 'flow'], [steps, 'step'], [pains, 'pain point'], [deps.length, 'brick']]
                    .map(([n, word]) => `<span><b>${n}</b> ${word}${n === 1 ? '' : 's'}</span>`).join('');
                const outcomeList = outcomes.length
                    ? `<div style="margin-top: 20px;" class="stream-card-label">Outcomes</div><ul class="stream-outcomes">${outcomes.slice(0, 3).map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>` +
                      (outcomes.length > 3 ? `<div class="stream-more">+${outcomes.length - 3} more on the stream page</div>` : '')
                    : '<div class="stream-card-copy activity-muted">No outcomes listed.</div>';
                const brickStrip = deps.length ? `
                    <div class="stream-bricks" style="margin-top: 24px"><span class="stream-brick-icons">${deps.map(dep => {
                        const brick = brickLookup[dep.targetBrickId] || {};
                        return `<a href="landing_pages/${dep.targetBrickId}.html" target="_blank"><img src="icons/${dep.targetBrickId}.png" alt="${escapeHtml(brick.name || dep.targetBrickId)}" title="${escapeHtml(brick.name || dep.targetBrickId)}" onerror="this.onerror=null;this.src='icons/brick.png'"></a>`;
                    }).join('')}</span></div>` : '';
                return `
                    <div class="stream-card" id="stream-${stream.id}">
                        <div class="stream-card-header">
                            <img class="stream-card-icon" src="icons/${stream.icon || 'stream.png'}" alt="" onerror="this.onerror=null;this.src='icons/stream.png'">
                            <div class="stream-card-title"><a target="_blank" href="stream_pages/${stream.id}.html">${stream.name || stream.id}</a></div>
                        </div>
                        ${showDescriptions && stream.description ? `<div class="stream-card-copy">${stream.description}</div>` : ''}
                        ${story.actor ? `<div class="stream-card-copy"><strong>Actor:</strong> ${story.actor}</div>` : ''}
                        <div class="stream-counts">${counts}</div>
                        ${outcomeList}
                        ${brickStrip}
                    </div>
                `;
            }

            function renderStreamGroup(group, depth = 0) {
                const childGroups = (group.subGroups || []).map(item => renderStreamGroup(item, depth + 1)).join('');
                const cards = (group.streams || []).map(renderStreamCard).join('');
                const titleClass = depth === 0 ? 'stream-area-title' : 'stream-group-title';
                return `
                    <div class="stream-area stream-depth-${depth}">
                        <div class="${titleClass}">${group.name}</div>
                        ${showDescriptions && group.description ? `<div class="stream-group-copy">${group.description}</div>` : ''}
                        ${childGroups}
                        ${cards ? `<div class="stream-grid">${cards}</div>` : ''}
                    </div>
                `;
            }

            function buildBrickUsage() {
                const usage = {};
                streams.forEach(stream => {
                    (stream.brickDependencies || []).forEach(dep => {
                        if (!dep.targetBrickId) {
                            return;
                        }
                        if (!usage[dep.targetBrickId]) {
                            usage[dep.targetBrickId] = [];
                        }
                        usage[dep.targetBrickId].push(stream);
                    });
                });
                return usage;
            }

            function renderBrickAuditItem(brick, linkedStreams) {
                const pillColor = colorOf(brick.type);
                const meta = linkedStreams.length
                    ? linkedStreams.map(item => item.name || item.id).join(', ')
                    : 'Not linked to any stream.';
                return `
                    <a class="stream-pill" style="background-color: ${pillColor}; border-color: rgba(17,17,17,0.12);" target="_blank" href="landing_pages/${brick.id}.html" title="${meta}">
                        <img src="icons/${brick.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                        <span>${brick.name || brick.id}</span>
                    </a>
                `;
            }

            const hierarchicalGroups = normalizeStreamGroups(streamRootGroups);
            const brickUsage = buildBrickUsage();
            if (streamView === 'matrix') {
                container.innerHTML = renderStreamMatrix(hierarchicalGroups, grouped, brickLookup, brickUsage);
                return;
            }
            const unusedBricks = getBrickCatalog().filter(brick => !brickUsage[brick.id]);
            const reusedBricks = getBrickCatalog().filter(brick => (brickUsage[brick.id] || []).length >= 2);
            container.innerHTML = `
                ${hierarchicalGroups.length
                ? hierarchicalGroups.map(group => renderStreamGroup(group)).join('')
                : Object.keys(grouped).sort((left, right) => left.localeCompare(right)).map(area => `
                        <div class="stream-area">
                            <div class="stream-area-title">${area}</div>
                            <div class="stream-grid">
                                ${grouped[area].map(renderStreamCard).join('')}
                            </div>
                        </div>
                    `).join('')}
                <div class="stream-area">
                    <div class="stream-area-title">Bricks Not Part Of Any Stream</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks currently not linked from any stream.</div>' : ''}
                    <div class="stream-pills">${unusedBricks.length ? unusedBricks.map(brick => renderBrickAuditItem(brick, [])).join('') : '<span class="activity-muted">Every brick is linked to at least one stream.</span>'}</div>
                </div>
                <div class="stream-area">
                    <div class="stream-area-title">Bricks In Two Or More Streams</div>
                    ${showDescriptions ? '<div class="stream-group-copy">Implementation bricks reused across multiple streams.</div>' : ''}
                    <div class="stream-pills">${reusedBricks.length ? reusedBricks.map(brick => renderBrickAuditItem(brick, brickUsage[brick.id] || [])).join('') : '<span class="activity-muted">No bricks are shared across two or more streams.</span>'}</div>
                </div>
            `;
        }

        function buildDataAssetUsage(assetId) {
            const producingBricks = [];
            const consumingBricks = [];

            getBrickCatalog().forEach(brick => {
                (brick.dataDependencies || []).forEach(dep => {
                    if (dep.assetId !== assetId) {
                        return;
                    }
                    const role = String(dep.role || '').toLowerCase();
                    if (['own', 'write', 'publish', 'replicate', 'delete'].includes(role)) {
                        producingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    } else {
                        consumingBricks.push({
                            id: brick.id,
                            name: brick.name,
                            role: dep.role || '',
                            description: dep.description || ''
                        });
                    }
                });
            });

            return {producingBricks, consumingBricks};
        }

        function renderDataBrickPills(items, borderColor, actionIcon) {
            if (!items.length) {
                return '<span class="activity-muted">None linked.</span>';
            }

            return `
                <div class="stream-pills">
                    ${items.map(item => {
                const linkedBrick = getBrickCatalog().find(candidate => candidate.id === item.id) || {};
                const pillColor = colorOf(linkedBrick.type);
                return `
                        <a class="stream-pill" style="background-color: ${pillColor}; border: 3px solid ${borderColor};" target="_blank" href="landing_pages/${item.id}.html" title="${escapeHtml(item.description || item.role || '')}">
                            <img src="icons/${actionIcon}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <img src="icons/${item.id}.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <span>${item.name}</span>
                        </a>
                    `;
            }).join('')}
                </div>
            `;
        }

        function flattenDataAssetGroups(groups) {
            let assets = [];
            (groups || []).forEach(group => {
                assets = assets.concat(group.assets || []);
                assets = assets.concat(flattenDataAssetGroups(group.subGroups || []));
            });
            return assets;
        }


        let dataView = 'cards';

        function setDataView(view) {
            dataView = view;
            renderDataView();
        }

        function isPersonalData(asset) {
            return !['', 'none'].includes(String(asset.personalDataLevel || 'none').toLowerCase());
        }

        function isHighCriticality(asset) {
            return ['high', 'critical'].includes(String(asset.securityCriticality || '').toLowerCase());
        }

        function titleCaseWords(value) {
            return String(value || '').split(/[-_\s]+/).filter(Boolean).map(part => part.charAt(0).toUpperCase() + part.slice(1)).join(' ');
        }

        // Badges carry identity in text; color only reinforces sensitivity.
        function renderAssetBadges(asset) {
            const badges = [];
            if (asset.kind) badges.push(['', titleCaseWords(asset.kind)]);
            const classification = String(asset.classification || '').toLowerCase();
            if (classification) badges.push([['restricted', 'confidential'].includes(classification) ? 'dx-badge-restricted' : '', titleCaseWords(classification)]);
            if (isPersonalData(asset)) badges.push(['dx-badge-pii', titleCaseWords(asset.personalDataLevel) + ' personal data']);
            const criticality = String(asset.securityCriticality || '').toLowerCase();
            if (criticality === 'critical') badges.push(['dx-badge-critical', 'Critical']);
            else if (criticality === 'high') badges.push(['dx-badge-high', 'High criticality']);
            if (!badges.length) return '';
            return '<div class="dx-badges">' + badges.map(([cls, label]) => `<span class="dx-badge ${cls}">${escapeHtml(label)}</span>`).join('') + '</div>';
        }

        // "Assortment data." under a group called "Assortment" says nothing new.
        function isTrivialGroupDescription(group) {
            const norm = value => String(value || '').toLowerCase().replace(/[.\s]+$/, '').trim();
            const description = norm(group.description);
            const name = norm(group.name);
            return !description || description === name || description === name + ' data' || description === name + ' data assets';
        }

        const WRITE_ROLES = ['own', 'write', 'publish', 'replicate', 'delete'];

        function renderDataInsights(assets, usageById) {
            const assetLink = asset => `<a href="data_pages/${escapeHtml(asset.id)}.html" target="_blank">${escapeHtml(asset.name || asset.id)}</a>`;
            const listOf = items => items.slice(0, 3).map(assetLink).join(', ') + (items.length > 3 ? ` and ${items.length - 3} more` : '');
            const writersOf = asset => (usageById[asset.id] || {producingBricks: []}).producingBricks;
            const readersOf = asset => (usageById[asset.id] || {consumingBricks: []}).consumingBricks;
            const insights = [];
            const personal = assets.filter(isPersonalData);
            if (personal.length) insights.push(['Personal data', personal.length + ' asset' + (personal.length === 1 ? '' : 's') + ' hold personal data: ' + listOf(personal) + '.']);
            const critical = assets.filter(isHighCriticality);
            if (critical.length) insights.push(['Sensitive', critical.length + ' asset' + (critical.length === 1 ? ' is' : 's are') + ' high or critical: ' + listOf(critical) + '.']);
            const noOwner = assets.filter(asset => !asset.systemOfRecordBrickId);
            if (noOwner.length) insights.push(['No owner', listOf(noOwner) + (noOwner.length === 1 ? ' has' : ' have') + ' no system of record.']);
            const multiWriter = assets.filter(asset => new Set(writersOf(asset).map(item => item.id)).size > 1);
            if (multiWriter.length) insights.push(['Shared writes', listOf(multiWriter) + (multiWriter.length === 1 ? ' is' : ' are') + ' written by more than one brick, so ownership may be unclear.']);
            const unread = assets.filter(asset => !readersOf(asset).length);
            if (unread.length) insights.push(['Unread', listOf(unread) + (unread.length === 1 ? ' is' : ' are') + ' not read by any brick.']);
            const hub = assets.slice().sort((a, b) => new Set(readersOf(b).map(i => i.id)).size - new Set(readersOf(a).map(i => i.id)).size)[0];
            const hubReaders = hub ? new Set(readersOf(hub).map(i => i.id)).size : 0;
            if (hubReaders > 1) insights.push(['Hub', assetLink(hub) + ' is read by ' + hubReaders + ' bricks, the most of any asset.']);
            if (!insights.length) return '';
            return '<div class="dx-insights">' + insights.map(([label, text]) =>
                `<div class="dx-insight"><div class="dx-insight-label">${label}</div><div class="dx-insight-text">${text}</div></div>`).join('') + '</div>';
        }

        // Asset rows (grouped as authored) against the bricks that touch them; O = owns, W = writes, R = reads.
        function renderDataMatrix(assetGroups, assets, usageById, brickById) {
            const rows = [];
            function collect(group, path) {
                const label = path.concat(group.name).join(' / ');
                if ((group.assets || []).length) rows.push({group: label, assets: group.assets});
                (group.subGroups || []).forEach(child => collect(child, path.concat(group.name)));
            }
            if (assetGroups.length) assetGroups.forEach(group => collect(group, []));
            else rows.push({group: 'Data assets', assets: assets});

            const roleByAssetBrick = {};
            const brickAssetCount = {};
            getBrickCatalog().forEach(brick => (brick.dataDependencies || []).forEach(dep => {
                if (!dep.assetId) return;
                const role = String(dep.role || 'read').toLowerCase();
                const level = role === 'own' ? 3 : WRITE_ROLES.includes(role) ? 2 : 1;
                const key = dep.assetId + '|' + brick.id;
                if (!roleByAssetBrick[key] || roleByAssetBrick[key] < level) roleByAssetBrick[key] = level;
                brickAssetCount[brick.id] = brickAssetCount[brick.id] || new Set();
                brickAssetCount[brick.id].add(dep.assetId);
            }));
            const brickIds = Object.keys(brickAssetCount).sort((a, b) =>
                brickAssetCount[b].size - brickAssetCount[a].size || String((brickById[a] || {}).name || a).localeCompare(String((brickById[b] || {}).name || b)));
            if (!brickIds.length) return '<div class="activity-muted">No brick lists data dependencies yet.</div>';
            const name = id => escapeHtml((brickById[id] || {}).name || id);
            const cellOf = {3: ['own', 'O', 'owns'], 2: ['write', 'W', 'writes'], 1: ['read', 'R', 'reads']};

            let html = '<div class="smx-note">Which bricks own, write or read each asset. Each asset should have exactly one owner; the last column flags the ones that do not.</div>';
            html += '<div class="dmx-legend"><span><i class="smx-cell dmx-own">O</i> owns</span><span><i class="smx-cell dmx-write">W</i> writes</span><span><i class="smx-cell dmx-read">R</i> reads</span></div>';
            html += '<div class="smx-wrap"><table class="smx"><thead><tr><th class="smx-corner">Data asset</th>';
            brickIds.forEach(id => { html += `<th class="smx-col" title="${name(id)}"><a href="landing_pages/${id}.html" target="_blank"><span>${name(id)}</span></a></th>`; });
            html += '<th class="smx-total-head">Owners</th></tr></thead><tbody>';
            rows.forEach(row => {
                html += `<tr class="smx-group-row"><th colspan="${brickIds.length + 2}">${escapeHtml(row.group)}</th></tr>`;
                row.assets.forEach(asset => {
                    let owners = 0;
                    html += `<tr><th class="smx-row"><a href="data_pages/${escapeHtml(asset.id)}.html" target="_blank">${escapeHtml(asset.name || asset.id)}</a></th>`;
                    brickIds.forEach(id => {
                        const level = roleByAssetBrick[asset.id + '|' + id];
                        if (!level) { html += '<td class="smx-cell"></td>'; return; }
                        if (level === 3) owners += 1;
                        const [cls, letter, verb] = cellOf[level];
                        html += `<td class="smx-cell dmx-${cls}" title="${name(id)} ${verb} ${escapeHtml(asset.name || asset.id)}">${letter}</td>`;
                    });
                    html += `<td class="smx-total${owners === 1 ? '' : ' dmx-flag'}" title="${owners === 1 ? 'One owner' : owners + ' owners'}">${owners}${owners === 1 ? '' : ' ⚠'}</td></tr>`;
                });
            });
            html += '<tr class="smx-count-row"><th class="smx-row">Assets the brick touches</th>';
            brickIds.forEach(id => { html += `<td class="smx-count dmx-count">${brickAssetCount[id].size}</td>`; });
            html += '<td></td></tr></tbody></table></div>';
            return html;
        }

        function renderDataView() {
            const container = document.getElementById('DataContent');
            if (!container) {
                return;
            }

            const assetGroups = dataAssetsPayload.rootGroups || [];
            const assets = dataAssetsPayload.assets || flattenDataAssetGroups(assetGroups);
            const stores = dataAssetsPayload.stores || [];
            const totalStoreRefs = assets.reduce((sum, asset) => sum + ((asset.stores || []).length), 0);
            const brickById = buildBrickLookup();
            const usageById = {};
            assets.forEach(asset => { usageById[asset.id] = buildDataAssetUsage(asset.id); });

            function storeById(storeId) {
                return stores.find(item => item.id === storeId) || {};
            }

            function renderStoreList(asset) {
                if (!(asset.stores || []).length) {
                    return '<div class="activity-muted">No stores linked.</div>';
                }
                return `
                    <ul class="data-store-list">
                        ${(asset.stores || []).map(link => {
                    const store = storeById(link.storeId);
                    const parts = [store.name || link.storeId, link.role].filter(Boolean);
                    return `<li>${escapeHtml(parts.join(' | '))}</li>`;
                }).join('')}
                    </ul>
                `;
            }

            function renderMetaList(asset) {
                const items = [
                    asset.kind ? 'Kind: ' + asset.kind : '',
                    asset.classification ? 'Classification: ' + asset.classification : '',
                    asset.personalDataLevel ? 'Personal data: ' + asset.personalDataLevel : '',
                    asset.systemOfRecordBrickId ? 'System of record: ' + asset.systemOfRecordBrickId : ''
                ].filter(Boolean);
                if (!items.length) {
                    return '<div class="activity-muted">No governance metadata listed.</div>';
                }
                return `<ul class="data-meta-list">${items.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul>`;
            }

            function renderAssetCard(asset) {
                let detailMarkup = '';
                if (dataShowDetail) {
                    detailMarkup = `
                        <div class="data-card-subtitle">Metadata</div>
                        ${renderMetaList(asset)}
                        <div class="data-card-subtitle">Stores</div>
                        ${renderStoreList(asset)}
                    `;
                }
                let brickMarkup = '';
                if (dataShowBricks) {
                    const usage = buildDataAssetUsage(asset.id);
                    brickMarkup = `
                        <div class="data-card-subtitle">Producing Bricks</div>
                        ${renderDataBrickPills(usage.producingBricks, 'crimson', 'write-data')}
                        <div class="data-card-subtitle">Consuming Bricks</div>
                        ${renderDataBrickPills(usage.consumingBricks, 'blue', 'read-data')}
                    `;
                }
                const usage = usageById[asset.id] || {producingBricks: [], consumingBricks: []};
                const owner = asset.systemOfRecordBrickId ? (brickById[asset.systemOfRecordBrickId] || {}).name || asset.systemOfRecordBrickId : '';
                const counts = [[usage.producingBricks.length, 'writer'], [usage.consumingBricks.length, 'reader'], [(asset.stores || []).length, 'store']]
                    .map(([n, word]) => `<span><b>${n}</b> ${word}${n === 1 ? '' : 's'}</span>`).join('');
                return `
                    <div class="data-card">
                        <a class="data-card-head" target="_blank" rel="noopener noreferrer" href="data_pages/${escapeHtml(asset.id)}.html" style="text-decoration:none;color:inherit;">
                            <img class="data-card-icon" src="icons/data.png" alt="" onerror="this.onerror=null;this.src='icons/brick.png'">
                            <div class="data-card-title">${escapeHtml(asset.name || asset.id)}</div>
                        </a>
                        ${renderAssetBadges(asset)}
                        ${asset.description ? `<div class="data-card-copy">${escapeHtml(asset.description)}</div>` : ''}
                        <div class="data-owner">${owner
                            ? `Owned by <a href="landing_pages/${escapeHtml(asset.systemOfRecordBrickId)}.html" target="_blank">${escapeHtml(owner)}</a>`
                            : '<span class="data-owner-missing">No system of record</span>'}</div>
                        <div class="data-counts">${counts}</div>
                        ${detailMarkup}
                        ${brickMarkup}
                    </div>
                `;
            }

            function renderAssetGroup(group, depth = 0) {
                const directAssets = group.assets || [];
                const childGroups = group.subGroups || [];
                const totalAssets = flattenDataAssetGroups([group]).length;
                const directAssetMarkup = directAssets.length
                    ? `<div class="data-grid">${directAssets.map(renderAssetCard).join('')}</div>`
                    : '';
                const childMarkup = childGroups.map(child => renderAssetGroup(child, depth + 1)).join('');
                return `
                    <section class="data-group data-group-depth-${depth}">
                        <div class="data-group-header">
                            <div class="data-group-title">${escapeHtml(group.name || 'Data Assets')}</div>
                            <div class="data-group-count">${totalAssets} ${totalAssets === 1 ? 'asset' : 'assets'}</div>
                        </div>
                        ${group.description && !isTrivialGroupDescription(group) ? `<div class="data-group-description">${escapeHtml(group.description)}</div>` : ''}
                        ${directAssetMarkup}
                        ${childMarkup}
                    </section>
                `;
            }

            const assetMarkup = assetGroups.length
                ? assetGroups.map(group => renderAssetGroup(group)).join('')
                : `<div class="data-grid">${assets.map(renderAssetCard).join('')}</div>`;

            const touchingBricks = new Set();
            Object.values(usageById).forEach(usage => usage.producingBricks.concat(usage.consumingBricks).forEach(item => touchingBricks.add(item.id)));
            const personal = assets.filter(isPersonalData).length;
            const critical = assets.filter(isHighCriticality).length;
            const tiles = [
                ['Assets', assets.length], ['Stores', stores.length], ['Store links', totalStoreRefs],
                ['Bricks using data', touchingBricks.size], ['Personal data', personal], ['High or critical', critical]
            ];
            const body = dataView === 'matrix'
                ? renderDataMatrix(assetGroups, assets, usageById, brickById)
                : (assets.length ? assetMarkup : '<div class="activity-muted">No data assets are defined for this domain yet.</div>');
            container.innerHTML = `
                <div class="data-options">
                    <div class="stream-view-switch" role="group" aria-label="Data view">
                        <button type="button" class="stream-view-btn${dataView === 'cards' ? ' active' : ''}" onclick="setDataView('cards')">Cards</button>
                        <button type="button" class="stream-view-btn${dataView === 'matrix' ? ' active' : ''}" onclick="setDataView('matrix')">Asset × brick matrix</button>
                    </div>
                    ${dataView === 'cards' ? `
                    <label class="data-option"><input type="checkbox" id="dataShowDetailToggle" ${dataShowDetail ? 'checked' : ''} onchange="setDataShowDetail(this.checked)"> Show detail</label>
                    <label class="data-option"><input type="checkbox" id="dataShowBricksToggle" ${dataShowBricks ? 'checked' : ''} onchange="setDataShowBricks(this.checked)"> Show bricks</label>` : ''}
                </div>
                <div class="dx-tiles">${tiles.map(([label, value]) => `<div class="dx-tile${value ? '' : ' zero'}"><span class="dx-tile-value">${value}</span><span class="dx-tile-label">${label}</span></div>`).join('')}</div>
                ${assets.length ? renderDataInsights(assets, usageById) : ''}
                ${body}
            `;
        }

        function setDataShowBricks(show) {
            dataShowBricks = show;
            renderDataView();
        }

        function setDataShowDetail(show) {
            dataShowDetail = show;
            renderDataView();
        }

        function sortByDisplayName(left, right) {
            return (left.name || left.id || '').localeCompare(right.name || right.id || '');
        }

        function getAllDataAssets() {
            const assetGroups = dataAssetsPayload.rootGroups || [];
            return dataAssetsPayload.assets || flattenDataAssetGroups(assetGroups);
        }

        function getDeclaredDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const bricks = getBrickCatalog().slice().sort(sortByDisplayName);
            const dependencyTypes = new Set();
            bricks.forEach(brick => {
                (brick.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        dependencyTypes.add(dep.type || 'unspecified');
                    }
                });
            });
            return {
                streams,
                bricks,
                dependencyTypes: Array.from(dependencyTypes).sort((left, right) => left.localeCompare(right))
            };
        }

        function getDataDependencyCatalog() {
            const assetLookup = {};
            getAllDataAssets().forEach(asset => {
                if (asset.id) {
                    assetLookup[asset.id] = asset;
                }
            });

            const referencedAssetIds = new Set();
            const bricks = getBrickCatalog().filter(brick => {
                const dependencies = brick.dataDependencies || [];
                dependencies.forEach(dep => {
                    if (dep.assetId) {
                        referencedAssetIds.add(dep.assetId);
                    }
                });
                return dependencies.some(dep => dep.assetId);
            }).sort(sortByDisplayName);

            const assets = Array.from(referencedAssetIds).map(assetId => {
                return assetLookup[assetId] || {
                    id: assetId,
                    name: assetId,
                    kind: 'unlisted'
                };
            }).sort(sortByDisplayName);

            return {bricks, assets};
        }

        function getStreamDependencyCatalog() {
            const streams = getStreamCatalogItems().slice().sort(sortByDisplayName);
            const referencedBrickIds = new Set();
            streams.forEach(stream => {
                (stream.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        referencedBrickIds.add(dep.targetBrickId);
                    }
                });
            });
            const bricks = getBrickCatalog()
                .filter(brick => referencedBrickIds.has(brick.id))
                .sort(sortByDisplayName);
            return {streams, bricks};
        }

        function renderDependencySubtabs() {
            const container = document.getElementById('DependencySubtabs');
            if (!container) {
                return;
            }
            const tabs = [
                {id: 'declared', label: 'Declared brick dependencies'},
                {id: 'data', label: 'Brick dependencies via data assets'},
                {id: 'streams', label: 'Brick dependencies via streams'}
            ];
            container.innerHTML = tabs.map(tab => `
                <button class="dependency-subtab${activeDependencySubtab === tab.id ? ' active' : ''}" type="button" onclick="setDependencySubtab('${tab.id}')">
                    ${tab.label}
                </button>
            `).join('');
        }

        function dependencyStateFor(subtab) {
            return dependencySelectionState[subtab] || {};
        }

        function renderDependencyControlGroup(title, className, items, checkedValues, renderLabel) {
            const checkedSet = checkedValues ? new Set(checkedValues) : null;
            const checklist = items.length
                ? items.map(item => {
                    const value = String(item.id || item);
                    const checked = !checkedSet || checkedSet.has(value) ? 'checked' : '';
                    return `
                        <label class="dependency-check-item">
                            <input type="checkbox" class="${className}" value="${escapeHtml(value)}" ${checked} onchange="renderActiveDependencyGraph()">
                            ${renderLabel(item)}
                        </label>
                    `;
                }).join('')
                : '<div class="dependency-empty">No items available.</div>';
            return `
                <div class="dependency-control-group">
                    <div class="dependency-control-title">${title}</div>
                    <div class="dependency-actions">
                        <button class="dependency-action" type="button" onclick="setAllDependencyCheckboxes('.${className}', true)">Show all</button>
                        <button class="dependency-action" type="button" onclick="setAllDependencyCheckboxes('.${className}', false)">Hide all</button>
                    </div>
                    <div class="dependency-checklist">${checklist}</div>
                </div>
            `;
        }

        function renderStreamControlLabel(stream) {
            const meta = [stream.domain, stream.group && stream.group !== stream.domain ? stream.group : '']
                .filter(Boolean)
                .join(' / ');
            return `
                <span>
                    <span>${escapeHtml(stream.name || stream.id)}</span>
                    ${meta ? `<span class="dependency-check-meta">${escapeHtml(meta)}</span>` : ''}
                </span>
            `;
        }

        function renderBrickControlLabel(brick) {
            const meta = [brick.domain, brick.group && brick.group !== brick.domain ? brick.group : '', brick.type]
                .filter(Boolean)
                .join(' / ');
            return `
                <span>
                    <span>${escapeHtml(brick.name || brick.id)}</span>
                    ${meta ? `<span class="dependency-check-meta">${escapeHtml(meta)}</span>` : ''}
                </span>
            `;
        }

        function renderAssetControlLabel(asset) {
            const meta = [asset.kind, asset.classification].filter(Boolean).join(' / ');
            return `
                <span>
                    <span>${escapeHtml(asset.name || asset.id)}</span>
                    ${meta ? `<span class="dependency-check-meta">${escapeHtml(meta)}</span>` : ''}
                </span>
            `;
        }

        function renderTypeControlLabel(type) {
            return `<span>${escapeHtml(type)}</span>`;
        }

        function renderDependencyNodeLegend(items) {
            return `
                <div class="dependency-node-legend">
                    <div class="dependency-control-title">Node Legend</div>
                    <div class="dependency-node-legend-items">
                        ${items.map(item => `
                            <div class="dependency-node-legend-item">
                                <span class="dependency-node-legend-swatch" style="background-color:${item.fill}; border-color:${item.stroke};"></span>
                                <span>${item.label}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderDeclaredDependencyControls() {
            const catalog = getDeclaredDependencyCatalog();
            const state = dependencyStateFor('declared');
            return `
                <div class="dependency-controls">
                    ${renderDependencyControlGroup('Product Streams', 'dependency-declared-stream-checkbox', catalog.streams, state.streamIds, renderStreamControlLabel)}
                    ${renderDependencyControlGroup('Dependency Types', 'dependency-declared-type-checkbox', catalog.dependencyTypes, state.typeIds, renderTypeControlLabel)}
                    ${renderDependencyNodeLegend([
                {fill: '#dbeafe', stroke: '#2563eb', label: 'Product brick'}
            ])}
                </div>
            `;
        }

        function renderDataDependencyControls() {
            const catalog = getDataDependencyCatalog();
            const state = dependencyStateFor('data');
            return `
                <div class="dependency-controls">
                    <div class="dependency-top-options">
                        <label class="dependency-option" for="dependencyDataAggregateToggle">
                            <input type="checkbox" id="dependencyDataAggregateToggle" ${state.aggregate ? 'checked' : ''} onchange="renderActiveDependencyGraph()">
                            <span>Aggregate dependencies</span>
                        </label>
                    </div>
                    ${renderDependencyControlGroup('Product Bricks', 'dependency-data-brick-checkbox', catalog.bricks, state.brickIds, renderBrickControlLabel)}
                    ${renderDependencyControlGroup('Data Assets', 'dependency-data-asset-checkbox', catalog.assets, state.assetIds, renderAssetControlLabel)}
                    ${renderDependencyNodeLegend([
                {fill: '#dbeafe', stroke: '#2563eb', label: 'Product brick'},
                {fill: '#dcfce7', stroke: '#16a34a', label: 'Data asset'}
            ])}
                </div>
            `;
        }

        function renderStreamDependencyControls() {
            const catalog = getStreamDependencyCatalog();
            const state = dependencyStateFor('streams');
            return `
                <div class="dependency-controls">
                    <div class="dependency-top-options">
                        <label class="dependency-option" for="dependencyStreamAggregateToggle">
                            <input type="checkbox" id="dependencyStreamAggregateToggle" ${state.aggregate ? 'checked' : ''} onchange="renderActiveDependencyGraph()">
                            <span>Aggregate brick links</span>
                        </label>
                    </div>
                    ${renderDependencyControlGroup('Product Streams', 'dependency-stream-stream-checkbox', catalog.streams, state.streamIds, renderStreamControlLabel)}
                    ${renderDependencyControlGroup('Product Bricks', 'dependency-stream-brick-checkbox', catalog.bricks, state.brickIds, renderBrickControlLabel)}
                    ${renderDependencyNodeLegend([
                {fill: '#fde68a', stroke: '#d97706', label: 'Product stream'},
                {fill: '#dbeafe', stroke: '#2563eb', label: 'Product brick'}
            ])}
                </div>
            `;
        }

        function renderActiveDependencyControls() {
            const container = document.getElementById('DependencyControls');
            if (!container) {
                return;
            }
            if (activeDependencySubtab === 'data') {
                container.innerHTML = renderDataDependencyControls();
                return;
            }
            if (activeDependencySubtab === 'streams') {
                container.innerHTML = renderStreamDependencyControls();
                return;
            }
            container.innerHTML = renderDeclaredDependencyControls();
        }

        function setAllDependencyCheckboxes(selector, checked) {
            document.querySelectorAll(selector).forEach(input => {
                input.checked = checked;
            });
            renderActiveDependencyGraph();
        }

        function readDependencyControlState() {
            if (!dependenciesInitialized) {
                return;
            }
            if (activeDependencySubtab === 'declared') {
                dependencySelectionState.declared.streamIds = Array.from(selectedValues('.dependency-declared-stream-checkbox'));
                dependencySelectionState.declared.typeIds = Array.from(selectedValues('.dependency-declared-type-checkbox'));
                return;
            }
            if (activeDependencySubtab === 'data') {
                const aggregateToggle = document.getElementById('dependencyDataAggregateToggle');
                dependencySelectionState.data.brickIds = Array.from(selectedValues('.dependency-data-brick-checkbox'));
                dependencySelectionState.data.assetIds = Array.from(selectedValues('.dependency-data-asset-checkbox'));
                dependencySelectionState.data.aggregate = Boolean(aggregateToggle && aggregateToggle.checked);
                return;
            }
            if (activeDependencySubtab === 'streams') {
                const aggregateToggle = document.getElementById('dependencyStreamAggregateToggle');
                dependencySelectionState.streams.streamIds = Array.from(selectedValues('.dependency-stream-stream-checkbox'));
                dependencySelectionState.streams.brickIds = Array.from(selectedValues('.dependency-stream-brick-checkbox'));
                dependencySelectionState.streams.aggregate = Boolean(aggregateToggle && aggregateToggle.checked);
            }
        }

        function setDependencySubtab(subtab) {
            readDependencyControlState();
            activeDependencySubtab = subtab;
            renderDependencySubtabs();
            renderActiveDependencyControls();
            renderActiveDependencyGraph();
        }

        function setAllMatrixCheckboxes(selector, checked) {
            document.querySelectorAll(selector).forEach(input => {
                input.checked = checked;
            });
            renderMatrixView();
        }

        function selectedValues(selector) {
            return new Set(Array.from(document.querySelectorAll(selector))
                .filter(input => input.checked)
                .map(input => input.value));
        }

        function addGraphNode(nodesById, node) {
            if (node.id && !nodesById[node.id]) {
                nodesById[node.id] = node;
            }
        }

        function graphBrickNode(brick) {
            return {
                id: 'brick:' + brick.id,
                label: brick.name || brick.id,
                nodeClass: 'brickNode'
            };
        }

        function graphStreamNode(stream) {
            return {
                id: 'stream:' + stream.id,
                label: stream.name || stream.id,
                nodeClass: 'streamNode'
            };
        }

        function graphDataAssetNode(asset) {
            return {
                id: 'asset:' + asset.id,
                label: asset.name || asset.id,
                nodeClass: 'dataAssetNode'
            };
        }

        function mermaidNodeId(value) {
            return String(value || '').replace(/[^a-zA-Z0-9_]/g, '_');
        }

        function selectedStreamBrickIds(streams, selectedStreamIds, brickLookup) {
            const brickIds = new Set();
            const allStreamsSelected = !streams.length || streams.every(stream => selectedStreamIds.has(stream.id));
            if (allStreamsSelected) {
                Object.keys(brickLookup).forEach(brickId => brickIds.add(brickId));
                return brickIds;
            }
            streams.forEach(stream => {
                if (!selectedStreamIds.has(stream.id)) {
                    return;
                }
                if (brickLookup[stream.id]) {
                    brickIds.add(stream.id);
                }
                (stream.brickDependencies || []).forEach(dep => {
                    if (dep.targetBrickId) {
                        brickIds.add(dep.targetBrickId);
                    }
                });
            });
            return brickIds;
        }

        function buildDeclaredDependencyGraph(catalog, selectedStreamIds, selectedDependencyTypes) {
            const brickLookup = buildBrickLookup();
            const scopedBrickIds = selectedStreamBrickIds(catalog.streams, selectedStreamIds, brickLookup);
            const nodesById = {};
            const edges = [];

            catalog.bricks.forEach(brick => {
                if (!scopedBrickIds.has(brick.id)) {
                    return;
                }
                (brick.brickDependencies || []).forEach(dep => {
                    const dependencyType = dep.type || 'unspecified';
                    if (!dep.targetBrickId || !selectedDependencyTypes.has(dependencyType)) {
                        return;
                    }
                    const targetBrick = brickLookup[dep.targetBrickId] || {
                        id: dep.targetBrickId,
                        name: dep.targetBrickId
                    };
                    addGraphNode(nodesById, graphBrickNode(brick));
                    addGraphNode(nodesById, graphBrickNode(targetBrick));
                    edges.push({
                        source: 'brick:' + brick.id,
                        target: 'brick:' + dep.targetBrickId,
                        label: brickDependencyEdgeLabel(brick, targetBrick, dep)
                    });
                });
            });

            return {
                nodes: Object.values(nodesById),
                edges,
                scopedBrickCount: scopedBrickIds.size
            };
        }

        function isDataProducerRole(role) {
            return ['own', 'write', 'publish', 'replicate', 'delete'].includes(String(role || '').toLowerCase());
        }

        function buildDataDependencyGraph(catalog, selectedBrickIds, selectedAssetIds, aggregate) {
            if (aggregate) {
                return buildAggregatedDataDependencyGraph(catalog, selectedBrickIds, selectedAssetIds);
            }

            const assetLookup = {};
            catalog.assets.forEach(asset => {
                assetLookup[asset.id] = asset;
            });
            const nodesById = {};
            const edges = [];

            catalog.bricks.forEach(brick => {
                if (!selectedBrickIds.has(brick.id)) {
                    return;
                }
                (brick.dataDependencies || []).forEach(dep => {
                    if (!dep.assetId || !selectedAssetIds.has(dep.assetId)) {
                        return;
                    }
                    const asset = assetLookup[dep.assetId] || {
                        id: dep.assetId,
                        name: dep.assetId
                    };
                    addGraphNode(nodesById, graphBrickNode(brick));
                    addGraphNode(nodesById, graphDataAssetNode(asset));
                    const brickNodeId = 'brick:' + brick.id;
                    const assetNodeId = 'asset:' + dep.assetId;
                    edges.push({
                        source: isDataProducerRole(dep.role) ? brickNodeId : assetNodeId,
                        target: isDataProducerRole(dep.role) ? assetNodeId : brickNodeId,
                        label: [dep.role || 'uses', dataDependencyModuleNames(brick, dep)].filter(Boolean).join(' / ')
                    });
                });
            });

            return {
                nodes: Object.values(nodesById),
                edges
            };
        }

        function buildAggregatedDataDependencyGraph(catalog, selectedBrickIds, selectedAssetIds) {
            const brickLookup = {};
            catalog.bricks.forEach(brick => {
                brickLookup[brick.id] = brick;
            });
            const assetToBrickIds = {};
            catalog.bricks.forEach(brick => {
                if (!selectedBrickIds.has(brick.id)) {
                    return;
                }
                (brick.dataDependencies || []).forEach(dep => {
                    if (!dep.assetId || !selectedAssetIds.has(dep.assetId)) {
                        return;
                    }
                    if (!assetToBrickIds[dep.assetId]) {
                        assetToBrickIds[dep.assetId] = new Set();
                    }
                    assetToBrickIds[dep.assetId].add(brick.id);
                });
            });

            const pairLookup = {};
            Object.entries(assetToBrickIds).forEach(([assetId, brickIds]) => {
                const ids = Array.from(brickIds).sort((left, right) => left.localeCompare(right));
                for (let i = 0; i < ids.length; i++) {
                    for (let j = i + 1; j < ids.length; j++) {
                        const key = ids[i] + '::' + ids[j];
                        if (!pairLookup[key]) {
                            pairLookup[key] = new Set();
                        }
                        pairLookup[key].add(assetId);
                    }
                }
            });

            const nodesById = {};
            const edges = [];
            Object.entries(pairLookup).forEach(([key, assetIds]) => {
                const [sourceId, targetId] = key.split('::');
                addGraphNode(nodesById, graphBrickNode(brickLookup[sourceId] || {id: sourceId, name: sourceId}));
                addGraphNode(nodesById, graphBrickNode(brickLookup[targetId] || {id: targetId, name: targetId}));
                const count = assetIds.size;
                edges.push({
                    source: 'brick:' + sourceId,
                    target: 'brick:' + targetId,
                    label: String(count)
                });
            });

            return {
                nodes: Object.values(nodesById),
                edges
            };
        }

        function buildStreamDependencyGraph(catalog, selectedStreamIds, selectedBrickIds, aggregate) {
            if (aggregate) {
                return buildAggregatedStreamDependencyGraph(catalog, selectedStreamIds, selectedBrickIds);
            }

            const brickLookup = {};
            catalog.bricks.forEach(brick => {
                brickLookup[brick.id] = brick;
            });
            const nodesById = {};
            const edges = [];

            catalog.streams.forEach(stream => {
                if (!selectedStreamIds.has(stream.id)) {
                    return;
                }
                (stream.brickDependencies || []).forEach(dep => {
                    if (!dep.targetBrickId || !selectedBrickIds.has(dep.targetBrickId)) {
                        return;
                    }
                    const brick = brickLookup[dep.targetBrickId] || {
                        id: dep.targetBrickId,
                        name: dep.targetBrickId
                    };
                    addGraphNode(nodesById, graphStreamNode(stream));
                    addGraphNode(nodesById, graphBrickNode(brick));
                    edges.push({
                        source: 'stream:' + stream.id,
                        target: 'brick:' + dep.targetBrickId,
                        label: dep.type || 'uses'
                    });
                });
            });

            return {
                nodes: Object.values(nodesById),
                edges
            };
        }

        function buildAggregatedStreamDependencyGraph(catalog, selectedStreamIds, selectedBrickIds) {
            const brickLookup = {};
            catalog.bricks.forEach(brick => {
                brickLookup[brick.id] = brick;
            });
            const pairLookup = {};
            catalog.streams.forEach(stream => {
                if (!selectedStreamIds.has(stream.id)) {
                    return;
                }
                const brickIds = Array.from(new Set((stream.brickDependencies || [])
                    .map(dep => dep.targetBrickId)
                    .filter(brickId => brickId && selectedBrickIds.has(brickId))))
                    .sort((left, right) => left.localeCompare(right));
                for (let i = 0; i < brickIds.length; i++) {
                    for (let j = i + 1; j < brickIds.length; j++) {
                        const key = brickIds[i] + '::' + brickIds[j];
                        if (!pairLookup[key]) {
                            pairLookup[key] = new Set();
                        }
                        pairLookup[key].add(stream.id);
                    }
                }
            });

            const nodesById = {};
            const edges = [];
            Object.entries(pairLookup).forEach(([key, streamIds]) => {
                const [sourceId, targetId] = key.split('::');
                addGraphNode(nodesById, graphBrickNode(brickLookup[sourceId] || {id: sourceId, name: sourceId}));
                addGraphNode(nodesById, graphBrickNode(brickLookup[targetId] || {id: targetId, name: targetId}));
                const count = streamIds.size;
                edges.push({
                    source: 'brick:' + sourceId,
                    target: 'brick:' + targetId,
                    label: String(count)
                });
            });

            return {
                nodes: Object.values(nodesById),
                edges
            };
        }

        function renderDependencyGraphShell() {
            return `
                <div class="dependency-graph-shell">
                    <div class="dependency-view-toggle">
                        <button type="button" class="dependency-view-btn active" data-depview="force" onclick="setDependencyGraphView('force')">2D force graph</button>
                        <button type="button" class="dependency-view-btn" data-depview="mermaid" onclick="setDependencyGraphView('mermaid')">Flow diagram</button>
                    </div>
                    <div class="dependency-graph" id="DependenciesGraph"></div>
                </div>
            `;
        }

        let dependencyGraphView = 'force';
        let dependencyForceInstance = null;

        function setDependencyGraphView(view) {
            dependencyGraphView = view;
            document.querySelectorAll('.dependency-view-btn').forEach(button => {
                button.classList.toggle('active', button.getAttribute('data-depview') === view);
            });
            const graphContainer = document.getElementById('DependenciesGraph');
            if (graphContainer) {
                graphContainer.classList.toggle('force', view === 'force');
            }
            renderActiveDependencyGraph();
        }

        const dependencyNodeColors = {
            streamNode: '#f59e0b',
            brickNode: '#2563eb',
            dataAssetNode: '#16a34a'
        };

        // Convert a #rrggbb color to rgba with the given alpha so overlapping
        // force-graph nodes blend instead of forming a solid color block.
        function dependencyNodeColorWithAlpha(hexColor, alpha) {
            const hex = String(hexColor || '').replace('#', '');
            if (hex.length !== 6) {
                return hexColor;
            }
            const r = parseInt(hex.substring(0, 2), 16);
            const g = parseInt(hex.substring(2, 4), 16);
            const b = parseInt(hex.substring(4, 6), 16);
            return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
        }

        function renderDependencyGraph(graph, emptyMessage) {
            const graphContainer = document.getElementById('DependenciesGraph');
            if (!graphContainer) {
                return;
            }
            graphContainer.classList.toggle('force', dependencyGraphView === 'force');
            dependencyForceInstance = null;
            if (dependencyGraphView === 'force') {
                renderDependencyForce(graph, emptyMessage);
            } else {
                renderDependencyMermaid(graph, emptyMessage);
            }
        }

        function renderDependencyForce(graph, emptyMessage) {
            const graphContainer = document.getElementById('DependenciesGraph');
            if (!graphContainer) {
                return;
            }
            if (!graph.nodes.length || !graph.edges.length) {
                graphContainer.innerHTML = `<div class="dependency-empty">${escapeHtml(emptyMessage)}</div>`;
                return;
            }
            if (typeof ForceGraph === 'undefined') {
                graphContainer.innerHTML = '<div class="dependency-empty">Force graph library failed to load.</div>';
                return;
            }
            graphContainer.innerHTML = '';

            const degree = {};
            graph.edges.forEach(edge => {
                degree[edge.source] = (degree[edge.source] || 0) + 1;
                degree[edge.target] = (degree[edge.target] || 0) + 1;
            });
            const nodes = graph.nodes.map(node => ({
                id: node.id,
                name: node.label,
                nodeClass: node.nodeClass,
                val: (degree[node.id] || 1)
            }));
            const links = graph.edges.map(edge => ({source: edge.source, target: edge.target, label: edge.label || ''}));

            const Graph = ForceGraph()(graphContainer)
                .nodeRelSize(5)
                .nodeVal(() => 1)
                .nodeLabel(node => escapeHtml(node.name))
                .nodeColor(node => dependencyNodeColorWithAlpha(dependencyNodeColors[node.nodeClass] || '#6b7280', 0.65))
                .nodeCanvasObjectMode(() => 'after')
                .nodeCanvasObject((node, ctx, globalScale) => {
                    if (!dependencyForceShowLabels) return;
                    const fontSize = 12 / globalScale;
                    ctx.font = fontSize + 'px Ubuntu, Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillStyle = '#374151';
                    ctx.fillText(node.name, node.x, node.y + 7);
                })
                .linkColor(() => 'rgba(100,116,139,0.5)')
                .linkWidth(1.5)
                .linkDirectionalArrowLength(4)
                .linkDirectionalArrowRelPos(1)
                .linkDirectionalParticles(1)
                .linkDirectionalParticleSpeed(0.006)
                .linkLabel(link => escapeHtml(link.label))
                .onNodeClick(node => {
                    if (node.id.indexOf('brick:') === 0) {
                        window.open('landing_pages/' + node.id.substring('brick:'.length) + '.html', '_blank');
                    }
                })
                .graphData({nodes: nodes, links: links});

            dependencyForceInstance = Graph;
            sizeDependencyForce();
        }

        let dependencyForceShowLabels = false;

        function setDependencyForceLabels(show) {
            dependencyForceShowLabels = show;
            if (dependencyForceInstance && dependencyGraphView === 'force') {
